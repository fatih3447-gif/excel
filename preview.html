arklı yılları birleştirebilir. Yüzde hesaplamasında payda açık olmalıdır.","question":"250 tutarın 1000 genel toplam içindeki payı nedir?","options":["%4","%20","%25","%40"],"answer":2,"explanation":"250/1000 = 0,25, yani %25.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-pivot","video-tr"]},{"id":"m11l05","module":11,"n":5,"title":"Dilimleyicilerle etkileşim","body":"Dilimleyici, filtre durumunu düğmelerle görünür kılar. Birden fazla PivotTable’a bağlamak için uyumlu veri kaynağı veya ortak önbellek gerekir. Bir dilimleyicinin tüm raporu etkilediğini varsaymak yerine rapor bağlantılarını test et. Temizle seçeneğiyle filtresiz duruma dönüşü göster.","steps":["PivotTable’ı seç ve Bölge için dilimleyici ekle.","Bir veya birkaç bölge seçerek raporun değişimini gözle.","Rapor Bağlantıları’nı denetle; bağlı her pivotun filtreye gerçekten tepki verdiğini test et."],"example":"Dilimleyici → görünür filtre\nRapor bağlantıları → etkilenen pivotlar","pitfall":"Bir dilimleyici sayfadaki tüm grafikleri kendiliğinden kontrol etmez. Bağlantılar kurulmalıdır.","question":"Dilimleyicinin rapordaki önemli faydası nedir?","options":["Filtre durumunu görünür ve erişilebilir kılması","Veriyi otomatik silmesi","Formülleri gizlemesi","Dosyayı sıkıştırması"],"answer":0,"explanation":"Dilimleyici kullanıcıya hangi kapsamın seçili olduğunu açıkça gösterir.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-pivot","video-tr"]},{"id":"m11l06","module":11,"n":6,"title":"Yenile ve kaynağı doğrula","body":"Kaynak veri değiştiğinde pivot sonuçlarının güncellendiğini doğrulaman gerekir; yenileme davranışı sürüm ve ayara bağlı olabilir. Kaynağın gerçek Excel tablosu olması yeni satırların kapsama alınmasını kolaylaştırır. Yenileme sonrası kaynak toplamı ile pivot genel toplamını karşılaştırmak iyi bir kontrol alışkanlığıdır.","steps":["Kaynak tabloya yeni bir satış satırı ekle.","PivotTable’ı yenile; kaynak aralığının yeni satırı kapsadığını denetle.","Pivot genel toplamını bağımsız bir TOPLA kontrolüyle karşılaştır."],"example":"Kontrol: kaynak toplamı − pivot genel toplamı = 0","pitfall":"Eski kaynağa bağlı bir pivotu yenilemek, aralık dışındaki yeni kayıtları dahil etmez.","question":"Yenilemeden sonra yeni satırlar görünmüyorsa ilk kontrollerden biri nedir?","options":["Yazı tipi","Kaynak aralığının kapsamı","Sayfa rengi","Dosya simgesi"],"answer":1,"explanation":"Yeni kayıt kaynak aralığı dışında kalmış olabilir.","drill":null,"minutes":9,"real":"Gerçek Excel’de Satışlar tablosuna bir kayıt ekle. Pivotu yenile; satır sayısı ve toplamın beklenen fark kadar değiştiğini doğrula.","version":"Tüm sürümler","refs":["ms-pivot","video-tr"]},{"id":"m12l01","module":12,"n":1,"title":"CSV’yi Power Query ile içeri al","body":"Power Query, veriyi kaynaklardan alıp dönüşüm adımlarını kaydeder. CSV’yi doğrudan çift tıklamak yerine Veri \u003e Metinden/CSV yolunu kullanmak kodlama, ayraç ve veri türlerini daha bilinçli seçmeni sağlar. Önizlemede sütunların doğru ayrıldığını kontrol etmeden yükleme yapma.","steps":["Veri \u003e Veri Al \u003e Metinden/CSV yolundan örnek veri dosyasını seç.","Kodlama ve ayraç önizlemesini kontrol et; Verileri Dönüştür’ü seç.","Başlıkları ve sütunları denetledikten sonra Kapat ve Yükle ile çıktıyı oluştur."],"example":"Kaynak → önizleme → dönüştürme → yükleme","pitfall":"CSV’de Türkçe karakter bozulması genellikle kodlama; tek sütuna yığılma ise ayraç sorunu olabilir.","question":"CSV içe aktarımında yüklemeden önce neyi kontrol etmelisin?","options":["Ayraç, kodlama ve sütun önizlemesini","Yalnızca dosya adını","Masaüstü duvar kâğıdını","Makro rengini"],"answer":0,"explanation":"İçe aktarımın temel doğruluğu bu seçimlere bağlıdır.","drill":null,"minutes":9,"real":"Projelerden CSV indir. Gerçek Excel’de Metinden/CSV ile aç; UTF-8 ve noktalı virgül ayracını önizlemede denetle.","version":"Platforma göre değişir","refs":["ms-pq","ms-pqui","ms-model"]},{"id":"m12l02","module":12,"n":2,"title":"Veri türleri ve yerel ayar","body":"Power Query’de her sütunun türü, sonraki işlemlerin anlamını belirler. 1.234,50 gibi yerel sayı yazımları yanlış kültürle yorumlanabilir. Türü Değiştir \u003e Yerel Ayarı Kullan seçeneği özellikle tarih ve ondalık ayrımında önemlidir. Kimlikleri hesaplanacak sayı gibi değil, gerekiyorsa metin gibi sakla.","steps":["Ham sütundaki sayı ve tarih örneklerini incele.","Türü Değiştir \u003e Yerel Ayarı Kullan ile uygun tür ve kültürü seç.","Hata değerlerini, boşları ve önceki-sonraki örnekleri karşılaştır."],"example":"M örneği:\nTable.TransformColumnTypes(Kaynak, {{\"Tutar\", type number}}, \"tr-TR\")","pitfall":"Kimlikteki baştaki sıfırlar veya uzun basamaklar sayı türüne geçerken kaybolabilir.","question":"1.234,50 biçimli tutarın doğru yorumlanmasında ne önemlidir?","options":["Yerel ayar","Sütun rengi","Dosyanın simgesi","Yazıcı modeli"],"answer":0,"explanation":"Ondalık ve binlik ayraçlar kullanılan yerel kurala göre yorumlanır.","drill":null,"minutes":9,"real":"Veri Temizleme atölyesinde önce metinleri, sonra türleri düzelt. Aynı işlemi Power Query’de yerel ayarı açıkça seçerek tekrar et.","version":"Platforma göre değişir","refs":["ms-textnum","ms-pq","ms-pqui","ms-model"]},{"id":"m12l03","module":12,"n":3,"title":"Sorguları ekle: kayıtları alt alta koy","body":"Sorguları Ekle, aynı anlamdaki sütunlara sahip veri kümelerini alt alta birleştirir. Aylık satış dosyalarını tek listeye dönüştürmek tipik örnektir. Sütun adları uyuşmadığında beklenmeyen yeni sütunlar ve boşlar oluşabilir. Birleştirme sonrası satır sayısı beklenen toplamla karşılaştırılmalıdır.","steps":["Ocak ve Şubat verilerini iki ayrı sorgu olarak al.","Sütun adları ile türlerini uyumlu hale getir.","Sorguları Ekle ile alt alta birleştir; kayıt sayısını iki kaynağın toplamıyla doğrula."],"example":"M örneği:\nTable.Combine({Ocak, Subat})","pitfall":"Alt alta ekleme ile anahtara göre yan yana birleştirme farklı işlemlerdir.","question":"Ocak ve Şubat satış satırlarını alt alta toplamak için hangisi uygundur?","options":["Sorguları Ekle","DÜŞEYARA","İkincil eksen","Sayfa koruması"],"answer":0,"explanation":"Ekle işlemi benzer sütunlu kayıtları alt alta biriktirir.","drill":null,"minutes":9,"real":"Satışlar verisini iki aya bölüp ayrı CSV dosyaları yap. Power Query’de iki sorguyu ekle ve kayıt sayılarını karşılaştır.","version":"Platforma göre değişir","refs":["ms-pq","ms-pqui","ms-model"]},{"id":"m12l04","module":12,"n":4,"title":"Sorguları birleştir: anahtarla ilişkilendir","body":"Sorguları Birleştir, bir anahtara göre başka tablodan alanlar getirir. Sol dış birleştirme soldaki kayıtları korur ve bulunan sağ kayıtları ekler. Sağ anahtar tekil değilse genişletme sonrası satır sayısı artabilir. Eşleşmeyen kayıtları ayrı incelemek veri kalitesi kontrolüdür.","steps":["Satış ve Ürünler sorgularını aç; kod sütunlarının türlerini eşitle.","Kod alanlarıyla sol dış birleştirme kur.","Ürün alanlarını genişlet; satır sayısı artışı ve eşleşmeyen kayıtları denetle."],"example":"Satış[UrunKodu] → Ürünler[UrunKodu]\nKontrol: sağ tabloda kod tekil mi?","pitfall":"Birleştirme doğru anahtarla kurulsa bile sağdaki tekrarlar kayıtları çoğaltabilir.","question":"Birleştirme sonrası satır sayısı neden beklenmedik artabilir?","options":["Sağ anahtar yineleniyorsa","Yazı tipi büyüdüyse","Sayfa gizlendiyse","Başlık kalınsa"],"answer":0,"explanation":"Bir sol kayda birden çok sağ kayıt eşleşmesi, genişletmede satırları çoğaltır.","drill":null,"minutes":9,"real":"Stok listesini bir ürün ana tablosuyla birleştir. Bir ürün kodunu bilerek iki kez ekle; satır artışının nedenini incele, sonra ana tabloyu düzelt.","version":"Platforma göre değişir","refs":["ms-pq","ms-pqui","ms-model"]},{"id":"m12l05","module":12,"n":5,"title":"Sütunları özet dışı bırak ve grupla","body":"Her ayın ayrı sütunda olduğu geniş tablolar analiz için her zaman uygun değildir. Sütunları Özet Dışı Bırak işlemi ay başlıklarını satır değerlerine dönüştürür; ürün, ay, tutar biçimi elde edilir. Ardından Gruplandır ile uygun ayrıntı düzeyinde özet oluşturabilirsin.","steps":["Ürün, Ocak, Şubat sütunlu bir örnek tabloyu Power Query’ye al.","Ürün sütununu seç; Diğer Sütunları Özet Dışı Bırak uygula.","Oluşan alanlara Ay ve Tutar adını ver; ay bazında toplamla kaynak toplamını karşılaştır."],"example":"Önce: Ürün | Ocak | Şubat\nSonra: Ürün | Ay | Tutar","pitfall":"Boş değerlerin dönüşümdeki davranışını kontrol et. Satır sayısındaki değişim tek başına hata değildir.","question":"Özet dışı bırakma neyi sağlar?","options":["Aylık sütunları analiz edilebilir satırlara çevirmeyi","Tüm veriyi şifrelemeyi","Makro yazmayı","Grafik rengini değiştirmeyi"],"answer":0,"explanation":"Geniş yapı, anahtar-özellik-değer biçimindeki daha uzun yapıya dönüştürülür.","drill":null,"minutes":9,"real":"Gerçek Excel’de üç ürün ve iki aylık bir tabloyu özet dışı bırak. Önceki ve sonraki toplamların aynı kaldığını kontrol et.","version":"Platforma göre değişir","refs":["ms-pq","ms-pqui","ms-model"]},{"id":"m12l06","module":12,"n":6,"title":"Yenilenebilir ve izlenebilir sorgu kur","body":"Power Query’nin değeri, aynı dönüşümü yeni veriye yeniden uygulayabilmesidir. Kaynak yolu, sütun adları, veri türleri ve yetkiler değiştiğinde yenileme hata verebilir. Uygulanan Adımlar listesinde hatanın ilk ortaya çıktığı adımı bul. Ham veriyi koru, adımları anlamlı adlandır ve yükleme hedefini belgele.","steps":["Sorgunun kaynak yolunu ve yükleme hedefini not et.","Kaynağa kontrollü bir yeni kayıt ekle ve Tümünü Yenile çalıştır.","Kayıt sayısı, hata sayısı ve toplamları önceki sürümle karşılaştır."],"example":"Denetim kaydı: kaynak • yenileme zamanı • satır sayısı • hata sayısı","pitfall":"Yenilemenin tamamlanması, sonuçların iş açısından doğru olduğunu garanti etmez. Mutabakat kontrolleri gerekir.","question":"Yenileme sonrası hangi kontrol en anlamlıdır?","options":["Kaynak ve çıktı sayı/toplamlarının mutabakatı","Yalnızca pencerenin kapanması","Yalnızca sorgu adının rengi","Yazıcı seçimi"],"answer":0,"explanation":"Teknik olarak çalışan bir sorgu yanlış veya eksik veriyi de işleyebilir; sonuç doğrulanmalıdır.","drill":null,"minutes":9,"real":"Veri temizleme projesini bitir. Dönüşüm adımlarını, hariç tuttuğun kayıtları ve yenileme kontrollerini kısa bir notla belgeleyerek teslim et.","version":"Platforma göre değişir","refs":["ms-pq","ms-pqui","ms-model"]},{"id":"m13l01","module":13,"n":1,"title":"Veri modelini düşün","body":"Bir veri modeli, farklı konulardaki tabloları ilişkilerle birlikte ele alır. Satış hareketleri, ürün özellikleri ve takvim ayrı tablolarda tutulabilir. Aynı ürün adını her satış satırında yeniden düzeltmek yerine ürün ana tablosunu yönetmek daha sürdürülebilirdir. Önce her tablonun bir satırının ne anlama geldiğini tanımla.","steps":["Satış, Ürün ve Takvim tablolarını ayrı ayrı listele.","Her tablonun ayrıntı düzeyini ve benzersiz anahtarını yaz.","Uygun Excel sürümünde tabloları Veri Modeli’ne ekle; tablo rollerini denetle."],"example":"Satış: bir sipariş satırı\nÜrün: bir ürün\nTakvim: bir gün","pitfall":"Büyük tek tablo her zaman en iyi model değildir; fakat gereksiz parçalama da modeli karmaşıklaştırabilir.","question":"Model kurmadan önce her tablo için ne tanımlanmalıdır?","options":["Bir satırın anlamı ve anahtarı","Yalnızca rengi","Yalnızca dosya boyutu","Yazıcı ayarı"],"answer":0,"explanation":"Doğru ayrıntı düzeyi ve anahtar, bütün ilişkilerin temelidir.","drill":null,"minutes":9,"real":"Satışlar veri kümesinin bir satırını tarif et. Ayrı bir Ürünler tablosu tasarla; anahtarların benzersizliğini denetle.","version":"Power Pivot: uygun Windows sürümü","refs":["ms-model","ms-dax","video-mike"]},{"id":"m13l02","module":13,"n":2,"title":"Bire çok ilişkiler","body":"Ürün ana tablosundaki bir kod, satış tablosunda birçok kez geçebilir. Bu bire çok ilişkidir. Bir tarafındaki alanın tekil olması gerekir. Eşleşmeyen anahtarlar ve yanlış ilişki yönü beklenmeyen toplamlar üretebilir. Her ilişkiyi birkaç örnek kayıtla elle kontrol et.","steps":["Ürünler tablosunda ürün kodlarının tekil olduğunu doğrula.","Ürünler[UrunKodu] ile Satislar[UrunKodu] arasında ilişki kur.","Bir ürün filtresinin ilgili satışları doğru seçtiğini test et."],"example":"Ürünler (1) ── UrunKodu ── (*) Satışlar","pitfall":"Bir tarafında tekrar eden anahtarlar varsa ilişki modeli düzeltilmeden devam etme.","question":"Bire çok ilişkide hangi taraftaki anahtarın benzersiz olması gerekir?","options":["Çok tarafında","Bir tarafında","Her iki tabloda aynı sayıda satır olmalı","Hiçbirinde"],"answer":1,"explanation":"Bir tarafı her anahtar için tek kayıt içermelidir.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Power Pivot: uygun Windows sürümü","refs":["ms-model","ms-dax","video-mike"]},{"id":"m13l03","module":13,"n":3,"title":"Yıldız şema ve boyutlar","body":"Yıldız şemada işlemleri taşıyan bir olgu tablosu, açıklayıcı boyut tablolarıyla çevrilir. Satış tutarı olguda; ürün adı ve kategori ürün boyutunda bulunur. Bu düzen, filtrelerin ve ölçülerin anlaşılmasını kolaylaştırır. Modelin basitliğini koru ve döngüsel ilişki yollarından kaçın.","steps":["Satış tablosundaki tutar ve adet gibi ölçülebilir alanları belirle.","Ürün, bölge ve tarih gibi açıklayıcı alanları boyut tablolarında düzenle.","Boyutlardan satışlara kurulan ilişkileri şema üzerinde çiz ve test et."],"example":"Ürün → Satış ← Takvim\nBölge → Satış","pitfall":"Her sütun için ayrı tablo açmak yıldız şema değildir. Boyutları iş anlamına göre oluştur.","question":"Ürün adı ve kategori genellikle hangi tabloda tutulur?","options":["Ürün boyutunda","Yalnızca grafik içinde","Hata tablosunda","Rastgele bir sayfada"],"answer":0,"explanation":"Ürün boyutu ürünün açıklayıcı özelliklerini taşır.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Power Pivot: uygun Windows sürümü","refs":["ms-model","ms-dax","video-mike"]},{"id":"m13l04","module":13,"n":4,"title":"Ölçü ile hesaplanan sütunu ayır","body":"Hesaplanan sütun her satır için bir değer üretir. Ölçü ise raporun filtre bağlamına göre hesaplanır. Bölge seçildiğinde değişen net satış toplamı bir ölçüdür. DAX, hücre başvuruları yerine tablo ve sütun adlarıyla çalışır; normal çalışma sayfası formülleriyle aynı dil değildir.","steps":["Veri Modeli’ndeki Satislar tablosunu aç.","NetSatis := SUM(Satislar[NetTutar]) ölçüsünü tanımla.","Ölçüyü PivotTable’a ekle ve farklı bölge filtrelerinde sonucu karşılaştır."],"example":"DAX:\nNetSatis := SUM(Satislar[NetTutar])","pitfall":"DAX örnekleri hücreye normal Excel formülü gibi yazılmaz; veri modelinde ölçü olarak tanımlanır.","question":"Bir ölçünün sonucu neye göre değişebilir?","options":["Raporun filtre bağlamına","Yalnızca dosya adına","Yazı tipi büyüklüğüne","Hücre rengine"],"answer":0,"explanation":"Ölçü, etkin filtre bağlamında yeniden değerlendirilir.","drill":null,"minutes":9,"real":"Uygun Power Pivot ortamında NetSatis ölçüsü oluştur. Aynı ölçüyü bölge ve ay kırılımlarında kullan; toplamları kaynakla karşılaştır.","version":"Power Pivot: uygun Windows sürümü","refs":["ms-model","ms-dax","video-mike"]},{"id":"m13l05","module":13,"n":5,"title":"CALCULATE ile filtre bağlamı","body":"CALCULATE, bir ifadeyi değiştirilmiş filtre bağlamında hesaplar. Belirli ürün kategorisini sabitlemek veya bir filtreyi kaldırarak genel toplam payını bulmak için kullanılır. Etkisini anlamak için önce temel ölçüyü kur, sonra tek bir filtre değişikliği ekle. Karmaşık ölçülerde bağlamı küçük adımlarla test et.","steps":["Önce NetSatis temel ölçüsünü oluştur.","DoguSatis := CALCULATE([NetSatis], Satislar[Bolge] = \"Doğu\") ölçüsünü ekle.","Filtreleri değiştirerek temel ölçü ile sabit bölge ölçüsünün davranışını karşılaştır."],"example":"DAX:\nDoguSatis := CALCULATE([NetSatis], Satislar[Bolge] = \"Doğu\")","pitfall":"CALCULATE yalnızca bir koşullu TOPLA kısaltması değildir; filtre bağlamını değiştirir.","question":"CALCULATE’ın temel rolü nedir?","options":["Filtre bağlamını değiştirerek hesaplamak","Hücreleri boyamak","Dosyaları yeniden adlandırmak","VBA çalıştırmak"],"answer":0,"explanation":"CALCULATE, verilen ifadeyi değiştirilmiş filtre bağlamında değerlendirir.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Power Pivot: uygun Windows sürümü","refs":["ms-model","ms-dax","video-mike"]},{"id":"m13l06","module":13,"n":6,"title":"DIVIDE, takvim ve oranlar","body":"Oranları satır oranlarının basit ortalaması olarak değil, iş tanımına uygun pay ve paydadan hesaplamak gerekir. DAX DIVIDE sıfır payda gibi durumları yönetmek için uygundur. Zaman analizlerinde düzenli bir takvim tablosu ve doğru tarih ilişkisi önemlidir. Sonucu yalnızca genel toplamda değil alt gruplarda da doğrula.","steps":["Takvimde her günü tek kez içeren tarih sütunu oluştur.","Satış tarihiyle takvim tarihi arasında uygun ilişki kur.","OrtalamaBirim := DIVIDE(SUM(Satislar[NetTutar]), SUM(Satislar[Adet])) ölçüsünü test et."],"example":"DAX:\nOrtalamaBirim := DIVIDE(SUM(Satislar[NetTutar]), SUM(Satislar[Adet]))","pitfall":"Toplamların oranı ile oranların ortalaması farklıdır. Önce hangi ölçünün istendiğini tanımla.","question":"Ağırlıklı ortalama birim tutar için doğru genel yaklaşım hangisidir?","options":["Satır fiyatlarının her durumda basit ortalaması","Toplam net tutar / toplam adet","En büyük fiyat / satır sayısı","Toplam fiyat / bölge sayısı"],"answer":1,"explanation":"Adet ağırlıklı birim tutar toplam tutarın toplam adede bölünmesiyle hesaplanır.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Power Pivot: uygun Windows sürümü","refs":["ms-model","ms-dax","video-mike"]},{"id":"m14l01","module":14,"n":1,"title":"Modelin girdilerini ve sonucunu ayır","body":"Bir karar modeli girdi, varsayım ve sonuç hücrelerini ayırmalıdır. Örneğin örnek kâr hesabında fiyat, birim değişken maliyet, adet ve sabit gider ayrı girdilerdir. Hesaplanan hücreye elle sonuç yazmak modeli bozar. Birimleri ve dönemi açıkça belirtmek yanlış karşılaştırmaları önler.","steps":["B2’ye fiyat, C2’ye birim maliyet, D2’ye adet, E2’ye sabit gider gir.","F2’de =(B2-C2)*D2-E2 ile örnek dönem sonucunu hesapla.","Her girdiyi tek tek değiştir; sonucun beklenen yönde değiştiğini kontrol et."],"example":"=(B2-C2)*D2-E2\nÖrnek eğitim modeli; vergi ve diğer giderler dahil değildir.","pitfall":"Basitleştirilmiş bir model gerçek işin bütün kalemlerini kapsamaz. Kapsam dışı unsurları yaz.","question":"Hesaplama hücresine elle sonuç yazmanın riski nedir?","options":["Formül bağlantısını bozması","Dosyayı otomatik yedeklemesi","Yazdırmayı hızlandırması","Veriyi doğrulaması"],"answer":0,"explanation":"Girdi değişince hesaplanması gereken sonuç artık güncellenmez.","drill":{"prompt":"Birim katkı × adet − sabit gider formülünü kur.","seed":{"B2":100,"C2":60,"D2":50,"E2":1000},"solution":"=(B2-C2)*D2-E2","cases":[{"cells":{"B2":100,"C2":60,"D2":50,"E2":1000},"expected":1000},{"cells":{"B2":100,"C2":60,"D2":80,"E2":1000},"expected":2200}],"target":"F2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Masaüstü / eklentiye bağlı","refs":["ms-goal","ms-solver","ms-functions"]},{"id":"m14l02","module":14,"n":2,"title":"Hedef Arama ile ters hesapla","body":"Hedef Arama, istediğin formül sonucuna ulaşmak için tek bir giriş hücresini değiştirir. Sonuç hücresinin bu girdiye bağlı bir formül içermesi gerekir. Örneğin basitleştirilmiş kârı sıfıra getiren satış adedini arayabilirsin. Sonuç gerçekçi sınırlar ve birim kısıtları açısından ayrıca incelenmelidir.","steps":["Kâr formülünü ve ona bağlı adet girişini hazırla.","Veri \u003e Durum Çözümlemesi \u003e Hedef Arama yolunu aç.","Sonuç hücresini 0’a, değişecek hücreyi adede ayarla; bulunan değeri formülde doğrula."],"example":"Örnek: fiyat 100, birim maliyet 60, sabit gider 1000\nBaşabaş adet: 1000 / (100-60) = 25","pitfall":"Hedef Arama tek değişkenle çalışır ve tam sayı gibi iş kısıtlarını kendiliğinden çözmez.","question":"Hedef Arama kaç değişken giriş hücresiyle çalışır?","options":["Bir","Her zaman iki","Sınırsız","Hiçbir girişle"],"answer":0,"explanation":"Hedef Arama tek bir değişken giriş değerini ayarlar.","drill":null,"minutes":9,"real":"Gerçek Excel’de örnek modeli kur ve kârı sıfıra getiren adedi Hedef Arama ile bul. Fiyat maliyetten küçükse modelin davranışını tartış.","version":"Masaüstü / eklentiye bağlı","refs":["ms-goal","ms-solver","ms-functions"]},{"id":"m14l03","module":14,"n":3,"title":"Senaryo ve duyarlılık analizi","body":"Tek bir tahmin yerine farklı varsayım bileşimlerini karşılaştırmak kararın hangi girdilere duyarlı olduğunu gösterir. Temel, düşük ve yüksek senaryolar oluşturabilirsin. Excel’in Durum Çözümlemesi araçları bu karşılaştırmayı destekler. Senaryolar olasılık garantisi değil, tanımlanmış varsayımların sonuçlarıdır.","steps":["Fiyat ve adet için üç gerekçeli senaryo tanımla.","Her senaryoda aynı sonuç formülünü kullan; girdi ve sonuçları karşılaştırmalı tabloya koy.","Bir girdiyi sabit tutup diğerini değiştirerek sonucun hangi etkiden kaynaklandığını incele."],"example":"Temel: fiyat 100, adet 50\nDüşük adet: fiyat 100, adet 30\nYüksek adet: fiyat 100, adet 80","pitfall":"Senaryo etiketleri gerçek olasılıkları göstermez; varsayım ve dayanaklarını açıkla.","question":"Duyarlılığı izole etmek için nasıl bir deneme yararlıdır?","options":["Her şeyi aynı anda rastgele değiştirmek","Bir girdiyi değiştirirken diğerlerini sabit tutmak","Sonucu elle düzeltmek","Tüm veriyi silmek"],"answer":1,"explanation":"Diğer girdileri sabit tutmak değişen girdinin etkisini ayırır.","drill":null,"minutes":9,"real":"Gerçek Excel’de üç senaryolu bir karşılaştırma tablosu kur. Ardından fiyat ve adet için iki değişkenli veri tablosu aracını incele; bu araç HTML simülatöründe çalışmaz.","version":"Masaüstü / eklentiye bağlı","refs":["ms-goal","ms-solver","ms-functions"]},{"id":"m14l04","module":14,"n":4,"title":"Çözücü: amaç, değişkenler ve kısıtlar","body":"Çözücü bir amaç değerini, karar değişkenlerini değiştirerek ve kısıtları gözeterek iyileştirmeye çalışır. Kaynak kapasitesi, negatif olmayan üretim ve tam sayı şartları tipik kısıtlardır. Doğru yöntem seçimi modelin yapısına bağlıdır. Bulunan sonucun mümkün ve anlamlı olduğunu ayrıca test et.","steps":["Maksimize veya minimize edilecek amaç hücresini formülle tanımla.","Karar değişkenlerini ve kapasite, alt sınır, tam sayı gibi kısıtları belirle.","Çözücü eklentisinde modeli kur; çözümün bütün kısıtları sağladığını denetle."],"example":"Amaç: toplam katkıyı artır\nDeğişkenler: iki ürünün üretim adetleri\nKısıt: toplam saat ≤ kapasite; adetler ≥ 0","pitfall":"Kısıtları eksik yazmak matematiksel olarak iyi ama iş açısından imkânsız bir çözüm üretir.","question":"Üretim kapasitesi modelde genellikle ne olarak tanımlanır?","options":["Kısıt","Yazı biçimi","Sayfa adı","Dilimleyici rengi"],"answer":0,"explanation":"Kapasite, çözümün aşamayacağı bir sınırdır.","drill":null,"minutes":9,"real":"Uygun masaüstü Excel’de iki ürünlü küçük bir kapasite problemi kur. Amaç, değişkenler ve kısıtları ayrı satırlarda belgeleyerek Çözücü’yü çalıştır.","version":"Masaüstü / eklentiye bağlı","refs":["ms-goal","ms-solver","ms-functions"]},{"id":"m14l05","module":14,"n":5,"title":"Ortalama, medyan ve yayılım","body":"Tek bir ortalama, verinin tamamını anlatmaz. Çok büyük bir uç değer ortalamayı ciddi biçimde değiştirebilir; medyan sıralı verinin ortasındaki değeri temsil eder. Yayılım ölçüleri de gözlemlerin birbirine ne kadar yakın olduğunu gösterir. Kullandığın istatistiği veri ve soruyla uyumlu seç.","steps":["B2:B6’ya 10, 11, 12, 13 ve 100 gir.","ORTALAMA ve ORTANCA sonuçlarını karşılaştır.","100’ü 14 yapıp iki ölçünün nasıl değiştiğini gözle."],"example":"=ORTALAMA(B2:B6) → 29,2\n=ORTANCA(B2:B6) → 12","pitfall":"Uç değeri yalnızca hoşuna gitmediği için silme; veri hatası mı gerçek gözlem mi olduğunu araştır.","question":"10, 11, 12, 13, 100 listesinin medyanı nedir?","options":["12","29,2","50","100"],"answer":0,"explanation":"Sıralı beş değerin ortasındaki üçüncü değer 12’dir.","drill":{"prompt":"B2:B6 aralığının medyanını hesapla.","seed":{"B2":10,"B3":11,"B4":12,"B5":13,"B6":100},"solution":"=ORTANCA(B2:B6)","cases":[{"cells":{"B2":10,"B3":11,"B4":12,"B5":13,"B6":100},"expected":12},{"cells":{"B2":10,"B3":11,"B4":20,"B5":13,"B6":100},"expected":13}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Masaüstü / eklentiye bağlı","refs":["ms-goal","ms-solver","ms-functions"]},{"id":"m14l06","module":14,"n":6,"title":"Tahminleri sınırlarıyla raporla","body":"Bir tahmin geleceği kesin olarak söylemez; geçmiş veri ve varsayımlar üzerine kuruludur. Mevsimsellik, veri eksikliği ve iş koşullarındaki değişim sonucu etkileyebilir. Modeli yalnızca geçmişi iyi açıkladığı için seçme; mümkünse daha önce görmediği dönemlerde performansını kontrol et.","steps":["Veriyi tarih sırasına koy ve eksik dönemleri incele.","Son birkaç dönemi test için ayır; daha eski verilerle basit bir tahmin yaklaşımı kur.","Tahmini test dönemiyle karşılaştır; hata ölçüsünü ve modelin sınırlamalarını yaz."],"example":"Eğitim dönemi → model kurma\nTest dönemi → gerçek sonuçla karşılaştırma","pitfall":"Geleceğe ait veriyi eğitim hesabına sızdırmak, gerçekçi olmayan başarı gösterir.","question":"Tahmin performansı neden ayrılmış bir dönemde test edilir?","options":["Görülmemiş verideki davranışı değerlendirmek için","Dosyayı büyütmek için","Grafiği renklendirmek için","Kaynak veriyi silmek için"],"answer":0,"explanation":"Test dönemi, geçmişe uyumun dışına çıkarak genelleme davranışını değerlendirmeye yardım eder.","drill":null,"minutes":9,"real":"Satış verisinde son ayı ayır. Önceki aylara dayalı basit bir karşılaştırma kur ve tahmin ile gerçekleşen arasındaki farkı raporla. Eğitim verisi gerçek bir ticari tahmin için yeterli değildir.","version":"Masaüstü / eklentiye bağlı","refs":["ms-goal","ms-solver","ms-functions"]},{"id":"m15l01","module":15,"n":1,"title":"Makro kaydı ve güvenli başlangıç","body":"Makro kaydı, tekrar ettiğin işlemleri VBA komutlarına dönüştürmeyi öğrenmek için yararlıdır. Kaydedilen kod çoğu zaman gereksiz seçimler içerir; inceleyip sadeleştirmek gerekir. Makrolar yalnızca güvendiğin dosyalarda çalıştırılmalıdır. Güvenlik ayarlarını tüm makroları açacak biçimde gevşetmek doğru bir eğitim yöntemi değildir.","steps":["Boş bir deneme kitabını XLSM olarak kaydet.","Geliştirici \u003e Makro Kaydet ile başlığı kalınlaştırma ve sütunu genişletme işlemlerini kaydet.","Kaydı durdur; oluşan kodu incele ve yalnızca bu deneme dosyasında yeniden çalıştır."],"example":"Öğrenme döngüsü: kaydet → incele → sadeleştir → kopyada test et","pitfall":"Tanımadığın kaynaktan gelen bir dosyanın makrolarını etkinleştirme. Kuruluş politikalarına uy.","question":"Makro denemesi için en güvenli başlangıç hangisidir?","options":["Tanımadığın dosyada tüm makroları açmak","Kendi oluşturduğun boş test kitabında çalışmak","Güvenlik uyarılarını kapatmak","Asıl raporun tek kopyasında çalışmak"],"answer":1,"explanation":"Kontrollü bir test kitabı veri kaybı ve beklenmeyen işlem riskini azaltır.","drill":null,"minutes":9,"real":"Kendi oluşturduğun XLSM test kitabında basit bir başlık biçimlendirme makrosu kaydet. Kodu okumadan başka dosyada çalıştırma.","version":"Platform ve lisansa bağlı","refs":["ms-vba","ms-scripts"]},{"id":"m15l02","module":15,"n":2,"title":"VBA nesneleri ve açık başvurular","body":"VBA’da çalışma kitabı, sayfa ve aralık nesnelerdir. Kodun hangi kitabı ve sayfayı değiştirdiği açık olmalıdır. ActiveSheet gibi o anda seçili nesneye bağlı kodlar, kullanıcı başka sayfadayken yanlış alanı değiştirebilir. ThisWorkbook kodun bulunduğu kitabı temsil eder.","steps":["Test kitabında Rapor adlı bir sayfa oluştur.","VBA düzenleyicisinde standart modüle örnek yordamı ekle.","Başka sayfayı seçerek çalıştır; yalnızca Rapor başlığının değiştiğini doğrula."],"example":"Sub BaslikBicimlendir()\n    ThisWorkbook.Worksheets(\"Rapor\").Range(\"A1:C1\").Font.Bold = True\nEnd Sub","pitfall":"Sayfa adı yoksa kod hata verir. Hedef nesneleri ve ön koşulları kontrol et.","question":"ThisWorkbook genellikle hangi kitabı belirtir?","options":["Kodun bulunduğu kitabı","Her zaman en son indirilen dosyayı","Bütün açık kitapları","Yalnızca yeni boş kitabı"],"answer":0,"explanation":"ThisWorkbook kodu barındıran çalışma kitabıdır.","drill":null,"minutes":9,"real":"Test kitabında Rapor sayfasını oluştur ve örnek makroyu uygula. Sayfa adı yanlış olduğunda alınan hatayı incele; gerçek dosyaları değiştirme.","version":"Platform ve lisansa bağlı","refs":["ms-vba","ms-scripts"]},{"id":"m15l03","module":15,"n":3,"title":"Değişken, koşul ve döngü","body":"Değişken ara bilgiyi tutar, koşul farklı durumlara göre karar verir, döngü işlemi tekrarlar. Option Explicit değişken bildirimini zorunlu kılarak yazım hatalarını yakalamaya yardım eder. Büyük bir otomasyon yazmadan önce küçük aralıklarda gözlenebilir sonuçlar üret.","steps":["Modülün başına Option Explicit ekle.","Long türünde satır değişkeni tanımla ve 2’den 5’e döngü kur.","Her satıra satır numarasını yazdır; beklenen dört hücreyi kontrol et."],"example":"Option Explicit\nSub Numarala()\n    Dim satir As Long\n    For satir = 2 To 5\n        ThisWorkbook.Worksheets(\"Rapor\").Cells(satir, 1).Value = satir - 1\n    Next satir\nEnd Sub","pitfall":"Döngü sınırını yanlış seçmek başlığı veya gereksiz satırları değiştirebilir. Önce küçük kopyada test et.","question":"Option Explicit neye yardımcı olur?","options":["Değişkenlerin açıkça bildirilmesine","Tüm hataların gizlenmesine","Dosyanın şifrelenmesine","Grafik eklenmesine"],"answer":0,"explanation":"Değişken bildirimini zorunlu tutarak yanlış yazılmış değişken adlarını yakalamayı kolaylaştırır.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Platform ve lisansa bağlı","refs":["ms-vba","ms-scripts"]},{"id":"m15l04","module":15,"n":4,"title":"Otomasyonda hata ve geri dönüş","body":"Bir otomasyonun başarılı durumda çalışması yeterli değildir; eksik sayfa, boş veri veya yanlış tür gibi durumları da ele almalıdır. İşleme başlamadan ön koşulları denetle, işlem günlüğü tut ve kullanıcıya anlamlı hata ver. Geri alma her makro işleminde güvenilir bir kurtarma yolu değildir; yedek kopya önemlidir.","steps":["Asıl dosyanın kopyasını oluştur ve beklenen sayfa/sütunları kontrol et.","Küçük bir veri örneğinde çalıştır; işlem öncesi ve sonrası kayıt sayısını kaydet.","Boş veri ve eksik sayfa senaryolarını deneyip açıklayıcı hata davranışını doğrula."],"example":"Kontroller: hedef sayfa • beklenen başlıklar • veri sayısı • yedek","pitfall":"On Error Resume Next ile tüm hataları sessizce geçmek başarı değil, görünmez hata üretir.","question":"Hata yönetiminde hangi yaklaşım sakıncalıdır?","options":["Ön koşulları kontrol etmek","Test kopyası kullanmak","Bütün hataları sessizce yok saymak","İşlem günlüğü tutmak"],"answer":2,"explanation":"Sessizce yoksayılan hatalar eksik veya yanlış işlemi fark etmeyi engeller.","drill":null,"minutes":9,"real":"Test makrosu için üç başarısızlık senaryosu yaz. Asıl dosyaya geçmeden her senaryoda kullanıcıya ne bildirileceğini belirle.","version":"Platform ve lisansa bağlı","refs":["ms-vba","ms-scripts"]},{"id":"m15l05","module":15,"n":5,"title":"Office Scripts ile ilk betik","body":"Office Scripts, desteklenen Excel ortamlarında eylemleri kaydetme ve TypeScript tabanlı kodla otomasyon oluşturma imkânı verir. Kullanılabilirlik hesap, platform, lisans ve yönetici ayarlarına bağlıdır. Bu HTML uygulaması betikleri Excel’e bağlayıp çalıştırmaz; güvenli örnek ve uygulama adımı sunar.","steps":["Excel’de Otomatikleştir sekmesinin hesabında kullanılabildiğini kontrol et.","Test kitabında yeni betik oluştur ve örnek kodu gir.","Çalıştır; A1 hücresinin değiştiğini doğrula ve betiğe anlamlı ad ver."],"example":"function main(workbook: ExcelScript.Workbook) {\n  const sheet = workbook.getActiveWorksheet();\n  sheet.getRange(\"A1\").setValue(\"Merhaba Excel\");\n}","pitfall":"Aktif sayfaya yazan örnek yalnızca test içindir. Gerçek otomasyonda hedef sayfayı açıkça seçip varlığını denetle.","question":"Office Scripts örnek kodları hangi dilin yapısını kullanır?","options":["VBA","TypeScript","SQL","Yalnızca hücre formülü"],"answer":1,"explanation":"Office Scripts, TypeScript tabanlı bir programlama deneyimi sunar.","drill":null,"minutes":9,"real":"Hesabında özellik varsa boş bir test kitabında örnek betiği çalıştır. Yoksa kodun her satırının görevini not et; uygulama özelliğin sende açık olduğunu varsaymaz.","version":"Platform ve lisansa bağlı","refs":["ms-vba","ms-scripts"]},{"id":"m15l06","module":15,"n":6,"title":"Doğru otomasyon aracını seç","body":"Formüller hücre hesapları, Power Query veri alma ve dönüştürme, VBA masaüstü nesne otomasyonu, Office Scripts ise desteklenen ortamlarda betik tabanlı otomasyon için farklı güçlü yönlere sahiptir. Power Automate bağlantıları kuruluş koşullarına bağlıdır. Aracı popüler olduğu için değil işin kapsamına göre seç.","steps":["İşin girdisini, çıktısını, tekrar sıklığını ve çalışma ortamını yaz.","Hesaplama, veri temizleme veya kullanıcı arayüzü otomasyonu olup olmadığını ayır.","En basit uygun aracı seç; küçük pilotta doğruluk ve hata yönetimini test et."],"example":"Aylık CSV temizleme → Power Query\nHücre hesabı → formül\nMasaüstü nesne işlemleri → VBA\nDesteklenen betik akışı → Office Scripts","pitfall":"Bulut akışlarını planlamadan önce lisans, yetki, veri gizliliği ve güncel özellik koşullarını doğrula.","question":"Her ay aynı CSV temizleme adımları için ilk düşünülecek araç hangisidir?","options":["Power Query","Rastgele makrolar","Hücre rengi","Baskı önizleme"],"answer":0,"explanation":"Power Query aynı veri dönüşümlerini yeniden uygulamak için uygundur.","drill":null,"minutes":9,"real":"Kendi işinden tekrarlanan bir Excel görevi seç. Araç seçimini, beklenen faydayı, riskleri ve test planını tek sayfalık notta açıkla.","version":"Platform ve lisansa bağlı","refs":["ms-vba","ms-scripts"]},{"id":"m16l01","module":16,"n":1,"title":"Formülleri denetle ve sınırları test et","body":"Doğru sonuç veren tek örnek, formülün her durumda doğru olduğunu göstermez. Sıfır, boş, negatif, bulunamayan ve sınırdaki değerleri dene. Excel’in formül değerlendirme ve başvuru izleme araçları hesap akışını görmeye yardım eder. Bağımsız kontrol toplamları sessiz hataları yakalayabilir.","steps":["Formülün beklediği girdi türlerini ve sınırları yaz.","Normal, sınır ve hatalı girdilerle küçük bir test tablosu oluştur.","Sonuçları bağımsız yöntemle karşılaştır; fark varsa başvuruları ve işlem sırasını izle."],"example":"Asgari testler: 0 • boş • sınır • eşleşmeyen kod • büyük değer","pitfall":"Hata mesajı olmaması doğruluk kanıtı değildir. Yanlış hücreye bağlı formül sayısal ama hatalı sonuç verebilir.","question":"Formülün hata mesajı vermemesi neyi garanti eder?","options":["İş açısından doğruluğu","Hiçbir iş mantığı garantisi vermez","Verinin tamlığını","Tüm sürümlerde uyumu"],"answer":1,"explanation":"Bir formül sözdizimsel olarak çalışıp yanlış iş hesabını yapabilir.","drill":null,"minutes":9,"real":"Proje dosyalarındaki üç önemli formül için en az üçer test senaryosu oluştur. Beklenen ve gerçekleşen sonuçları yan yana yaz.","version":"Tüm sürümler","refs":["ms-errors","ms-protect","ms-tips","ms-start"]},{"id":"m16l02","module":16,"n":2,"title":"Performans ve sürdürülebilirlik","body":"Yavaş bir kitapta önce sorunun kaynağını ölçmek gerekir. Gereksiz büyük aralıklar, yinelenen pahalı hesaplar, aşırı biçimlendirme ve çok sayıda bağımlılık etkili olabilir. Yardımcı sütunlar bazen tek dev formülden daha anlaşılır ve hızlıdır. Hesaplamayı el ile moda almak doğruluk riskini artırabilir.","steps":["Dosyanın kopyasında yavaş işlemi ve bekleme noktasını belirle.","Gereksiz tüm sütun başvurularını ve yinelenen hesapları incele.","Bir değişiklik yap, sonucu ve hesaplama davranışını önceki sürümle karşılaştır."],"example":"Önce ölç → tek değişiklik → tekrar ölç → sonuçları doğrula","pitfall":"Performans için formülleri değerlere çevirmek güncellenebilirliği kaybettirir; bunu bilinçli ve belgeli yap.","question":"Performans iyileştirmesinde iyi deney yaklaşımı hangisidir?","options":["Aynı anda her şeyi değiştirmek","Bir değişikliği ölçerek test etmek","Bütün uyarıları kapatmak","Tüm formülleri silmek"],"answer":1,"explanation":"Tek değişiklikle ölçmek etkinin kaynağını ayırmayı kolaylaştırır.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-errors","ms-protect","ms-tips","ms-start"]},{"id":"m16l03","module":16,"n":3,"title":"Koruma ile güvenliği karıştırma","body":"Sayfa koruması, kullanıcıların belirli hücreleri değiştirmesini sınırlamak içindir; hassas veriyi gizleyen bir güvenlik sınırı değildir. Dosya erişimi, şifreleme, paylaşım izinleri ve kuruluş politikaları ayrı değerlendirilir. Gizlenen sayfa da sır saklama yöntemi değildir. Girdi hücreleri ile formül hücrelerini ayır.","steps":["Düzenlenebilecek giriş hücrelerinin kilidini kaldır.","Sayfa korumasını aç ve kullanıcıya izin verilen işlemleri belirle.","Girişin mümkün, formül değişikliğinin engelli olduğunu test et; dosya erişim izinlerini ayrıca denetle."],"example":"Sayfa koruması → düzenleme kontrolü\nDosya güvenliği → erişim ve şifreleme","pitfall":"Sayfa koruma parolasını hassas veriyi koruyan şifrelemeyle eş tutma.","question":"Sayfa koruması hassas veriyi şifreleyen bir güvenlik mekanizması mıdır?","options":["Evet, her durumda","Hayır; esasen düzenlemeyi sınırlar","Yalnızca grafiklerde","Yalnızca CSV’de"],"answer":1,"explanation":"Microsoft sayfa düzeyi korumayı güvenlik özelliği olarak tanımlamaz; erişim ve dosya şifrelemesi ayrıdır.","drill":null,"minutes":9,"real":"Proje dosyasında yalnızca giriş hücrelerini düzenlenebilir bırak. Hassas gerçek veri kullanmadan koruma davranışını test et.","version":"Tüm sürümler","refs":["ms-errors","ms-protect","ms-tips","ms-start"]},{"id":"m16l04","module":16,"n":4,"title":"Paylaşım, sürüm ve veri sözlüğü","body":"Bir dosyanın sürdürülebilir olması için başkasının ölçüleri, girdileri ve yenileme yöntemini anlayabilmesi gerekir. Veri sözlüğü her alanın anlamını, türünü ve kaynağını açıklar. Paylaşım ortamına göre sürüm geçmişi ve birlikte çalışma özellikleri değişebilir. Tek bir doğrulanmış ana dosya ve açık sorumluluk belirle.","steps":["Alan adları, birimleri ve kaynakları için Veri Sozlugu sayfası oluştur.","Yenileme adımlarını, sorumluyu ve kontrol listesini ekle.","Paylaşım izinlerini denetle; alıcının Excel sürümünde örnek açılış testi yap."],"example":"Alan: NetTutar\nTanım: Adet × BirimFiyat × (1−İndirim)\nBirim: eğitim verisinde TL\nKapsam: vergi ve kargo dahil değil","pitfall":"Dosya adında son_final_en_son gibi belirsiz çoğaltmalar yerine sürüm ve sorumluluk sistemi kullan.","question":"Veri sözlüğü neden gereklidir?","options":["Alanların anlamını ve kullanımını ortaklaştırmak için","Dosyayı büyütmek için","Şifreleri saklamak için","Yalnızca logo eklemek için"],"answer":0,"explanation":"Aynı alanın herkes tarafından aynı biçimde anlaşılmasını sağlar.","drill":null,"minutes":9,"real":"Proje kitabına veri sözlüğü ve Yenileme Talimati sayfası ekle. Formüllerin ve kaynakların bağımlılıklarını not et.","version":"Tüm sürümler","refs":["ms-errors","ms-protect","ms-tips","ms-start"]},{"id":"m16l05","module":16,"n":5,"title":"Erişilebilir ve anlaşılır rapor","body":"Bir rapor renk ayrımı yapamayan, küçük ekran kullanan veya yardımcı teknolojiyle çalışan kişiler için de anlaşılır olmalıdır. Yalnızca renk kullanmak yerine metin ve simgeyle durumu belirt. Okunur başlıklar, yeterli karşıtlık ve anlamlı grafik açıklamaları ekle. Excel’in erişilebilirlik denetimini de değerlendir.","steps":["Raporu renksiz düşün; önemli durumların hâlâ anlaşılıp anlaşılmadığını kontrol et.","Grafiklere anlamlı başlık ve açıklama ekle; karmaşık birleştirilmiş hücreleri azalt.","Erişilebilirlik denetimini çalıştırıp bulguları gözden geçir."],"example":"Renk + metin: Kritik / Normal\nGrafik başlığı: 2026 Ocak–Mart net satış eğilimi","pitfall":"Kırmızı ve yeşili tek bilgi taşıyıcısı yapmak erişilebilirliği azaltır.","question":"Riskli bir durumu göstermek için en iyi yaklaşım hangisidir?","options":["Yalnızca kırmızı renk","Renkle birlikte açık durum metni","Metni gizlemek","Yalnızca hücre kenarı"],"answer":1,"explanation":"Birden çok gösterim kanalı daha fazla kullanıcının bilgiyi anlamasını sağlar.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-errors","ms-protect","ms-tips","ms-start"]},{"id":"m16l06","module":16,"n":6,"title":"Son teslim: açıklayabiliyor musun?","body":"Profesyonel Excel kullanımı bir işlev listesini ezberlemek değildir. Bir iş sorusunu doğru veriyle çözmek, sonucu doğrulamak, kısıtları açıklamak ve dosyayı başkasının sürdürebileceği biçimde teslim etmek gerekir. Uygulamadaki puanlar öğrenme göstergesidir; gerçek iş yetkinliğinin yerine geçmez.","steps":["Dört proje için gereksinimleri ve kontrol ölçütlerini gözden geçir.","Dosyaları sıfırdan açıp yenile; sonuçları beklenen değerlerle karşılaştır.","Raporun neyi gösterdiğini, neyi göstermediğini ve nasıl güncelleneceğini kısa sunumla açıkla."],"example":"Teslim paketi: çalışma kitabı + veri sözlüğü + kontrol sonuçları + yenileme notu","pitfall":"Otomatik testler sadece belirli sonuçları kontrol eder. Gerçek dosyanın kalite ve güvenlik incelemesi insan değerlendirmesi gerektirir.","question":"Profesyonel teslimin en güçlü göstergesi hangisidir?","options":["Çok sayıda renk","Doğrulanmış, açıklanabilir ve sürdürülebilir çözüm","Uzun formül","Yalnızca yüksek oyun puanı"],"answer":1,"explanation":"İş ihtiyacını doğru çözmek ve çözümü sürdürülebilir biçimde aktarmak temel hedeftir.","drill":null,"minutes":9,"real":"Dört projeyi tamamla, final değerlendirmesine gir ve öğrenme raporunu çıkar. Gerçek Excel dosyalarını bir meslektaşına veya eğitmene incelet; uygulama resmî sertifika vermez.","version":"Tüm sürümler","refs":["ms-errors","ms-protect","ms-tips","ms-start"]}],"functions":[{"en":"SUM","tr":"TOPLA","category":"Matematik","desc":"Aralıktaki sayıları toplar.","syntax":"TOPLA(sayı1; [sayı2]; …)","example":"=TOPLA(B2:B5)","live":true,"version":"2016+","note":""},{"en":"AVERAGE","tr":"ORTALAMA","category":"İstatistik","desc":"Sayısal değerlerin aritmetik ortalamasını verir; boşları atlar.","syntax":"ORTALAMA(sayı1; …)","example":"=ORTALAMA(B2:B5)","live":true,"version":"2016+","note":""},{"en":"MIN","tr":"MİN","category":"İstatistik","desc":"En küçük sayıyı verir.","syntax":"MİN(sayı1; …)","example":"=MİN(B2:B5)","live":true,"version":"2016+","note":""},{"en":"MAX","tr":"MAK","category":"İstatistik","desc":"En büyük sayıyı verir.","syntax":"MAK(sayı1; …)","example":"=MAK(B2:B5)","live":true,"version":"2016+","note":""},{"en":"COUNT","tr":"BAĞ_DEĞ_SAY","category":"İstatistik","desc":"Sayısal hücreleri sayar.","syntax":"BAĞ_DEĞ_SAY(değer1; …)","example":"=BAĞ_DEĞ_SAY(B2:B5)","live":true,"version":"2016+","note":""},{"en":"COUNTA","tr":"BAĞ_DEĞ_DOLU_SAY","category":"İstatistik","desc":"Metin dahil boş olmayan hücreleri sayar.","syntax":"BAĞ_DEĞ_DOLU_SAY(değer1; …)","example":"=BAĞ_DEĞ_DOLU_SAY(A2:A5)","live":true,"version":"2016+","note":"Formülün boş metin sonucu gerçek boş hücre değildir."},{"en":"COUNTBLANK","tr":"BOŞLUKSAY","category":"İstatistik","desc":"Boş veya boş metin değerli hücreleri sayar.","syntax":"BOŞLUKSAY(aralık)","example":"=BOŞLUKSAY(A2:A5)","live":true,"version":"2016+","note":""},{"en":"ROUND","tr":"YUVARLA","category":"Matematik","desc":"Belirtilen basamağa yuvarlar.","syntax":"YUVARLA(sayı; basamak)","example":"=YUVARLA(B2;2)","live":true,"version":"2016+","note":""},{"en":"ROUNDUP","tr":"YUKARIYUVARLA","category":"Matematik","desc":"Sıfırdan uzağa doğru yuvarlar.","syntax":"YUKARIYUVARLA(sayı; basamak)","example":"=YUKARIYUVARLA(B2;0)","live":true,"version":"2016+","note":""},{"en":"ROUNDDOWN","tr":"AŞAĞIYUVARLA","category":"Matematik","desc":"Sıfıra doğru yuvarlar.","syntax":"AŞAĞIYUVARLA(sayı; basamak)","example":"=AŞAĞIYUVARLA(B2;0)","live":true,"version":"2016+","note":""},{"en":"ABS","tr":"MUTLAK","category":"Matematik","desc":"Bir sayının mutlak değerini verir.","syntax":"MUTLAK(sayı)","example":"=MUTLAK(-12)","live":true,"version":"2016+","note":""},{"en":"INT","tr":"TAMSAYI","category":"Matematik","desc":"Aşağıdaki en yakın tam sayıya yuvarlar.","syntax":"TAMSAYI(sayı)","example":"=TAMSAYI(-2,4)","live":true,"version":"2016+","note":""},{"en":"MOD","tr":"MOD","category":"Matematik","desc":"Bölme işleminden kalanı verir.","syntax":"MOD(sayı; bölen)","example":"=MOD(17;5)","live":true,"version":"2016+","note":""},{"en":"POWER","tr":"KUVVET","category":"Matematik","desc":"Üs alma işlemi yapar.","syntax":"KUVVET(sayı; üs)","example":"=KUVVET(2;3)","live":true,"version":"2016+","note":""},{"en":"SQRT","tr":"KAREKÖK","category":"Matematik","desc":"Negatif olmayan sayının karekökünü verir.","syntax":"KAREKÖK(sayı)","example":"=KAREKÖK(81)","live":true,"version":"2016+","note":""},{"en":"PRODUCT","tr":"ÇARPIM","category":"Matematik","desc":"Sayısal değerleri çarpar.","syntax":"ÇARPIM(sayı1; …)","example":"=ÇARPIM(B2:B4)","live":true,"version":"2016+","note":""},{"en":"SUMPRODUCT","tr":"TOPLA.ÇARPIM","category":"Matematik","desc":"Eş konumlu öğelerin çarpımlarını toplar.","syntax":"TOPLA.ÇARPIM(dizi1; dizi2; …)","example":"=TOPLA.ÇARPIM(B2:B4;C2:C4)","live":true,"version":"2016+","note":""},{"en":"MEDIAN","tr":"ORTANCA","category":"İstatistik","desc":"Sıralı sayıların orta değerini verir.","syntax":"ORTANCA(sayı1; …)","example":"=ORTANCA(B2:B6)","live":true,"version":"2016+","note":""},{"en":"LARGE","tr":"BÜYÜK","category":"İstatistik","desc":"En büyük k’ncı sayıyı verir.","syntax":"BÜYÜK(dizi; k)","example":"=BÜYÜK(B2:B6;2)","live":true,"version":"2016+","note":""},{"en":"SMALL","tr":"KÜÇÜK","category":"İstatistik","desc":"En küçük k’ncı sayıyı verir.","syntax":"KÜÇÜK(dizi; k)","example":"=KÜÇÜK(B2:B6;2)","live":true,"version":"2016+","note":""},{"en":"IF","tr":"EĞER","category":"Mantık","desc":"Koşula göre iki sonuçtan birini verir.","syntax":"EĞER(koşul; doğruysa; yanlışsa)","example":"=EĞER(B2\u003e=60;\"Geçti\";\"Tekrar\")","live":true,"version":"2016+","note":""},{"en":"IFERROR","tr":"EĞERHATA","category":"Mantık","desc":"Hata halinde belirlediğin alternatifi verir.","syntax":"EĞERHATA(değer; hata_durumu)","example":"=EĞERHATA(B2/C2;\"Kontrol\")","live":true,"version":"2016+","note":""},{"en":"IFNA","tr":"EĞERYOKSA","category":"Mantık","desc":"Yalnızca #YOK / #N/A hatasını yönetir.","syntax":"EĞERYOKSA(değer; yoksa)","example":"=EĞERYOKSA(DÜŞEYARA(D2;A2:B5;2;YANLIŞ);\"Yok\")","live":true,"version":"2016+","note":""},{"en":"AND","tr":"VE","category":"Mantık","desc":"Bütün koşullar doğruysa DOĞRU verir.","syntax":"VE(koşul1; koşul2; …)","example":"=VE(B2\u003e=60;C2\u003e=80%)","live":true,"version":"2016+","note":""},{"en":"OR","tr":"YADA","category":"Mantık","desc":"En az bir koşul doğruysa DOĞRU verir.","syntax":"YADA(koşul1; koşul2; …)","example":"=YADA(B2\u003e10;C2\u003e10)","live":true,"version":"2016+","note":""},{"en":"NOT","tr":"DEĞİL","category":"Mantık","desc":"Mantıksal değeri tersine çevirir.","syntax":"DEĞİL(koşul)","example":"=DEĞİL(B2=0)","live":true,"version":"2016+","note":""},{"en":"COUNTIF","tr":"EĞERSAY","category":"Koşullu","desc":"Bir ölçüte uyan hücreleri sayar.","syntax":"EĞERSAY(aralık; ölçüt)","example":"=EĞERSAY(A2:A5;\"Doğu\")","live":true,"version":"2016+","note":""},{"en":"COUNTIFS","tr":"ÇOKEĞERSAY","category":"Koşullu","desc":"Birden çok ölçütü aynı anda sağlayan kayıtları sayar.","syntax":"ÇOKEĞERSAY(aralık1; ölçüt1; …)","example":"=ÇOKEĞERSAY(A2:A5;\"Doğu\";B2:B5;\"\u003e100\")","live":true,"version":"2016+","note":""},{"en":"SUMIF","tr":"ETOPLA","category":"Koşullu","desc":"Bir ölçüte göre toplam alır.","syntax":"ETOPLA(ölçüt_aralığı; ölçüt; [toplam_aralığı])","example":"=ETOPLA(A2:A5;\"Doğu\";B2:B5)","live":true,"version":"2016+","note":""},{"en":"SUMIFS","tr":"ÇOKETOPLA","category":"Koşullu","desc":"Birden çok ölçüte göre toplam alır.","syntax":"ÇOKETOPLA(toplam_aralığı; aralık1; ölçüt1; …)","example":"=ÇOKETOPLA(C2:C5;A2:A5;\"Doğu\";B2:B5;\"Kalem\")","live":true,"version":"2016+","note":""},{"en":"AVERAGEIF","tr":"EĞERORTALAMA","category":"Koşullu","desc":"Bir koşula uyan değerlerin ortalamasını alır.","syntax":"EĞERORTALAMA(aralık; ölçüt; [ortalama_aralığı])","example":"=EĞERORTALAMA(A2:A5;\"Doğu\";B2:B5)","live":true,"version":"2016+","note":""},{"en":"LEN","tr":"UZUNLUK","category":"Metin","desc":"Boşluklar dahil karakter sayısını verir.","syntax":"UZUNLUK(metin)","example":"=UZUNLUK(A2)","live":true,"version":"2016+","note":""},{"en":"LEFT","tr":"SOLDAN","category":"Metin","desc":"Metnin başından karakter alır.","syntax":"SOLDAN(metin; [adet])","example":"=SOLDAN(A2;2)","live":true,"version":"2016+","note":""},{"en":"RIGHT","tr":"SAĞDAN","category":"Metin","desc":"Metnin sonundan karakter alır.","syntax":"SAĞDAN(metin; [adet])","example":"=SAĞDAN(A2;4)","live":true,"version":"2016+","note":""},{"en":"MID","tr":"PARÇAAL","category":"Metin","desc":"Belirli konumdan itibaren karakter alır.","syntax":"PARÇAAL(metin; başlangıç; adet)","example":"=PARÇAAL(A2;4;4)","live":true,"version":"2016+","note":""},{"en":"TRIM","tr":"KIRP","category":"Metin","desc":"Fazla normal boşlukları düzenler.","syntax":"KIRP(metin)","example":"=KIRP(A2)","live":true,"version":"2016+","note":""},{"en":"CLEAN","tr":"TEMİZ","category":"Metin","desc":"Temel yazdırılamayan karakterleri temizler.","syntax":"TEMİZ(metin)","example":"=TEMİZ(A2)","live":true,"version":"2016+","note":""},{"en":"UPPER","tr":"BÜYÜKHARF","category":"Metin","desc":"Metni büyük harfe dönüştürür.","syntax":"BÜYÜKHARF(metin)","example":"=BÜYÜKHARF(A2)","live":true,"version":"2016+","note":""},{"en":"LOWER","tr":"KÜÇÜKHARF","category":"Metin","desc":"Metni küçük harfe dönüştürür.","syntax":"KÜÇÜKHARF(metin)","example":"=KÜÇÜKHARF(A2)","live":true,"version":"2016+","note":""},{"en":"SUBSTITUTE","tr":"YERİNEKOY","category":"Metin","desc":"Belirli metni yenisiyle değiştirir.","syntax":"YERİNEKOY(metin; eski; yeni; [sıra])","example":"=YERİNEKOY(A2;\"-\";\" \")","live":true,"version":"2016+","note":""},{"en":"CONCAT","tr":"ARALIKBİRLEŞTİR","category":"Metin","desc":"Metin ve aralıkları ayraç eklemeden birleştirir.","syntax":"ARALIKBİRLEŞTİR(metin1; …)","example":"=ARALIKBİRLEŞTİR(A2;B2)","live":true,"version":"2019+","note":""},{"en":"CONCATENATE","tr":"BİRLEŞTİR","category":"Metin","desc":"Metinleri ardışık birleştirir.","syntax":"BİRLEŞTİR(metin1; …)","example":"=BİRLEŞTİR(A2;\" \";B2)","live":true,"version":"2016+","note":""},{"en":"TEXTJOIN","tr":"METİNBİRLEŞTİR","category":"Metin","desc":"Ayraçla birleştirir; boşları atlayabilir.","syntax":"METİNBİRLEŞTİR(ayraç; boşları_atla; metin1; …)","example":"=METİNBİRLEŞTİR(\" - \";DOĞRU;A2:A4)","live":true,"version":"2019+","note":""},{"en":"VALUE","tr":"SAYIYAÇEVİR","category":"Metin","desc":"Uygun sayı metnini sayıya dönüştürür.","syntax":"SAYIYAÇEVİR(metin)","example":"=SAYIYAÇEVİR(A2)","live":true,"version":"2016+","note":"Simülatör sayısal metni seçili TR/EN ayarına göre yorumlar; para/tarih metinleri kapsam dışıdır."},{"en":"CHAR","tr":"DAMGA","category":"Metin","desc":"Kod numarasından karakter üretir.","syntax":"DAMGA(sayı)","example":"=DAMGA(65)","live":true,"version":"2016+","note":"Eğitim motorunda 1–255 kodları; işletim sistemi kod sayfasının tamamı taklit edilmez."},{"en":"VLOOKUP","tr":"DÜŞEYARA","category":"Arama","desc":"İlk sütunda arayıp aynı satırdan sonuç verir.","syntax":"DÜŞEYARA(aranan; tablo; sütun; YANLIŞ)","example":"=DÜŞEYARA(D2;A2:B5;2;YANLIŞ)","live":true,"version":"2016+","note":"Atölyede yalnızca tam eşleşme desteklenir; son bağımsız değişken 0 veya YANLIŞ olmalı."},{"en":"XLOOKUP","tr":"ÇAPRAZARA","category":"Arama","desc":"Arama ve dönüş aralıklarıyla esnek tam eşleşme yapar.","syntax":"ÇAPRAZARA(aranan; arama; dönüş; [yoksa])","example":"=ÇAPRAZARA(D2;A2:A5;B2:B5;\"Yok\")","live":true,"version":"2021+ / 365","note":"Atölyede tek satır/sütun, tam eşleşme ve ileri/geri doğrusal arama desteklenir."},{"en":"INDEX","tr":"İNDİS","category":"Arama","desc":"Dizinin belirtilen satır ve sütunundaki değeri verir.","syntax":"İNDİS(dizi; satır; [sütun])","example":"=İNDİS(B2:B5;2)","live":true,"version":"2016+","note":"Atölyede tek hücre sonuçları; sıfırla bütün satır/sütun döndürme desteklenmez."},{"en":"MATCH","tr":"KAÇINCI","category":"Arama","desc":"Tam eşleşen öğenin aralıktaki konumunu verir.","syntax":"KAÇINCI(aranan; aralık; 0)","example":"=KAÇINCI(D2;A2:A5;0)","live":true,"version":"2016+","note":"Atölyede yalnızca 0 ile tam eşleşme desteklenir."},{"en":"DATE","tr":"TARİH","category":"Tarih","desc":"Yıl, ay ve günden tarih seri değeri oluşturur.","syntax":"TARİH(yıl; ay; gün)","example":"=TARİH(2026;9;8)","live":true,"version":"2016+","note":"Simülatör 1900 tarih sistemini kullanır; 1904 kitap sistemi desteklenmez."},{"en":"YEAR","tr":"YIL","category":"Tarih","desc":"Tarihin yılını verir.","syntax":"YIL(tarih)","example":"=YIL(TARİH(2026;9;8))","live":true,"version":"2016+","note":""},{"en":"MONTH","tr":"AY","category":"Tarih","desc":"Tarihin ay numarasını verir.","syntax":"AY(tarih)","example":"=AY(TARİH(2026;9;8))","live":true,"version":"2016+","note":""},{"en":"DAY","tr":"GÜN","category":"Tarih","desc":"Ayın gün numarasını verir.","syntax":"GÜN(tarih)","example":"=GÜN(TARİH(2026;9;8))","live":true,"version":"2016+","note":""},{"en":"TODAY","tr":"BUGÜN","category":"Tarih","desc":"Tarayıcının yerel gününe göre tarih değeri verir.","syntax":"BUGÜN()","example":"=BUGÜN()","live":true,"version":"2016+","note":"Hücre biçimi tarih seçilmezse seri sayı görünebilir."},{"en":"FILTER","tr":"FİLTRE","category":"Dinamik dizi","desc":"Koşula uyan kayıtların dizisini döndürür.","syntax":"FİLTRE(dizi; dahil; [boşsa])","example":"=FİLTRE(A2:C5;B2:B5=\"Doğu\";\"Yok\")","live":false,"version":"2021+ / 365","note":""},{"en":"SORT","tr":"SIRALA","category":"Dinamik dizi","desc":"Dizinin sıralanmış kopyasını verir.","syntax":"SIRALA(dizi; [sütun]; [düzen])","example":"=SIRALA(A2:C5;3;-1)","live":false,"version":"2021+ / 365","note":""},{"en":"UNIQUE","tr":"BENZERSİZ","category":"Dinamik dizi","desc":"Farklı değerlerin listesini verir.","syntax":"BENZERSİZ(dizi)","example":"=BENZERSİZ(A2:A10)","live":false,"version":"2021+ / 365","note":""},{"en":"SEQUENCE","tr":"SIRALI","category":"Dinamik dizi","desc":"Ardışık değerlerden dizi oluşturur.","syntax":"SIRALI(satır; [sütun]; [başlangıç]; [adım])","example":"=SIRALI(5;1;100;10)","live":false,"version":"2021+ / 365","note":""},{"en":"LET","tr":"LET","category":"Dinamik dizi","desc":"Formül içindeki ara hesaplamalara ad verir.","syntax":"LET(ad; değer; hesaplama)","example":"=LET(tutar;B2*C2;tutar*(1-D2))","live":false,"version":"2021+ / 365","note":""},{"en":"LAMBDA","tr":"LAMBDA","category":"Dinamik dizi","desc":"Parametreli özel işlev tanımlar.","syntax":"LAMBDA(parametre; hesaplama)","example":"=LAMBDA(fiyat;oran;fiyat*(1-oran))(200;10%)","live":false,"version":"2024 / 365","note":""},{"en":"SUBTOTAL","tr":"ALTTOPLAM","category":"Analiz","desc":"Filtrelenmiş listelerde görünür veriyi özetler.","syntax":"ALTTOPLAM(işlev_no; aralık)","example":"=ALTTOPLAM(109;B2:B20)","live":false,"version":"2016+","note":""},{"en":"NETWORKDAYS","tr":"TAMİŞGÜNÜ","category":"Tarih","desc":"Tarihler arasındaki iş günü sayısını verir.","syntax":"TAMİŞGÜNÜ(başlangıç; bitiş; [tatiller])","example":"=TAMİŞGÜNÜ(A2;B2;H2:H5)","live":false,"version":"2016+","note":""},{"en":"WORKDAY","tr":"İŞGÜNÜ","category":"Tarih","desc":"Belirli iş günü sonrası tarihi verir.","syntax":"İŞGÜNÜ(başlangıç; gün; [tatiller])","example":"=İŞGÜNÜ(A2;5;H2:H5)","live":false,"version":"2016+","note":""},{"en":"TEXT","tr":"METNEÇEVİR","category":"Metin","desc":"Değeri bir biçim koduyla metne çevirir.","syntax":"METNEÇEVİR(değer; biçim)","example":"=METNEÇEVİR(A2;\"gg.aa.yyyy\")","live":false,"version":"2016+","note":"Microsoft belgelerinde yerelleştirme farklılıkları görülebilir; kendi Excel sürümündeki işlev tamamlama adını esas al."}],"errors":[{"id":"div0","title":"#SAYI/0! / #DIV/0!","aliases":["sayi/0","böl/0","div/0","sıfıra böl","sifira bol","payda"],"summary":"Payda sıfır veya boş olduğu için bölme yapılamıyor.","steps":["Paydanın hücresini ve gerçek değerini kontrol et.","Sıfırın veri hatası mı geçerli durum mu olduğuna karar ver.","Anlamlı bir alternatif yaz; her hatayı otomatik 0 yapma."],"example":"=EĞER(C2=0;\"Hesaplanamaz\";B2/C2)","lesson":"m05l06","source":"ms-errors"},{"id":"na","title":"#YOK / #N/A","aliases":["yok","n/a","bulunamadı","eslesme","eşleşmiyor","düşeyara"],"summary":"Aranan kayıt bulunamıyor veya kodların türü/karakterleri uyuşmuyor.","steps":["Kaydın kaynak listede gerçekten bulunduğunu kontrol et.","Metin-sayı farkını, normal ve görünmez boşlukları incele.","Tam eşleşme kullan; beklenen bulunamama durumunu EĞERYOKSA ile yönet."],"example":"=EĞERYOKSA(DÜŞEYARA(D2;A2:B10;2;YANLIŞ);\"Kod yok\")","lesson":"m07l04","source":"ms-lookup"},{"id":"value","title":"#DEĞER! / #VALUE!","aliases":["değer!","value!","yanlış tür","metinle hesap"],"summary":"İşlem, beklediği sayı yerine metin veya uyumsuz veri alıyor olabilir.","steps":["Hangi bağımsız değişkenin hata verdiğini tek tek test et.","Sayısal görünen metinleri ve ayraçları kontrol et.","Veri türünü doğru biçimde dönüştür; yalnızca görünümü değiştirmekle yetinme."],"example":"=SAYIYAÇEVİR(A2)","lesson":"m06l01","source":"ms-errors"},{"id":"ref","title":"#BAŞV! / #REF!","aliases":["başv","ref!","başvuru","silinen hücre"],"summary":"Formül artık geçerli olmayan bir hücre veya aralığa başvuruyor.","steps":["Yakın zamanda satır, sütun veya sayfa silinip silinmediğini incele.","Mümkünse yanlış işlemi geri al; yedekte doğru aralığı bul.","Formülü amaçlanan kaynakla yeniden kur ve diğer bağımlı hesapları kontrol et."],"example":"Yanlış: =TOPLA(#BAŞV!)\nDoğru kaynak doğrulandıktan sonra: =TOPLA(B2:B10)","lesson":"m16l01","source":"ms-errors"},{"id":"name","title":"#AD? / #NAME?","aliases":["ad?","name?","işlev adı","fonksiyon adı","xlookup yok"],"summary":"İşlev/ad yazımı, eksik tırnak veya sürüm uyumsuzluğu olabilir.","steps":["İşlev adını Excel’in kendi otomatik tamamlamasıyla kontrol et.","Metin sabitlerinin çift tırnak içinde olduğundan emin ol.","İşlevin sürümünde bulunduğunu doğrula; gerekiyorsa eski sürüm alternatifi kullan."],"example":"=EĞER(B2\u003e0;\"Var\";\"Yok\")","lesson":"m07l02","source":"ms-functions"},{"id":"num","title":"#SAYI! / #NUM!","aliases":["sayı!","num!","karekök","sayisal sınır"],"summary":"Geçersiz sayısal girdi veya hesaplamanın sayısal sınırı olabilir.","steps":["Negatif sayının karekökü gibi tanımsız işlemleri kontrol et.","Sayıların beklenen birimde ve aralıkta olduğundan emin ol.","Yakınsama gerektiren hesaplarda varsayım ve yöntemi incele."],"example":"=KAREKÖK(81)","lesson":"m16l01","source":"ms-errors"},{"id":"spill","title":"#TAŞMA! / #SPILL!","aliases":["taşma","spill","dinamik dizi"],"summary":"Dinamik sonuç dizisinin yayılacağı alan engelleniyor olabilir.","steps":["Formülün istediği çıktı boyutunu ve alanını incele.","Dolu veya birleştirilmiş hücreleri belirle; silmeden önce içeriklerini koru.","Gerekirse formülü boş bir alana veya tablo gövdesi dışına taşı."],"example":"=SIRALI(5;1;1;1)","lesson":"m09l04","source":"ms-array"},{"id":"calc","title":"#HESAPLA! / #CALC!","aliases":["hesapla!","calc!","boş dizi","lambda"],"summary":"Desteklenmeyen dizi durumu, boş sonuç veya çağrılmamış LAMBDA gibi nedenler olabilir.","steps":["Hangi işlevin bu sonucu verdiğini izole et.","FİLTRE’de eşleşme yoksa boş sonuç bağımsız değişkeni ekle.","LAMBDA’yı uygun parametrelerle çağırdığından emin ol."],"example":"=FİLTRE(A2:C5;B2:B5=\"Doğu\";\"Kayıt yok\")","lesson":"m09l01","source":"ms-lambda"},{"id":"hash","title":"Hücrede ##### görünüyor","aliases":["#####","diyez","sütun dar","tarih görünmüyor"],"summary":"Bu görünüm çoğunlukla sütun genişliği veya negatif tarih/saatle ilgilidir.","steps":["Sütunu otomatik genişlet; formül çubuğundaki değeri kontrol et.","Hücre biçiminin veriye uygun olduğunu denetle.","Tarih/saat hesabında negatif değer oluşup oluşmadığını incele."],"example":"Önce sütun genişliği → sonra biçim → sonra gerçek değer","lesson":"m02l01","source":"ms-errors"},{"id":"circular","title":"Döngüsel başvuru","aliases":["döngüsel","dongusel","circular","kendine başvur"],"summary":"Bir formül doğrudan veya bir zincir üzerinden kendisine bağlı.","steps":["Toplam hücresinin kendi toplam aralığı içinde olup olmadığını kontrol et.","Formüller \u003e Hata Denetimi \u003e Döngüsel Başvurular yolunu incele.","Bağımlılık zincirini düzelt; uyarıyı susturmak için yinelemeyi gelişigüzel açma."],"example":"B6 hücresinde doğru örnek: =TOPLA(B2:B5)","lesson":"m04l01","source":"ms-circular"},{"id":"literal","title":"Formül hesaplanmıyor, metin görünüyor","aliases":["formül metin","hesaplanmıyor","formül görünüyor","eşittir","formul metin"],"summary":"Hücre metin biçiminde olabilir; başta kesme işareti veya Formülleri Göster açık olabilir.","steps":["Başlangıçtaki = ve varsa kesme işaretini kontrol et.","Hücreyi Genel biçimine getir; ardından formülü yeniden düzenleyip Enter’a bas.","Birçok hücrede formül görünüyorsa Formülleri Göster seçeneğini denetle."],"example":"Biçimi değiştirdikten sonra F2 → Enter ile yeniden giriş gerekebilir.","lesson":"m03l01","source":"ms-formula"},{"id":"textnum","title":"Sayılar toplanmıyor","aliases":["metin sayı","toplam sıfır","toplanmıyor","sayı metin","yeşil üçgen"],"summary":"Sayısal görünen içerik aslında metin olarak depolanmış olabilir.","steps":["Kaynak hücrenin gerçek türünü ve boşluklarını incele.","Uygun yerel ayarla dönüştür; gerekirse SAYIYAÇEVİR kullan.","Kimlik ve ürün kodlarını yanlışlıkla sayıya çevirmediğini kontrol et."],"example":"=SAYIYAÇEVİR(A2)","lesson":"m12l02","source":"ms-textnum"},{"id":"separator","title":"Virgül / noktalı virgül sorunu","aliases":["noktalı virgül","ayraç","virgül","separator","ondalık"],"summary":"İşlev dili, liste ayracı ve ondalık ayarı birbirinden ayrı olabilir.","steps":["Excel’indeki işlev otomatik tamamlamasını ve ayraç biçimini incele.","Formüldeki bağımsız değişken ayracını yerel ayara uygun yaz.","Tırnak içindeki metinleri ve ondalıkları topluca değiştirerek bozma."],"example":"TR örneği: =YUVARLA(12,345;2)\nEN örneği: =ROUND(12.345,2)","lesson":"m03l01","source":"ms-formula"},{"id":"reference","title":"Kopyalayınca sonuç bozuluyor","aliases":["kopyalayınca","kayiyor","kayıyor","mutlak","dolar","f4"],"summary":"Sabit kalması gereken bir başvuru göreli bırakılmış olabilir.","steps":["İlk ve son kopyadaki formülleri karşılaştır.","Sabit varsayım hücresini $F$1 gibi mutlak yap.","İki yönlü tabloda karma başvurunun doğru satır/sütunu kilitlediğini test et."],"example":"=B2*(1-$F$1)","lesson":"m03l04","source":"ms-tips"},{"id":"filtered","title":"Filtreli toplam yanlış","aliases":["filtre toplam","gizli satır","alttoplam","görünen toplam"],"summary":"TOPLA, filtreyle gizlenen satırları da kapsar.","steps":["Toplamın tüm veri mi yalnızca görünür veri mi için istendiğini belirle.","Görünür satırlar için ALTTOPLAM gibi uygun yöntemi kullan.","Elle gizli satırların dahil edilme kuralını da seçtiğin işlev kodunda doğrula."],"example":"=ALTTOPLAM(109;B2:B100)","lesson":"m08l02","source":"ms-functions"},{"id":"dates","title":"Tarih sırası veya ay/gün karışıyor","aliases":["tarih metin","ay gün","gun ay","tarih sırası","yanlış tarih"],"summary":"Tarihler metin olarak tutuluyor veya yanlış yerel ayarla yorumlanıyor olabilir.","steps":["Belirsiz tarihlerin kaynak biçimini öğren.","Power Query’de türü Yerel Ayarı Kullan ile dönüştür.","Dönüştürülen gün, ay ve yılı birkaç örnekte tek tek doğrula."],"example":"=TARİH(2026;9;8)","lesson":"m06l05","source":"ms-pqui"},{"id":"csv","title":"CSV tek sütunda / Türkçe karakterler bozuk","aliases":["csv","karakter","kodlama","tek sütun","utf"],"summary":"CSV ayraç veya karakter kodlaması uygun seçilmemiş olabilir.","steps":["Dosyayı çift tıklamak yerine Veri \u003e Metinden/CSV ile aç.","Önizlemede UTF-8 ve doğru ayracı dene.","Başta sıfır veya uzun kimlik içeren sütunları metin olarak koru."],"example":"Bu uygulamanın CSV çıktısı: UTF-8 BOM + noktalı virgül","lesson":"m12l01","source":"ms-pq"},{"id":"precision","title":"Uzun kod / baştaki sıfır kayboluyor","aliases":["15 basamak","16 basamak","uzun kod","başta sıfır","basta sifir","kimlik"],"summary":"Excel sayısal hassasiyeti uzun kimlikleri bozabilir; kodları metin saklamak gerekir.","steps":["Veriyi girmeden veya içeri almadan önce sütunu Metin yap.","Kaybolmuş basamakları yalnızca sonradan biçim değiştirerek geri getiremeyeceğini bil.","Özgün kaynağa dönüp kimliği metin olarak yeniden içe aktar."],"example":"Kod: 001234567890123456 → metin olarak korunmalı","lesson":"m12l02","source":"ms-textnum"},{"id":"pivot","title":"Pivot güncellenmiyor","aliases":["pivot güncel","pivot yenile","eski pivot","satırlar gelmiyor"],"summary":"Kaynak aralığı veya yenileme ayarı yeni kayıtları kapsamıyor olabilir.","steps":["Pivot veri kaynağını ve son satırını denetle.","Kaynağı Excel tablosu yap; yeni kayıtların tablo içinde kaldığını doğrula.","Yenile ve kaynak toplamıyla pivot genel toplamını karşılaştır."],"example":"Kontrol farkı = kaynak toplamı − pivot toplamı","lesson":"m11l06","source":"ms-pivot"},{"id":"pivotcount","title":"Pivot toplam yerine sayım yapıyor","aliases":["pivot sayım","pivot say","toplam yerine","count sum"],"summary":"Veri alanında metin, boş veya karışık tür bulunabilir; özet türü de yanlış seçilmiş olabilir.","steps":["Kaynak tutar sütununun sayısal türünü kontrol et.","Değer Alanı Ayarları’nda Toplam’ı seç.","Yenile ve sonucu birkaç kaynak satırla doğrula."],"example":"Değer Alanı Ayarları → Değerleri özetleme → Toplam","lesson":"m11l03","source":"ms-pivot"},{"id":"query","title":"Power Query yenileme hatası","aliases":["power query","sorgu hata","yenileme hata","kaynak yol","erişim"],"summary":"Dosya yolu, sütun adı, yetki veya veri türü değişmiş olabilir.","steps":["Uygulanan Adımlar’da ilk hata veren adımı bul.","Kaynak yolunu, başlıkları ve veri türlerini doğrula.","Kimlik bilgilerini güvenli biçimde yönet; kuruluş izinlerini aşmaya çalışma."],"example":"Önce kaynak adımı, sonra tür dönüşümleri, sonra birleştirmeler","lesson":"m12l06","source":"ms-pq"},{"id":"merge","title":"Birleştirme sonrası satır sayısı arttı","aliases":["birleştirme satır","merge","satır arttı","çift kayıt"],"summary":"Sağ tabloda bir anahtarın birden çok eşleşmesi olabilir.","steps":["Birleştirme anahtarını ve veri türlerini doğrula.","Sağ tablodaki anahtar tekrarlarını say.","İş anlamına göre tekilleştir veya doğru çoklu ilişkiyi koru; sonuç toplamını yeniden denetle."],"example":"Sol dış birleştirme + sağda 2 eşleşme → 2 çıktı satırı","lesson":"m12l04","source":"ms-pqui"},{"id":"slow","title":"Çalışma kitabı çok yavaş","aliases":["yavaş","donuyor","performans","hesaplama uzun"],"summary":"Gereksiz büyük aralıklar, aşırı biçimlendirme veya pahalı tekrarlar etkili olabilir.","steps":["Dosyanın kopyasında yavaş adımı belirle.","Aralık boyutlarını, tekrar eden hesapları ve gereksiz biçimleri incele.","Tek değişiklik yaparak ölç; otomatik hesaplamanın kapalı kalmadığını kontrol et."],"example":"Ölç → bir değişiklik → doğrula → tekrar ölç","lesson":"m16l02","source":"ms-tips"},{"id":"macro","title":"Makro çalışmıyor / engellendi","aliases":["makro","macro","vba","xlsm","güvenlik uyarı"],"summary":"Dosya türü, desteklenen platform veya güvenlik politikası etkili olabilir.","steps":["Dosyanın XLSM olup olmadığını ve masaüstü VBA desteğini kontrol et.","Kaynağa güvenmeden içerik etkinleştirme; uyarının nedenini incele.","Kuruluş politikası varsa yetkili destekle çalış; güvenlik ayarlarını topluca kapatma."],"example":"Kendi test dosyan: .xlsm\nWeb için Excel, VBA makrosunu çalıştırmaz.","lesson":"m15l01","source":"ms-vba"},{"id":"print","title":"Yazdırırken sütunlar kesiliyor","aliases":["yazdır","baskı","sayfaya sığ","çıktı"],"summary":"Yazdırma alanı, yönlendirme veya ölçek uygun olmayabilir.","steps":["Baskı önizlemesinde sayfa sınırlarını kontrol et.","Yazdırma alanını ve yatay/dikey yönü düzenle.","Genişliği 1 sayfa, yüksekliği gerekirse otomatik yap; okunurluğu koru."],"example":"Başlıkları her sayfada yinele; çok küçük yazıdan kaçın.","lesson":"m02l06","source":"ms-start"},{"id":"protect","title":"Hücreyi düzenleyemiyorum","aliases":["koruma","kilitli","düzenleyemiyorum","salt okunur"],"summary":"Sayfa koruması, dosya izni veya salt okunur açılış olabilir.","steps":["Dosyanın salt okunur ve paylaşım izinlerini kontrol et.","Sayfa koruması varsa dosya sahibinden yetkili erişim iste.","Girdi için ayrılan hücreleri kullan; korumayı izinsiz aşmaya çalışma."],"example":"Sayfa koruması ile dosya erişim izni farklı katmanlardır.","lesson":"m16l03","source":"ms-protect"},{"id":"save","title":"Değişiklikler kayboldu","aliases":["kayboldu","kayıp","kaydet","kurtar","eski sürüm"],"summary":"Yanlış dosya kopyası, kaydetmeme veya sürüm farkı olabilir.","steps":["Önce doğru dosya yolunu ve son değişiklik zamanını denetle.","Excel’in kurtarma seçeneklerini ve varsa bulut sürüm geçmişini incele.","Mevcut dosyanın üzerine yazmadan önce ayrı bir kopya al; kurtarma garantisi yoktur."],"example":"Bu uygulama gerçek Excel dosyalarını kurtaramaz; yalnızca kontrol yolunu gösterir.","lesson":"m01l06","source":"ms-start"},{"id":"null","title":"#BOŞ! / #NULL!","aliases":["boş!","null!","kesişim"],"summary":"Aralıklar arasında yanlışlıkla boşluk veya geçersiz kesişim kullanılmış olabilir.","steps":["Formüldeki aralık işaretlerini kontrol et.","Aralık için iki nokta, bağımsız değişkenler için doğru liste ayracı kullan.","İstenmeyen boşlukla aralık kesişimi oluşturulmadığını doğrula."],"example":"=TOPLA(A1:A5;C1:C5)","lesson":"m03l01","source":"ms-formula"}],"projects":[{"id":"budget","title":"Kişisel bütçe kontrolü","subtitle":"Bir tabloyu karar aracına dönüştür.","level":"Temel","modules":[1,2,3,4,5],"brief":"12 kayıtlık tamamen kurgusal bir aylık bütçen var. Gelir ve gideri ayır, planla gerçekleşeni karşılaştır, kalan tutarı raporla. Para birimi yalnızca eğitim örneğinde TL olarak kabul edilir.","steps":["Butce verisini Excel’de gerçek tabloya dönüştür; sütun türlerini ve başlıkları kontrol et.","Gerçekleşen gelir ve gideri ayrı ETOPLA formülleriyle hesapla; toplamları ayrı kontrol et.","Gider sapmasını Gercek − Plan olarak hesapla; pozitif farkı bütçe aşımı olarak etiketle.","Bir gelir-gider özeti ve kategori karşılaştırma grafiği ekle; birimleri ve dönemi yaz.","Sonuçları aşağıdaki üç kontrolde doğrula, ardından teslim kontrol listesini tamamla."],"checks":[{"label":"Gerçekleşen toplam gider","value":36450,"hint":"Tur sütununda Gider olan satırların Gercek tutarlarını topla."},{"label":"Kalan tutar: gelir − gider","value":14050,"hint":"Gerçekleşen gelir toplamından gerçekleşen gideri çıkar."},{"label":"Toplam gider aşımı: gerçek − plan","value":1650,"hint":"Yalnızca Gider satırlarında gerçekleşen toplam ile plan toplamını karşılaştır."}],"rubric":["Gelir ve gider toplamlarını formülle hesapladım.","Sayı biçimlerini tutarlı yaptım, giriş ve sonuçları ayırdım.","Bir grafik ekledim ve anlamlı başlık kullandım.","Bir girdiyi değiştirip hesapların güncellendiğini test ettim."]},{"id":"sales","title":"Satış analiz paneli","subtitle":"Ham satırlardan yönetici raporuna.","level":"Orta / ileri","modules":[5,7,8,10,11],"brief":"48 kurgusal satış kaydından bölge, ürün ve ay bazında rapor üret. Net tutar = Adet × BirimFiyat × (1 − Indirim). Vergi, kargo ve iade bu örneğin kapsamı dışındadır.","steps":["Satislar verisini tabloya dönüştür. Tarihi gerçek tarih, indirimi oran olarak tanımla.","NetTutar hesaplanan sütununu oluştur; satır tutarlarını iki ondalıkla kontrol et.","Bölge ve ay bazında PivotTable kur; özet türünün Toplam olduğunu denetle.","Ürün filtresi veya dilimleyici, bir aylık çizgi grafik ve bölge çubuk grafiği oluştur.","Genel toplam, Doğu toplamı ve satır adedini doğrula; rapora filtre ve kapsam notu ekle."],"checks":[{"label":"Genel net satış toplamı","value":17121.75,"hint":"Her satırda Adet × BirimFiyat × (1 − Indirim); sonra toplam."},{"label":"Doğu bölgesinin net toplamı","value":4410.75,"hint":"Bolge = Doğu koşuluyla NetTutar değerlerini topla."},{"label":"Kaynak kayıt sayısı","value":48,"hint":"Başlık hariç kayıt satırlarını say; toplam satış adediyle karıştırma."}],"rubric":["Net tutarları formülle hesapladım; indirimleri oran olarak kullandım.","Gerçek PivotTable kurdum ve kaynak toplamıyla mutabakat yaptım.","İki grafik ve görünür filtre durumuyla rapor sayfası hazırladım.","Yeni bir test kaydı ekleyip yenileme davranışını doğruladım."]},{"id":"stock","title":"Stok erken uyarı sistemi","subtitle":"Eşikler, aramalar ve veri doğrulama.","level":"Orta","modules":[5,7,8],"brief":"12 kurgusal ürünün stoklarını izle. Stok \u003c Esik ise Kritik; eşitse Normal. Kritik ürünlerde önerilen sipariş miktarı 2 × Esik − Stok, diğerlerinde 0. Bu yalnızca eğitim için basitleştirilmiş bir stok kuralıdır.","steps":["Stok verisini tabloya dönüştür; ürün kodlarını metin tut ve tekilliğini kontrol et.","Durum sütununu EĞER ile oluştur; tam eşik değerini ayrıca test et.","Örnek kurala göre sipariş miktarı hesapla; stok değerini Stok × BirimFiyat ile bul.","Kritik satırları koşullu biçimlendir ve metin etiketi ekle; bir ürün kodu arama alanı oluştur.","Üç sayısal kontrolü doğrula; modelin talep tahmini veya gerçek sipariş optimizasyonu yapmadığını rapora yaz."],"checks":[{"label":"Kritik ürün sayısı","value":5,"hint":"Kesin koşul Stok \u003c Esik. Eşit olan Normal."},{"label":"Toplam stok değeri","value":10950,"hint":"Tüm ürünlerde Stok × BirimFiyat toplamı."},{"label":"Önerilen toplam sipariş miktarı","value":46,"hint":"Sadece kritik ürünlerde 2 × Esik − Stok; diğerlerinde 0."}],"rubric":["Durum ve sipariş miktarı formüllerini oluşturdum.","Sınırdaki eşit stok/eşik durumunu test ettim.","Koşullu biçimlendirmeye açık durum metni ekledim.","Ürün arama alanını ve geçersiz kod davranışını test ettim."]},{"id":"clean","title":"Kirli veriden yenilenen rapora","subtitle":"Power Query ile veri kalitesi projesi.","level":"İleri","modules":[6,8,12,16],"brief":"10 ham satırda fazla boşluk, tekrarlı kimlik, tamamen boş satır ve hatalı tutar var. Boş satırı çıkar, metinleri temizle, tutarı tr-TR ile dönüştür, kimliğe göre ilk kaydı koru. Hatalı tutarlı kaydı SİLME; hata olarak işaretle ve toplamın dışında tut.","steps":["KirliVeri kaynağının kopyasını koru; kimliği metin, tutarı başlangıçta ham metin olarak al.","Ad ve şehirde fazla normal boşlukları temizle; tamamen boş satırı çıkar.","Tutarı tr-TR yerel ayarıyla sayıya dönüştür. Dönüşmeyen değeri ayrı hata kaydında göster.","Kimlikte ilk kaydı koruyarak tekilleştir. C01 tekrarını incele; C06 hatasını silme.","Çıktı kayıt sayısını, geçerli tutar toplamını ve hatalı tutar sayısını kontrol et; yenileme talimatı yaz."],"checks":[{"label":"Boş satır ve tekrar temizliği sonrası kayıt sayısı","value":8,"hint":"10 ham satırdan 1 tamamen boş satır ve 1 tekrar çıkar; hatalı tutar kaydı kalır."},{"label":"Geçerli tutarların toplamı","value":8101.5,"hint":"C01’i yalnızca bir kez al. C06 tutarı hatalıdır; toplam dışı ama kayıt içinde kalır."},{"label":"Çözümlenmemiş tutar hatası sayısı","value":1,"hint":"C06 kimliğinin hatalı tutarını sıfıra dönüştürme veya gizleme."}],"rubric":["Ham veriyi korudum ve kimliği metin tuttum.","Yerel sayı dönüşümünü yaptım; hatalı tutarı açıkça işaretledim.","Tekilleştirme anahtarını ve ilk kayıt kuralını belgeledim.","Gerçek Power Query akışını yeni veriyle yenileyip kontrol ettim."]}],"datasets":{"sales":[{"KayitNo":"S001","Tarih":"2026-01-01","Ay":"2026-01","Bolge":"Doğu","Urun":"Kalem","Temsilci":"Ada","Adet":2,"BirimFiyat":25,"Indirim":0,"NetTutar":50},{"KayitNo":"S002","Tarih":"2026-01-02","Ay":"2026-01","Bolge":"Doğu","Urun":"Defter","Temsilci":"Ada","Adet":9,"BirimFiyat":40,"Indirim":0.05,"NetTutar":342.0},{"KayitNo":"S003","Tarih":"2026-01-03","Ay":"2026-01","Bolge":"Doğu","Urun":"Dosya","Temsilci":"Ada","Adet":16,"BirimFiyat":60,"Indirim":0.1,"NetTutar":864.0},{"KayitNo":"S004","Tarih":"2026-01-04","Ay":"2026-01","Bolge":"Doğu","Urun":"Silgi","Temsilci":"Ece","Adet":4,"BirimFiyat":15,"Indirim":0,"NetTutar":60},{"KayitNo":"S005","Tarih":"2026-01-05","Ay":"2026-01","Bolge":"Batı","Urun":"Kalem","Temsilci":"Ece","Adet":11,"BirimFiyat":25,"Indirim":0.05,"NetTutar":261.25},{"KayitNo":"S006","Tarih":"2026-01-06","Ay":"2026-01","Bolge":"Batı","Urun":"Defter","Temsilci":"Ece","Adet":18,"BirimFiyat":40,"Indirim":0.1,"NetTutar":648.0},{"KayitNo":"S007","Tarih":"2026-01-07","Ay":"2026-01","Bolge":"Batı","Urun"
