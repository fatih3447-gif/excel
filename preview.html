function dashboard(){const next=nextLesson(),n=completed(),todayCount=Object.values(S.done).filter(d=>d.when===day()).length;return pageHeading(S.profile.name?'Merhaba, '+S.profile.name+'.':'Bugün ne öğreniyoruz?','Küçük adımlar, gerçek beceriler. Excel yolculuğun burada başlıyor.',`<span class="date-pill">${icon('clock',true)} ${new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span>`)+`<section class="hero"><div><div class="eyebrow">SIFIRDAN USTALIĞA / 16 MODÜL</div><h2>Bir hücreyle başla.<br>Bir uzman gibi düşün.</h2><p>Excel’i ezberleme; anlayarak kullan. Adım adım dersler, anında geri bildirim ve iş hayatından projelerle ilerle.</p>${btn(n?'Kaldığın yerden devam et':'İlk dersime başla','lesson',next.id,'lime','arrow')}<div class="hero-meta"><span>✓ Türkçe anlatım</span><span>✓ Kendi hızında</span><span>✓ Çevrimdışı alıştırma</span></div></div><div class="hero-art" aria-hidden="true"><span class="art-label">ÖRNEK ÇALIŞMA</span><div class="art-sheet"><div class="art-title"><i></i><i></i><i></i><span>İlk raporum.xlsx</span></div><div class="art-row head"><span></span><span>A</span><span>B</span><span>C</span></div><div class="art-row"><span>1</span><span>Ürün</span><span>Adet</span><span>Tutar</span></div><div class="art-row"><span>2</span><span>Kalem</span><span>12</span><span>300</span></div><div class="art-row"><span>3</span><span>Defter</span><span>8</span><span>320</span></div><div class="art-row"><span>4</span><span>Dosya</span><span>5</span><span>300</span></div><div class="art-row"><span>5</span><span>Toplam</span><span>25</span><span class="art-cell">920</span></div></div><div class="art-formula"><b>ƒx</b><span>=TOPLA(C2:C4)</span>${icon('check',true)}</div></div></section><section class="stats" aria-label="Öğrenme istatistikleri">${[['book',n+' <small>/ 96</small>','Tamamlanan ders'],['bolt',format(xp(),0),'Toplam deneyim puanı'],['flame',streak()+' <small>gün</small>','Öğrenme serisi'],['award',D.projects.filter(p=>S.projects[p.id]?.done).length+' <small>/ 4</small>','Tamamlanan proje']].map(x=>`<div class="stat"><span class="stat-icon">${icon(x[0])}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</section><div class="dash-columns"><section><div class="section-top"><h2>Senin öğrenme yolun</h2><button class="text-button" data-action="nav" data-id="path">Tüm yolu gör ${icon('arrow',true)}</button></div>${D.modules.slice(Math.max(0,next.module-1),Math.min(16,next.module+2)).map(m=>`<div class="next-card"><span class="number-block">${String(m.id).padStart(2,'0')}</span><div class="grow"><div class="pill-row" style="margin:0 0 5px">${tag(m.tag)}<span class="small muted">${doneModule(m.id)} / 6 ders</span></div><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p>${progressBar(doneModule(m.id),6)}</div><button class="icon-circle" data-action="open-module" data-id="${m.id}" aria-label="${esc(m.title)} modülünü aç">${icon('arrow',true)}</button></div>`).join('')}<div class="card" style="margin-top:20px;padding:19px"><div class="section-top" style="margin-bottom:8px"><h3>Bugünkü hedefin</h3>${tag(todayCount+' / '+S.profile.goal+' ders',todayCount>=S.profile.goal?'':'gray')}</div><p class="small muted">Bir derste açıklamayı incele, uygulamayı çöz ve kontrol sorusunu yanıtla.</p>${progressBar(Math.min(todayCount,S.profile.goal),S.profile.goal)}<div class="button-row">${btn('Formül atölyesini keşfet','nav','lab','secondary sm','grid')}${btn('Bir hatayı çöz','nav','errors','ghost sm','shield')}</div></div></section><aside>${dailyCard()}<div class="badge-line">${icon('award')}<div><strong class="small">${n?'Sıradaki rozet: '+(n<6?'İlk modül':'Öğrenme tutkusu'):'İlk rozetin seni bekliyor'}</strong><p>${n?'Yol boyunca ders, proje ve beceri rozetlerini biriktir.':'İlk dersini tamamla, “İlk adım” rozetini kazan.'}</p></div></div></aside></div>`;}
function pathView(){const filtered=D.modules.filter(m=>ui.pathFilter==='all'||(ui.pathFilter==='done'?doneModule(m.id)===6:doneModule(m.id)<6));return pageHeading('Öğrenme yolun','16 modül · 96 özgün ders · 30 formül görevi · 66 sıralama alıştırması',btn('Devam et','lesson',nextLesson().id,'','arrow'))+notice('Dersler önerilen sırada ilerler; hiçbir modül kilitli değildir. Her dersin tarayıcı alıştırmasına ek olarak gerçek Excel görevi vardır. İleri araçlarda sürüm ve platform notlarını kontrol et.')+`<div class="filterbar margin-top"><select data-change="path-filter" aria-label="Ders filtresi"><option value="all" ${ui.pathFilter==='all'?'selected':''}>Bütün modüller</option><option value="todo" ${ui.pathFilter==='todo'?'selected':''}>Devam edenler</option><option value="done" ${ui.pathFilter==='done'?'selected':''}>Tamamlananlar</option></select><span class="count-label">${completed()} / 96 ders tamamlandı</span></div>`+(filtered.length?filtered.map(m=>`<section class="module"><button class="module-header" data-action="module" data-id="${m.id}" aria-expanded="${ui.module===m.id}"><span class="number-block">${String(m.id).padStart(2,'0')}</span><div class="grow"><div class="pill-row" style="margin:0 0 6px">${tag(m.tag)}${m.id>=9?tag('Sürüm notlu','gray'):''}</div><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p></div><div class="module-meta">${doneModule(m.id)} / 6 tamamlandı${progressBar(doneModule(m.id),6)}</div>${icon('down')}</button>${ui.module===m.id?`<div class="module-body"><div class="lesson-grid">${D.lessons.filter(l=>l.module===m.id).map(l=>`<button class="lesson-row ${S.done[l.id]?'done':''}" data-action="lesson" data-id="${l.id}"><span class="status-dot">${S.done[l.id]?icon('check',true):l.n}</span><span><strong>${esc(l.title)}</strong><small>${l.drill?'Formül görevi':'İşlem sıralama'} · ${l.minutes} dk öneri · ${S.done[l.id]?'★'.repeat(S.done[l.id].stars):'100 XP'}</small></span></button>`).join('')}</div><p class="small muted margin-top">${esc(m.version)}</p></div>`:''}</section>`).join(''):empty('Bu filtrede modül yok.','İlk dersini tamamlayarak ilerlemeye başla.'));}
function seedTable(cells){let mr=1,mc=1;Object.keys(cells).forEach(a=>{try{const p=E.position(a);mr=Math.max(mr,p.r);mc=Math.max(mc,p.c);}catch(e){}});mr=Math.min(mr,12);mc=Math.min(mc,8);return `<div class="seed-table"><table><thead><tr><th></th>${Array.from({length:mc},(_,i)=>`<th>${E.column(i+1)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:mr},(_,i)=>`<tr><th>${i+1}</th>${Array.from({length:mc},(_,j)=>{const v=cells[E.address(i+1,j+1)];return `<td class="${typeof v==='number'?'cell-num':''}">${esc(typeof v==='number'?format(v,6):v??'')}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;}
function lessonView(){const l=lessonBy(ui.id),s=ls(l.id),m=modBy(l.module),index=D.lessons.indexOf(l),finished=!!S.done[l.id];return `<div class="lesson-header"><button class="text-button" data-action="open-module" data-id="${l.module}">${icon('back',true)} Öğrenme yoluna dön</button><div class="pill-row">${tag(String(l.module).padStart(2,'0')+' / '+m.tag)}${tag('Ders '+l.n+' / 6','gray')}${tag(l.minutes+' dk öneri','gray')}${finished?tag('Tamamlandı · '+'★'.repeat(S.done[l.id].stars)):tag('100 XP','amber')}</div><h1>${esc(l.title)}</h1><p class="small muted" style="margin-top:9px">${esc(l.version)}</p></div><div class="section-grid"><section><div class="tabs lesson-tabs" role="tablist" aria-label="Ders adımları">${['Anla','Uygula','Kontrol'].map((t,i)=>`<button role="tab" aria-selected="${ui.lessonTab===i}" class="tab ${ui.lessonTab===i?'active':''}" data-action="lesson-tab" data-id="${i}"><span>${i+1}</span>${t}${i===1&&s.practice?' ✓':i===2&&s.quiz?' ✓':''}</button>`).join('')}</div>${ui.lessonTab===0?`<div class="card"><div class="eyebrow">ÖNCE MANTIĞINI KAVRA</div><p class="lesson-copy" style="margin-top:13px">${esc(l.body)}</p><ol class="steps">${l.steps.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><div class="label-row"><h4>Bir örnekle görelim</h4><button class="text-button" data-action="copy-example" data-id="${l.id}">${icon('copy',true)} Kopyala</button></div><pre class="code-block">${esc(l.example)}</pre>${notice('<strong>'+icon('info',true)+'Buraya dikkat</strong>'+esc(l.pitfall),'warn')}<div class="button-row">${btn('Şimdi sıra sende','lesson-tab','1','','arrow')}</div></div>`:ui.lessonTab===1?practiceView(l):quizView(l)}${finished?`<div class="completion">${icon('award')}<div><h3>Bu adım tamamlandı.</h3><p>+100 XP · ${'★'.repeat(S.done[l.id].stars)} · Gerçek Excel görevini de kendi dosyanda uygula.</p></div>${index<95?btn('Sonraki ders','lesson',D.lessons[index+1].id,'','arrow'):btn('Projeleri tamamla','nav','projects','','arrow')}</div>`:''}</section><aside class="aside"><div class="card"><div class="aside-title">Ders kontrol listesi</div><div class="check-line ${s.practice?'ok':''}"><span class="status-dot">${s.practice?icon('check',true):'1'}</span><span>${l.drill?'Formül testlerini geç':'İşlem sırasını doğrula'}</span></div><div class="check-line ${s.quiz?'ok':''}"><span class="status-dot">${s.quiz?icon('check',true):'2'}</span><span>Kontrol sorusunu çöz</span></div><div class="check-line ${finished?'ok':''}"><span class="status-dot">${finished?icon('check',true):'3'}</span><span>Dersi tamamla</span></div><p class="small muted">Ders puanı yalnızca ilk tamamlamada verilir. İpucu veya çözüm görmek öğrenmeyi engellemez; yıldızını etkiler.</p>${!finished?`<button class="btn full margin-top" data-action="complete" data-id="${l.id}" ${s.practice&&s.quiz?'':'disabled'}>${icon('check',true)} Dersi tamamla · 100 XP</button>`:''}</div><div class="card"><div class="aside-title">Gerçek Excel görevi</div><p class="small">${esc(l.real)}</p><div class="divider"></div><label for="lesson-note" class="small"><strong>Öğrenme notum</strong></label><textarea id="lesson-note" data-input="note" data-id="${l.id}" maxlength="3000" placeholder="Ne yaptın, hangi sonucu gördün?" style="margin-top:9px;font-size:12px">${esc(s.note)}</textarea><p class="small muted">Notun bu tarayıcıda otomatik saklanır.</p></div><div class="card"><div class="aside-title">Konuyu derinleştir</div><p class="small muted">Dış kaynaklar internet bağlantısıyla açılır.</p>${sources(l.refs)}</div></aside></div>`;}
function practiceView(l){const s=ls(l.id),f=ui.feedback[l.id];if(!ui.orders[l.id])ui.orders[l.id]=[1,2,0];const feedback=f?notice(esc(f.text),f.ok?'success':'error'):'';return `<div class="card"><div class="eyebrow">DENE · GERİ BİLDİRİM AL · GELİŞTİR</div><h2 style="margin-top:11px">${l.drill?'Formülü sen kur.':'Doğru işlem sırasını kur.'}</h2>${l.drill?`<p class="small" style="margin-top:10px">${esc(l.drill.prompt)}</p>${seedTable(l.drill.seed)}<label class="small" for="drill-formula"><strong>${esc(l.drill.target)} hücresine yazacağın formül</strong></label><input class="formula-input" id="drill-formula" data-input="drill" data-id="${l.id}" spellcheck="false" autocomplete="off" maxlength="2048" placeholder="= ile başla…" value="${esc(s.formula)}" style="margin-top:7px"><p class="small muted" style="margin-top:9px">Formül ${l.drill.cases.length} veri senaryosunda sınanır. Sabit sonuç yazmak yerine hücre başvurularını kullan. TR: noktalı virgül; EN: virgül.</p><div class="button-row">${btn('Formülümü kontrol et','check-drill',l.id,'','play')}${btn('Atölyede aç','load-drill',l.id,'secondary','grid')}</div>`:`<p class="small muted" style="margin-top:10px">Aşağıdaki adımları yukarı ve aşağı oklarıyla, derste anlatılan sıraya getir. Bu alıştırma kavramsal sırayı sınar; gerçek Excel görevinin yerine geçmez.</p><div class="order-list">${ui.orders[l.id].map((v,i)=>`<div class="order-item"><span class="order-num">${i+1}</span><p>${esc(l.steps[v])}</p><div class="order-buttons"><button data-action="order-up" data-id="${i}" aria-label="${i+1}. adımı yukarı taşı" ${i===0?'disabled':''}>↑</button><button data-action="order-down" data-id="${i}" aria-label="${i+1}. adımı aşağı taşı" ${i===2?'disabled':''}>↓</button></div></div>`).join('')}</div>${btn('Sıralamayı kontrol et','check-order',l.id,'','check')}`}<div class="spacer"></div>${feedback}${s.practice&&!f?notice('Uygulama tamamlandı. Kontrol sorusuna geçebilirsin.','success'):''}<div class="button-row">${btn('Bir ipucu al','hint',l.id,'ghost sm','help')}${btn('Çözümü göster','reveal',l.id,'ghost sm','book')}${s.practice?btn('Kontrol sorusuna geç','lesson-tab','2','sm','arrow'):''}</div>${s.hints?notice('<strong>İpucu</strong>'+esc(l.drill?'Verinin hangi hücrelerde olduğuna bak. İşlemi küçük parçalara ayır; önce en içteki hesabı kur. '+l.pitfall:'Önce hazırlık, ardından işlem, en son sonucu doğrulama adımını düşün. '+l.steps[0])):''}${s.reveal?`<div class="margin-top">${notice('Çözümü görmek dersi otomatik tamamlamaz. Formülü veya işlem sırasını kendin uygulayıp kontrol et.','warn')}<pre class="code-block">${esc(l.drill?l.drill.solution:l.steps.map((x,i)=>(i+1)+'. '+x).join('\n'))}</pre></div>`:''}</div>`;}
function quizView(l){const s=ls(l.id),choice=ui.quizChoice[l.id];return `<div class="card"><div class="eyebrow">ANLADIĞINI GÖSTER</div><div class="quiz-question">${esc(l.question)}</div>${l.options.map((o,i)=>`<button class="option ${s.quiz&&i===l.answer?'correct':choice===i&&i!==l.answer?'wrong':''}" data-action="quiz" data-id="${i}"><span class="choice-letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}${s.quiz?`<div class="margin-top">${notice('<strong>Doğru cevap.</strong>'+esc(l.explanation),'success')}</div>`:choice!==undefined?`<div class="margin-top">${notice('Henüz doğru değil. Dersin örneğini ve “Buraya dikkat” notunu yeniden düşün; tekrar deneyebilirsin.','warn')}</div>`:''}<div class="button-row">${!s.practice?btn('Uygulamayı tamamla','lesson-tab','1','secondary','back'):''}${!S.done[l.id]?`<button class="btn" data-action="complete" data-id="${l.id}" ${s.practice&&s.quiz?'':'disabled'}>${icon('check',true)} Dersi tamamla · 100 XP</button>`:''}</div><p class="small muted margin-top">Kontrol sorusu ve uygulama birlikte tamamlanmalıdır. Gerçek Excel çalışmanı sağdaki not alanında belgeleyebilirsin.</p></div>`;}
function checkDrill(l,formula){if(!formula||!formula.trim().startsWith('='))return {ok:false,text:'Formül = işaretiyle başlamalı.'};const anchorRefs=(l.drill.solution.match(/\$[A-Z]+\$?\d+|[A-Z]+\$\d+/g)||[]);for(const a of anchorRefs)if(!formula.toUpperCase().includes(a))return {ok:false,text:'Bu görevde sabit/karma başvuru isteniyor. '+a+' başvurusunun dolar işaretlerini kontrol et.'};let passed=0;for(const [i,c]of l.drill.cases.entries()){const r=E.evaluate(formula,c.cells,S.profile.locale,l.drill.target);if(!r.ok)return {ok:false,text:(i+1)+'. senaryo: '+r.error+' — '+r.message};const match=typeof c.expected==='number'?typeof r.value==='number'&&Math.abs(r.value-c.expected)<=1e-8*Math.max(1,Math.abs(c.expected)):r.value===c.expected;if(!match)return {ok:false,text:(i+1)+'. senaryoda sonuç '+format(r.value,8)+'. Beklenen '+format(c.expected,8)+'. '+(i?'İlk değerlerle yetinme; farklı değerlerde de çalışan hücre başvuruları kullan.':'Veri aralığını, işlevi ve işlem sırasını kontrol et.')};passed++;}return {ok:true,text:'Harika! '+passed+' / '+l.drill.cases.length+' veri senaryosu geçti. Formülün bu görev için doğru sonuç üretiyor.'};}
function completeLesson(id){const s=ls(id);if(!s.practice||!s.quiz)return toast('Önce uygulamayı ve kontrol sorusunu tamamla.');if(S.done[id])return toast('Bu dersin XP puanı zaten kazanıldı.');S.done[id]={when:day(),stars:s.reveal?1:s.hints||s.attempts>3?2:3};S.review[id]={due:addDay(day(),1),level:0};activity();save();render();toast('Ders tamamlandı! +100 XP ve bir adım daha ileri.');}

function labView(){return pageHeading('Uygulama atölyesi','Güvenle dene. Değeri değiştir, sonucu gözle, mantığını keşfet.',btn('Veri dosyasını indir','download-xlsx','','secondary','download'))+`<div class="tabs" role="tablist" aria-label="Atölyeler">${[['grid','Formül alanı'],['pivot','Pivot simülatörü'],['clean','Veri temizleme']].map(t=>`<button class="tab ${ui.labTab===t[0]?'active':''}" role="tab" aria-selected="${ui.labTab===t[0]}" data-action="lab-tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>`+(ui.labTab==='grid'?gridView():ui.labTab==='pivot'?pivotView():cleanView());}

reen)':'var(--red)'}">${f.checks[i]?'✓ Sayısal sonuç doğru.':'Sonuç henüz eşleşmiyor. İpucunu ve veri kapsamını kontrol et.'}</p>`:''}</div>`).join('')}<div class="divider"></div><h4>Teslim kontrol listesi</h4><p class="small muted">Bu bölüm kendi beyanındır; uygulama dosyanı incelemez.</p>${p.rubric.map((r,i)=>`<label class="rubric"><input type="checkbox" data-change="project-rubric" data-index="${i}" ${s.rubric[i]?'checked':''}><span>${esc(r)}</span></label>`).join('')}<div class="button-row">${btn(s.done?'Sonuçları yeniden kontrol et':'Kontrol et ve projeyi tamamla','check-project',p.id,'','check')}</div>${f?`<div class="margin-top">${notice(esc(f.message),f.ok?'success':'warn')}</div>`:''}${s.done?`<div class="completion">${icon('award')}<div><h3>Proje tamamlandı · +250 XP</h3><p>Sayısal kontroller geçti; teslim ölçütlerini kendin onayladın. Gerçek dosyanı ayrıca sakla.</p></div></div>`:''}</div></section><aside class="aside"><div class="card"><div class="aside-title">İşe yarayan modüller</div>${p.modules.map(id=>`<button class="lesson-row" style="margin-bottom:8px" data-action="open-module" data-id="${id}"><span class="status-dot">${id}</span><span>${esc(modBy(id).title)}</span></button>`).join('')}</div><div class="card"><div class="aside-title">İyi bir teslim nasıl görünür?</div><p class="small">Ham veri, dönüşüm ve rapor alanlarını ayır. Açıklayıcı başlıklar, tutarlı birimler ve anlaşılır formüller kullan.</p><p class="small">Sadece beklenen sayıyı bulmak yeterli değildir: yeni bir veri satırı ekle, değişiklikleri izle ve hatalı girişe karşı kontrol kur.</p><div class="button-row">${btn('Sorun çözücü','nav','errors','secondary sm','shield')}</div></div></aside></div>`;}
function checkProject(id){const p=projectBy(id),s=ps(id),checks=p.checks.map((c,i)=>{const n=E.numText(s.answers[i],'tr');return n!==null&&Math.abs(n-c.value)<.005;}),ok=checks.every(Boolean)&&s.rubric.every(Boolean);ui.projectFeedback[id]={checks,ok,message:ok?'Üç sayısal sonuç da doğru; dört teslim ölçütü onaylandı.':!checks.every(Boolean)?'Henüz bütün sonuçlar doğru değil. Hangi satırların hesaba girdiğini, birimleri ve boş/hatalı değerleri kontrol et.':'Sayısal sonuçlar doğru. Projeyi bitirmek için dört teslim ölçütünü gerçek dosyanda yerine getirip işaretle.'};if(ok&&!s.done){s.done=true;s.when=day();activity();toast('Proje tamamlandı! +250 XP.');}save();render();}
function reviewView(){const all=Object.keys(S.done),due=all.filter(id=>!S.review[id]||S.review[id].due<=day());if(!all.length)return pageHeading('Bilgiyi kalıcı hale getir.','Tamamladığın derslerden oluşan aralıklı tekrar kartları.')+empty('İlk kartın, ilk dersten sonra burada.','Ders tamamlandığında kart ertesi güne planlanır. “Hatırladım” yanıtları aralığı 1, 3, 7 ve 14 güne taşır; “Tekrar” kartı bugüne döndürür.',btn('İlk derse başla','lesson',nextLesson().id,'','arrow'));

 case'check-project':checkProject(id);break;
 case'review-flip':ui.reviewFlip=true;render();break;case'review-select':ui.reviewId=id;ui.reviewFlip=false;render();break;case'review-again':advanceReview(id,false);break;case'review-remember':advanceReview(id,true);break;
 case'gloss-tab':ui.glossTab=id;render();break;case'function-open':ui.openFunction=ui.openFunction===id?'':id;render();break;case'copy-function':copyText(D.functions.find(f=>f.en===id).example);break;
 case'translate':{ui.translateInput=$('#translate-input').value;ui.translateTo=$('#translate-direction').value;try{ui.translateOutput=E.translate(ui.translateInput,ui.translateTo,ui.translateTo==='tr'?'en':'tr');}catch(e){ui.translateOutput='Bu formül dönüştürülemedi.';}render();break;}
 case'copy-translation':copyText(ui.translateOutput);break;
 case'find-function':closeSearch();$('#global-search').value='';ui.glossTab='functions';ui.functionCategory='all';ui.functionSearch=id;ui.openFunction=id;go('glossary');break;
 case'find-error':closeSearch();$('#global-search').value='';ui.errorSearch='';ui.errorId=id;go('errors');break;
 case'find-resource':closeSearch();$('#global-search').value='';ui.resourceType='all';ui.resourceLang='all';ui.resourceSearch=sourceBy(id).title;go('resources');break;
 case'exam-start':startExam();break;case'exam-index':if(ui.exam){ui.exam.index=Math.max(0,Math.min(19,+id));render();}break;case'exam-answer':if(ui.exam){ui.exam.answers[ui.exam.ids[ui.exam.index]]=+id;render();}break;case'exam-finish':finishExam();break;
 case'print':window.print();break;
 case'save-profile':{const locale=$('#profile-locale').value;S.profile={name:$('#profile-name').value.trim().slice(0,40),version:$('#profile-version').value,platform:$('#profile-platform').value,locale,goal:+$('#profile-goal').value};save();render();toast('Tercihlerin kaydedildi.');break;}
 case'backup':downloadBlob('Excel_Ustasi_Yedek_'+day()+'.json',JSON.stringify(S,null,2),'application/json');toast('Yedek indirildi; notların ve ilerlemen bu dosyanın içinde.');break;
 case'restore':$('#backup-file').click();break;
 case'reset':if(confirm('Bütün yerel ilerleme, notlar ve atölye verileri silinecek. Önce yedek aldıysan devam et. Sıfırlansın mı?')&&confirm('Son onay: Bu işlem geri alınamaz. Yerel kayıt tamamen silinsin mi?')){S=blankState();save();ui.feedback={};ui.orders={};ui.quizChoice={};ui.projectFeedback={};ui.exam=null;ui.examResult=null;ui.labTask=null;ui.labFeedback=null;ui.undo=[];ui.selected='D6';ui.lessonTab=0;go('dashboard');toast('Yeni öğrenme yolun hazır.');}break;
 }
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='global-search'){globalSearch(el.value);return;}const a=el.dataset.input;if(!a)return;
 if(a==='drill'){ls(el.dataset.id).formula=el.value.slice(0,2048);save();}
 if(a==='note'){ls(el.dataset.id).note=el.value.slice(0,3000);save();}
 if(a==='error-search')ui.errorSearch=el.value;
 if(a==='project-answer'){ps(ui.id).answers[+el.dataset.index]=el.value;save();}
 if(a==='function-search'||a==='resource-search'){if(a==='function-search')ui.functionSearch=el.value;else ui.resourceSearch=el.value;const id=el.id;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(document.getElementById(id))renderKeepInput(id);},200);}
});
document.addEventListener('change',async event=>{const el=event.target,a=el.dataset.change,v=el.value;
 if(a==='path-filter'){ui.pathFilter=v;render();}
 if(a==='lab-format'){labSnapshot();S.lab.formats[ui.selected]=v;save();render();}
 if(a?.startsWith('pivot-')){ui.pivot[a.slice(6)]=v;render();}
 if(a==='function-category'){ui.functionCategory=v;render();}
 if(a==='resource-type'){ui.resourceType=v;render();}if(a==='resource-lang'){ui.resourceLang=v;render();}
 if(a==='project-rubric'){ps(ui.id).rubric[+el.dataset.index]=el.checked;save();}
 if(el.id==='backup-file'){const file=el.files[0];if(!file)return;try{if(file.size>2000000)throw Error('Yedek en fazla 2 MB olabilir.');const raw=JSON.parse(await file.text()),imported=cleanState(raw);if(confirm('Yedek yüklenince mevcut ilerlemen ve notların değiştirilecek. Devam edilsin mi?')){S=imported;ui.feedback={};ui.quizChoice={};ui.orders={};ui.projectFeedback={};ui.labTask=null;ui.labFeedback=null;ui.undo=[];ui.exam=null;ui.examResult=null;save();render();toast('Yedek başarıyla yüklendi.');}}catch(e){toast('Yedek yüklenemedi: '+e.message);}el.value='';}
 if(el.id==='csv-file'){const file=el.files[0];if(!file)return;try{if(file.size>1000000)throw Error('CSV en fazla 1 MB olabilir.');const rows=parseCSV(await file.text());if(!rows.length)throw Error('Dosyada satır bulunamadı.');if(confirm('Mevcut atölye tablosu CSV ile değiştirilecek. Yalnızca ilk 16 satır ve 8 sütun alınır. Devam edilsin mi?')){labSnapshot();S.lab={cells:{},formats:{}};rows.slice(0,16).forEach((r,i)=>r.slice(0,8).forEach((v,j)=>{const n=E.numText(v,S.profile.locale);S.lab.cells[E.address(i+1,j+1)]=n!==null?n:(/^[\s]*[=+\-@]/.test(v)?"'"+v:v).slice(0,2048);}));ui.labTask=null;ui.selected='A1';save();render();toast(rows.length>16||rows.some(r=>r.length>8)?'CSV kırpılarak alındı: en fazla 16 satır × 8 sütun.':'CSV alındı. Formül benzeri metinler çalıştırılmadan korunur.');}}catch(e){toast('CSV içe aktarılamadı: '+e.message);}el.value='';}
});
document.addEventListener('keydown',event=>{
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('#global-search').focus();return;}
 if(event.key==='Escape'){closeSearch();menu(false);return;}
 if(event.key==='Enter'&&event.target.id==='error-search'){event.preventDefault();ui.errorId='';render();return;}
 if(event.key==='Enter'&&event.target.id==='drill-formula'){event.preventDefault();$('[data-action="check-drill"]')?.click();return;}
 if(event.key==='Enter'&&event.target.id==='lab-formula'){event.preventDefault();applyCell();return;}
 if(event.key==='ArrowDown'&&event.target.id==='global-search'&&ui.searchOpen){event.preventDefault();$('#search-results button')?.focus();return;}
 if(event.target.closest('#search-results')&&['ArrowDown','ArrowUp'].includes(event.key)){const arr=$$('#search-results button'),i=arr.indexOf(event.target);event.preventDefault();arr[(i+(event.key==='ArrowDown'?1:arr.length-1))%arr.length]?.focus();return;}
 if(ui.view==='lab'&&ui.labTab==='grid'&&event.target.matches('[data-action="select-cell"]')){const pos=E.position(ui.selected),steps={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};if(steps[event.key]){event.preventDefault();const [dr,dc]=steps[event.key],r=Math.min(16,Math.max(1,pos.r+dr)),c=Math.min(8,Math.max(1,pos.c+dc));selectCell(E.address(r,c),true);}else if(event.key==='Delete'||event.key==='Backspace'){event.preventDefault();labSnapshot();delete S.lab.cells[ui.selected];save();selectCell(ui.selected,true);}else if(event.key==='F2'){event.preventDefault();$('#lab-formula').focus();$('#lab-formula').select();}}
});
document.addEventListener('dblclick',event=>{if(event.target.closest('[data-action="select-cell"]')){$('#lab-formula')?.focus();$('#lab-formula')?.select();}});
document.addEventListener('paste',event=>{if(ui.view!=='lab'||ui.labTab!=='grid'||!event.target.matches('[data-action="select-cell"]'))return;const text=event.clipboardData?.getData('text/plain');if(!text)return;event.preventDefault();if(text.length>100000){toast('Yapıştırılan veri çok büyük. En fazla 100.000 karakter kullan.');return;}const rows=text.replace(/\r\n/g,'\n').replace(/\n$/,'').split('\n').map(r=>r.split('\t')),pos=E.position(ui.selected);labSnapshot();let n=0;rows.forEach((r,i)=>r.forEach((v,j)=>{if(pos.r+i<=16&&pos.c+j<=8){S.lab.cells[E.address(pos.r+i,pos.c+j)]=v.slice(0,2048);n++;}}));save();render();toast(n+' hücre yapıştırıldı. Tablo sınırı 16 satır × 8 sütun.');});
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){$('#main').focus();return;}readRoute();render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});
window.addEventListener('error',event=>{console.error('Excel Ustasi:',event.error);});
shell();readRoute();render();
// Public, read-only diagnostics for automated tests; no executable formula shortcuts.
window.ExcelUstasiDiagnostics={version:D.version,counts:{lessons:D.lessons.length,drills:D.lessons.filter(l=>l.drill).length,functions:D.functions.length,live:D.functions.filter(f=>f.live).length,errors:D.errors.length,projects:D.projects.length,sources:D.sources.length},inspect:()=>({view:ui.view,completed:completed(),xp:xp(),storageOK,clean:getClean(),pivot:getPivot().raw.length})};
})();
</script></body></html>
