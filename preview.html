abı seç.","İlk sayfanın sekmesine çift tıkla; adını Satis yap.","Yeni sayfa ekle, Rapor adını ver; sonra Satis sayfasına geri dön."],"example":"Kitap: AylikRapor.xlsx\nSayfalar: Satis • Urunler • Rapor","pitfall":"Sayfayı yeniden adlandırmak dosyanın adını değiştirmez. Aynı kitapta anlamlı ve farklı sayfa adları kullan.","question":"Bir Excel dosyasındaki alt sekmeler neyi temsil eder?","options":["Çalışma sayfalarını","Ayrı Excel uygulamalarını","Yalnızca grafikleri","Yazıcı ayarlarını"],"answer":0,"explanation":"Bir kitap, bir veya daha çok çalışma sayfasını içerir.","drill":null,"minutes":9,"real":"Yeni bir kitap oluştur. Veriler, Hesaplama ve Rapor adlı üç sayfa ekle; kitabı IlkCalismam.xlsx olarak kaydet.","version":"Tüm sürümler","refs":["ms-start","gcf","xel-start","video-omer"]},{"id":"m01l02","module":1,"n":2,"title":"Hücre adresini oku","body":"Sütunlar harf, satırlar sayı ile gösterilir. B3, B sütunu ile 3. satırın kesişimidir. Seçili hücrenin adresini ad kutusunda, içeriğini formül çubuğunda görürsün. Adresleri anlamak, bir formülün hangi veriyi kullandığını takip etmeni sağlar.","steps":["Boş sayfada A1 hücresini seç ve Urun yaz.","B1 hücresine Adet yaz; B2 hücresine 8 gir.","Ad kutusuna B2 yazıp Enter’a bas; seçimin B2’ye gittiğini gözle."],"example":"A1 → Urun\nB1 → Adet\nB2 → 8","pitfall":"B2 ile 2B aynı değildir. A1 başvuru biçiminde önce sütun, sonra satır yazılır.","question":"D sütunu ile 7. satırın kesişimi hangisidir?","options":["7D","D7","D:7","7:7"],"answer":1,"explanation":"D7 adresinde harf sütunu, sayı satırı belirtir.","drill":null,"minutes":9,"real":"A1:C4 alanına üç sütunlu bir liste gir. Atölye’de B2’yi seçip formül çubuğunda değerini değiştir.","version":"Tüm sürümler","refs":["ms-start","gcf","xel-start","video-omer"]},{"id":"m01l03","module":1,"n":3,"title":"Veri gir, düzelt, geri al","body":"Bir hücre metin, sayı veya formül içerebilir. Enter genellikle aşağı, Tab sağa ilerletir. İçeriği tamamen değiştirmek için hücreye yeni bir değer girebilir, kısmen düzeltmek için formül çubuğunu kullanabilirsin. Yanlış bir işlemden sonra hemen geri almak, veriyi yeniden kurmaktan daha güvenlidir.","steps":["A1’e Kalem, B1’e 12 gir; Tab ile sağa ilerle.","B1’i seç, formül çubuğunda 12’yi 15 yap ve Enter’a bas.","Geri Al komutuyla önceki değere dön; B1’in yeniden 12 olduğunu doğrula."],"example":"Veri: 15\nMetin: Kalem\nFormül: =B1*2","pitfall":"Delete içeriği temizler; tüm hücreyi veya satırı silmek komşu verilerin konumunu değiştirir.","question":"Yanlışlıkla sildiğin içeriği hemen geri getirmenin en uygun yolu nedir?","options":["Dosyayı kapatmak","Rengi değiştirmek","Geri Al komutunu kullanmak","Sayfayı yeniden adlandırmak"],"answer":2,"explanation":"Geri Al son işlemi tersine çevirir; dosyayı kapatmak kayıpları artırabilir.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","gcf","xel-start","video-omer"]},{"id":"m01l04","module":1,"n":4,"title":"Aralık seç ve kopyala","body":"A2:C5, iki uç hücre dahil dikdörtgen bir aralıktır. Bu aralık dört satır ve üç sütun içerir. Seçim yaparken başlığın ve veri satırlarının sınırını düşün. Kopyalama özgün veriyi korur; kesme veriyi taşır. Yapıştırma seçeneği, içeriğin formül mü yoksa yalnızca değer mi olarak aktarılacağını belirler.","steps":["A1:B3 alanına küçük bir ürün listesi gir.","Ad kutusundan A1:B3 aralığını seç ve Kopyala komutunu kullan.","D1’i seçip yapıştır; kaynak alanın hâlâ yerinde olduğunu doğrula."],"example":"A2:C5 → 4 satır × 3 sütun = 12 hücre","pitfall":"İki nokta aralık belirtir. Yalnızca bir veri sütununu taşımak, diğer sütunlarla kayıt eşleşmesini bozabilir.","question":"A2:C5 aralığı kaç hücre içerir?","options":["6","8","12","15"],"answer":2,"explanation":"Satırlar 2, 3, 4 ve 5; sütunlar A, B ve C’dir: 4 × 3 = 12.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","gcf","xel-start","video-omer"]},{"id":"m01l05","module":1,"n":5,"title":"Doldurma tutamacıyla seri oluştur","body":"Hücrenin sağ alt köşesindeki doldurma tutamacı, bir örüntüyü veya formülü komşu hücrelere yayar. İki başlangıç değeri, istediğin artışı Excel’e daha açık gösterir. Formül kopyalandığında göreli başvuruların değiştiğini sonraki modülde ayrıntılı öğreneceksin.","steps":["A1’e 1, A2’ye 2 gir.","A1:A2’yi birlikte seç; doldurma tutamacını A6’ya kadar sürükle.","A6’nın 6 olduğunu kontrol et; aynı denemeyi 10 ve 20 ile tekrarla."],"example":"1, 2 → 3, 4, 5, 6\n10, 20 → 30, 40, 50, 60","pitfall":"Tek hücreyi sürüklemek bazen değer kopyalar; seri oluştuğunu varsaymak yerine son hücreyi denetle.","question":"5, 10 başlangıç serisini aynı adımla sürdürürsen sonraki değer nedir?","options":["11","15","20","50"],"answer":1,"explanation":"İki başlangıç değeri arasındaki fark 5’tir; bir sonraki değer 15 olur.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","gcf","xel-start","video-omer"]},{"id":"m01l06","module":1,"n":6,"title":"Kaydetme ve dosya türleri","body":"XLSX; sayfaları, biçimleri ve formülleri saklayan standart çalışma kitabı biçimidir. CSV düz metin verisi içindir; bir çalışma kitabının bütün özelliklerini korumaz. Makro içeren dosyalarda XLSM gerekir. İşe başlarken dosya adı, konum ve yedek alışkanlığını belirlemek seni birçok kayıptan korur.","steps":["Bir kitap oluştur ve Dosya \u003e Farklı Kaydet yolunu aç.","Dosya türünü Excel Çalışma Kitabı (.xlsx) seç; anlamlı bir adla kaydet.","Bir hücreyi değiştir, tekrar kaydet ve dosya konumunu doğrula."],"example":"Uygun ad: Satis_2026-01_v01.xlsx\nCSV: veri aktarımı\nXLSM: makro içeren çalışma kitabı","pitfall":"CSV’ye geçerken birden çok sayfa, biçimler ve birçok çalışma kitabı özelliği kaybolabilir. Özgün XLSX dosyanı koru.","question":"Formülleri, biçimleri ve birden çok sayfayı korumak için hangisi uygundur?","options":["TXT","CSV","JPG","XLSX"],"answer":3,"explanation":"XLSX bir çalışma kitabı biçimidir; CSV ise tablosal metin aktarım biçimidir.","drill":null,"minutes":9,"real":"IlkCalismam.xlsx dosyanı kaydet. Bir kopyasını başka bir klasöre al. CSV’nin çalışma kitabı yedeği olmadığını not et.","version":"Tüm sürümler","refs":["ms-start","gcf","xel-start","video-omer"]},{"id":"m02l01","module":2,"n":1,"title":"Değer ile görünümü ayır","body":"Hücrede saklanan değer ile ekranda görülen biçim aynı şey değildir. 12,345 sayısını iki ondalıkla göstermek, temel değeri 12,35 yapmaz. Hücre biçimlendirme görünümü; YUVARLA gibi bir formül ise hesaplamada kullanılacak değeri değiştirir. Bu fark toplamların neden farklı göründüğünü açıklar.","steps":["A1’e 12,345 gir.","Hücreleri Biçimlendir menüsünde Sayı seç; ondalık basamağı 2 yap.","A1’i seçip formül çubuğunda asıl değerin hâlâ 12,345 olduğunu kontrol et."],"example":"Saklanan: 12,345\nGösterilen: 12,35\nGerçek yuvarlama: =YUVARLA(A1;2)","pitfall":"Ondalık basamakları gizlemek, hesaplama hassasiyetini değiştirmez.","question":"İki ondalık basamak göstermek asıl sayıyı mutlaka değiştirir mi?","options":["Evet, her zaman","Hayır, yalnızca görünümü değiştirir","Yalnızca negatif sayıda","Dosya kapanınca değiştirir"],"answer":1,"explanation":"Sayı biçimi gösterimi değiştirir. Değeri yuvarlamak ayrı bir işlemdir.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-table","xel-start"]},{"id":"m02l02","module":2,"n":2,"title":"Yüzdeyi doğru yorumla","body":"Yüzde, bir oranın yüz üzerinden gösterimidir. 0,15 değeri yüzde biçiminde %15 görünür. Excel’e doğrudan 15% yazmak da aynı oranı girmenin bir yoludur. Artış oranı ile artış miktarını ayır: 100’den 120’ye çıkış 20 birim ve %20 artıştır.","steps":["A1’e 0,15 gir.","A1’e yüzde biçimi uygula ve %15 görüntüsünü kontrol et.","B1’e 200 yaz; C1’de B1*A1 çarpımını hesapla."],"example":"=B1*A1\n200 × %15 = 30","pitfall":"15 değerine yüzde biçimi verirsen %1500 görünür. Oran olarak 0,15 veya 15% gir.","question":"0,25 sayısı yüzde biçiminde nasıl görünür?","options":["%0,25","%2,5","%25","%250"],"answer":2,"explanation":"Yüzde biçimi 0,25’i 100 ile ölçekleyerek %25 gösterir.","drill":{"prompt":"B1 tutarının A1 oranındaki kısmını hesaplayan formülü yaz.","seed":{"A1":0.15,"B1":200},"solution":"=B1*A1","cases":[{"cells":{"A1":0.15,"B1":200},"expected":30},{"cells":{"A1":0.15,"B1":400},"expected":60}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-table","xel-start"]},{"id":"m02l03","module":2,"n":3,"title":"Tarih ve saat biçimleri","body":"Excel tarih ve saatleri hesaplanabilir sayısal değerlerle temsil eder. Görünen tarih biçimi bölgesel ayarlara göre değişebilir. Özellikle gün ve ay sırasının belirsiz olduğu içe aktarmalarda sütunun gerçek tarih mi yoksa metin mi olduğunu denetlemek gerekir. Ayrı yıl, ay ve gün girdilerinden TARİH işleviyle tarih kurmak belirsizliği azaltır.","steps":["A1’e =TARİH(2026;9;8) yaz.","A1’i Tarih biçimine getir; gün, ay ve yılın beklediğin gibi olduğunu denetle.","B1’e =A1+7 yaz; tarih biçimi verip bir hafta sonrasını gözle."],"example":"=TARİH(2026;9;8)+7","pitfall":"08/09/2026 farklı bölgesel ayarlarda farklı yorumlanabilir. İçe aktarmada yerel ayarı açıkça belirt.","question":"Bir tarih değerine 7 eklendiğinde ne elde edilir?","options":["7 ay sonrası","7 gün sonrası","7 yıl sonrası","Haftanın adı"],"answer":1,"explanation":"Excel’in tarih seri değerlerinde tam sayı artışı günleri temsil eder.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-table","xel-start"]},{"id":"m02l04","module":2,"n":4,"title":"Okunur tablo tasarla","body":"İyi bir çalışma tablosu tek başlık satırı, her sütunda tek tür bilgi ve her satırda tek kayıt içerir. Hücre rengi veri yerine geçmemelidir; durum bilgisini ayrı sütunda tut. Başlıkları görünür, sayı biçimlerini tutarlı yap. Ham veri alanında birleştirilmiş hücreler analiz araçlarını zorlaştırır.","steps":["A1:C1’e Tarih, Urun ve Tutar başlıklarını gir.","Altına üç kayıt ekle; başlığı kalınlaştır ve sütun genişliklerini ayarla.","Tutar sütununa tutarlı sayı biçimi ver; boş ara satırları kaldır."],"example":"Tarih | Urun | Tutar\n08.09.2026 | Kalem | 120","pitfall":"Başlık satırını veri satırlarıyla karıştırma. Görsel boşluk için ham verinin içine boş satır koyma.","question":"Analize uygun ham veride bir satır neyi temsil etmelidir?","options":["Tek kaydı","Birden çok bağımsız tabloyu","Yalnızca biçimlendirmeyi","Sadece toplamları"],"answer":0,"explanation":"Her satır tek kayıt olduğunda sıralama, filtreleme ve özetleme güvenilir olur.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-table","xel-start"]},{"id":"m02l05","module":2,"n":5,"title":"Bölmeleri dondur ve görünümü yönet","body":"Uzun listelerde başlıkların kaybolması, yanlış sütuna veri girmene yol açabilir. Bölmeleri Dondur yalnızca görünümü değiştirir; veriyi kilitlemez. Seçimin üstündeki satırlar ve solundaki sütunlar sabitlenir. Düzenlemeyi engellemek için kullanılan sayfa koruması farklı bir konudur.","steps":["En az on satırlı bir liste aç.","B2 hücresini seç; Görünüm \u003e Bölmeleri Dondur komutunu uygula.","Aşağı ve sağa kaydır; ilk satır ile ilk sütunun sabit kaldığını denetle."],"example":"B2’den dondur → 1. satır + A sütunu sabit","pitfall":"Dondurmak hücreyi değişikliklere karşı korumaz; yalnızca kaydırma davranışını etkiler.","question":"İlk satır ile ilk sütunu birlikte dondurmak için hangi hücre seçilir?","options":["A1","A2","B1","B2"],"answer":3,"explanation":"B2’nin üstünde 1. satır, solunda A sütunu vardır.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-table","xel-start"]},{"id":"m02l06","module":2,"n":6,"title":"Yazdırılabilir rapor hazırla","body":"Ekranda iyi görünen bir tablo kâğıtta aynı şekilde görünmeyebilir. Yazdırma alanı, yönlendirme, kenar boşlukları ve ölçek birlikte düşünülmelidir. Geniş raporu tek sayfa genişliğine sığdırmak yararlıdır; her şeyi tek sayfaya küçültmek okunurluğu yok edebilir.","steps":["Rapor aralığını seç ve Sayfa Düzeni \u003e Yazdırma Alanı ayarla.","Sayfa yönünü ve bir sayfa genişliğine sığdırma seçeneğini düzenle.","Dosya \u003e Yazdır önizlemesinde başlıkları, kesilen sütunları ve metin boyutunu kontrol et."],"example":"Öneri: genişlik 1 sayfa, yükseklik otomatik\nUzun rapor: üstte yinelenecek başlık satırı","pitfall":"Tüm raporu tek sayfaya zorlamak, yazıyı okunamayacak kadar küçültebilir.","question":"Son kontrolü nerede yapmalısın?","options":["Yalnızca normal hücre görünümünde","Dosya adında","Baskı önizlemesinde","Formül çubuğunda"],"answer":2,"explanation":"Önizleme, sayfa kesimlerini ve gerçek çıktı düzenini görmeni sağlar.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-table","xel-start"]},{"id":"m03l01","module":3,"n":1,"title":"İlk hesaplamanı yaz","body":"Formüller eşittir işaretiyle başlar. Sayıları doğrudan yazmak yerine hücrelere başvurmak, giriş değiştiğinde sonucu yeniden hesaplatır. Ürün adedi B2, birim fiyat C2 ise satır tutarı bu iki değerin çarpımıdır. Girdi ile sonucu ayrı hücrelerde tutmak modeli anlaşılır kılar.","steps":["B2’ye 4, C2’ye 25 gir.","D2’yi seç ve =B2*C2 yazıp Enter’a bas.","B2’yi 6 yap; D2’nin otomatik değiştiğini kontrol et."],"example":"=B2*C2","pitfall":"Formülün başındaki = eksikse Excel ifadeyi hesaplamak yerine metin olarak görebilir.","question":"Excel’de çarpma işleci hangisidir?","options":["x","*",":","\u0026"],"answer":1,"explanation":"Çarpma için yıldız (*) kullanılır.","drill":{"prompt":"Adet B2 ile birim fiyat C2’yi çarpan formülü yaz.","seed":{"B2":4,"C2":25},"solution":"=B2*C2","cases":[{"cells":{"B2":4,"C2":25},"expected":100},{"cells":{"B2":6,"C2":25},"expected":150}],"target":"D2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-formula","ms-tips"]},{"id":"m03l02","module":3,"n":2,"title":"İşlem önceliği ve parantez","body":"Çarpma ve bölme, toplama ve çıkarmadan önce yapılır. Parantezler istediğin işlem sırasını açıkça belirtir. İki giderin toplamına ortak çarpan uygularken toplamı paranteze almak gerekir. Doğru sözdizimi kadar, iş sorusunu doğru matematiğe çevirmek de önemlidir.","steps":["A1’e 10, B1’e 5, C1’e 2 gir.","D1’e =A1+B1*C1 yaz; sonucu gözle.","E1’e =(A1+B1)*C1 yaz ve iki sonucun neden farklı olduğunu açıkla."],"example":"=10+5*2 → 20\n=(10+5)*2 → 30","pitfall":"Excel senin iş önceliğini tahmin etmez. İstenen gruplamayı parantezle belirt.","question":"=(10+5)*2 işleminin sonucu nedir?","options":["20","25","30","40"],"answer":2,"explanation":"Önce parantez içi 15, sonra çarpma sonucu 30 olur.","drill":{"prompt":"A1 ve B1 toplamını C1 ile çarp.","seed":{"A1":10,"B1":5,"C1":2},"solution":"=(A1+B1)*C1","cases":[{"cells":{"A1":10,"B1":5,"C1":2},"expected":30},{"cells":{"A1":10,"B1":8,"C1":2},"expected":36}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-formula","ms-tips"]},{"id":"m03l03","module":3,"n":3,"title":"Göreli başvurular","body":"B2 gibi kilitsiz başvurular, formül kopyalandığında yeni konuma göre değişir. D2’deki =B2*C2 formülü bir satır aşağı taşınan kopyada =B3*C3 olur. Böylece her satır kendi girdileriyle hesaplanır. Formülü taşımak ile kopyalamak aynı işlem değildir; burada kopyalamayı öğreniyoruz.","steps":["B2:C3’e iki satırlık adet ve fiyat verisi gir.","D2’ye =B2*C2 yaz.","D2’yi D3’e aşağı doldur; D3’teki formülün =B3*C3 olduğunu doğrula."],"example":"D2: =B2*C2\nD3: =B3*C3","pitfall":"Kopyalama sonrası ilk ve son satırın formülünü kontrol et. Yanlış başlangıç, tüm sütuna yayılır.","question":"D2’deki =B2*C2 bir satır aşağı kopyalanınca ne olur?","options":["=B2*C2","=B3*C3","=$B$2*$C$2","=C2*D2"],"answer":1,"explanation":"Göreli başvurularda satır numarası kopyalama yönüne göre değişir.","drill":{"prompt":"Üçüncü satırdaki adedi ve fiyatı kullan.","seed":{"B2":4,"C2":25,"B3":3,"C3":40},"solution":"=B3*C3","cases":[{"cells":{"B2":4,"C2":25,"B3":3,"C3":40},"expected":120},{"cells":{"B2":4,"C2":25,"B3":5,"C3":40},"expected":200}],"target":"D3"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-formula","ms-tips"]},{"id":"m03l04","module":3,"n":4,"title":"Mutlak başvurular: $ işareti","body":"Bir oran veya varsayım hücresini tüm satırlarda kullanırken bu hücreyi sabitlemek gerekir. $F$1 hem F sütununu hem 1. satırı kilitler. Böylece aşağı veya sağa kopyalamada değişmez. İş modelindeki varsayımları tek yerde tutmak güncellemeyi kolaylaştırır.","steps":["F1’e örnek indirim oranı olarak 10% gir; B2’ye 200 yaz.","C2’ye =B2*(1-$F$1) yaz.","Formülü aşağı kopyala; fiyat başvurusunun değişip oran başvurusunun sabit kaldığını kontrol et."],"example":"=B2*(1-$F$1)","pitfall":"Oranı formülün içine tekrar tekrar yazmak yerine tek hücreye bağla. Örnekteki %10 yalnızca eğitim verisidir.","question":"Hem sütunu hem satırı sabitleyen başvuru hangisidir?","options":["F1","$F1","F$1","$F$1"],"answer":3,"explanation":"İki dolar işareti hem sütunu hem satırı sabitler.","drill":{"prompt":"B2 fiyatına F1 indirimini uygula; oranı mutlak başvuruyla sabitle.","seed":{"B2":200,"F1":0.1},"solution":"=B2*(1-$F$1)","cases":[{"cells":{"B2":200,"F1":0.1},"expected":180},{"cells":{"B2":300,"F1":0.2},"expected":240}],"target":"C2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-formula","ms-tips"]},{"id":"m03l05","module":3,"n":5,"title":"Karma başvurular","body":"Karma başvuruda yalnızca satır veya sütun kilitlenir. $A2 sütunu sabitler ama satırın değişmesine izin verir; B$1 satırı sabitler ama sütunu değiştirebilir. İki yönlü tablolar kurarken bu fark önemlidir. Hangi boyutun sabit kalacağını iş ihtiyacına göre seç.","steps":["A2:A4’e miktarlar; B1:D1’e fiyatlar gir.","B2’ye =$A2*B$1 yaz.","Formülü sağa ve aşağı doldur; her kesişimin doğru miktar-fiyat çiftini kullandığını kontrol et."],"example":"=$A2*B$1","pitfall":"Her başvuruyu tamamen kilitlemek çözüm değildir; bu kez tüm hücreler aynı girdiyi kullanır.","question":"B$1 sağa kopyalandığında nasıl değişir?","options":["$B$1","B$2","C$1","$C1"],"answer":2,"explanation":"Sütun göreli olduğu için B, C olur; satır 1 sabit kalır.","drill":{"prompt":"A2 miktarı ile B1 fiyatını çarp; A sütunu ve 1. satırı kilitle.","seed":{"A2":3,"B1":40},"solution":"=$A2*B$1","cases":[{"cells":{"A2":3,"B1":40},"expected":120},{"cells":{"A2":5,"B1":30},"expected":150}],"target":"B2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-formula","ms-tips"]},{"id":"m03l06","module":3,"n":6,"title":"Adlandırılmış aralıklar ve sayfalar","body":"Anlamlı adlar, uzun formülleri okumayı kolaylaştırır. Bir hücreye IndirimOrani adını verdiğinde formülde bu adı kullanabilirsin. Başka sayfadaki hücreye başvuru ise sayfa adı ve ünlemle kurulur. Ad tanımlamak veriyi kopyalamaz; bir aralığa etiket verir.","steps":["Ayarlar sayfasında B1’e 10% gir.","B1 için Ad Yöneticisi’nde IndirimOrani adını tanımla.","Satis sayfasında =200*(1-IndirimOrani) formülünü hesapla ve oranı değiştir."],"example":"=200*(1-IndirimOrani)\n=Ayarlar!B1\n='Aylik Satis'!B2","pitfall":"Adlarda boşluk kullanma. Yanlış sayfa adı veya silinen aralık, başvuru hatalarına yol açabilir.","question":"Başka sayfadaki hücreye başvuruda hangi işaret kullanılır?","options":["!","?","@","%"],"answer":0,"explanation":"Sayfa adı ile hücre adresi arasına ünlem gelir. Boşluklu sayfa adları tek tırnakla çevrilir.","drill":null,"minutes":9,"real":"İki sayfalı bir kitap oluştur. Bir varsayıma ad ver, diğer sayfada kullan. Not: Atölye tek sayfa ve A1 başvuruları içindir; adlandırılmış aralıklar gerçek Excel’de uygulanır.","version":"Tüm sürümler","refs":["ms-formula","ms-tips"]},{"id":"m04l01","module":4,"n":1,"title":"TOPLA ile güvenilir toplam","body":"TOPLA, bir aralıktaki sayısal değerleri toplar. Uzun bir artı zinciri yazmak yerine aralık kullanmak daha okunurdur. TOPLA’nın içine toplamın yazıldığı hücreyi dahil etme; bu döngüsel başvuru oluşturur. Başlıkları ve önceki ara toplamları yanlışlıkla kapsamadığını kontrol et.","steps":["B2:B5’e 10, 20, 30 ve 40 gir.","B6’ya =TOPLA(B2:B5) yaz.","B3’ü 25 yap; toplamın 105 olduğunu doğrula."],"example":"=TOPLA(B2:B5)","pitfall":"Bir listede hem ayrıntı satırlarını hem ara toplamları toplamak çift saymaya yol açar.","question":"Toplam B6’da ise hangi aralık doğrudur?","options":["B2:B6","B6:B6","B2:B5","B1:B100"],"answer":2,"explanation":"Sonuç hücresi toplam aralığına dahil edilmemelidir.","drill":{"prompt":"B2:B5 aralığındaki adetleri topla.","seed":{"B2":10,"B3":20,"B4":30,"B5":40},"solution":"=TOPLA(B2:B5)","cases":[{"cells":{"B2":10,"B3":20,"B4":30,"B5":40},"expected":100},{"cells":{"B2":10,"B3":25,"B4":30,"B5":40},"expected":105}],"target":"B6"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-sum","ms-circular"]},{"id":"m04l02","module":4,"n":2,"title":"ORTALAMA: boş ile sıfır farklıdır","body":"ORTALAMA, başvurulan aralıktaki sayısal değerlerin toplamını sayısal değer sayısına böler. Boş bir hücre ile sıfır aynı anlama gelmez: sıfır ortalamaya dahil olur, boş hücre dahil olmaz. Eksik veriyi sıfırla doldurmak bu yüzden raporu değiştirebilir.","steps":["B2:B4’e 10, 20 ve 30 gir.","B5’e =ORTALAMA(B2:B4) yaz.","B4’ü önce sil, sonra 0 yap; iki ortalamayı karşılaştır."],"example":"=ORTALAMA(B2:B4)\n10,20,boş → 15\n10,20,0 → 10","pitfall":"Eksik değer gerçekten ölçülmemiş mi, yoksa gerçek sıfır mı? İş anlamını belirlemeden veri doldurma.","question":"10, 20 ve boş hücrenin ortalaması nedir?","options":["10","15","20","30"],"answer":1,"explanation":"Boş hücre sayısal gözlem değildir; (10+20)/2 = 15.","drill":{"prompt":"B2:B4 için aritmetik ortalamayı hesapla.","seed":{"B2":10,"B3":20,"B4":30},"solution":"=ORTALAMA(B2:B4)","cases":[{"cells":{"B2":10,"B3":20,"B4":30},"expected":20},{"cells":{"B2":10,"B3":20,"B4":0},"expected":10}],"target":"B5"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-sum"]},{"id":"m04l03","module":4,"n":3,"title":"En küçük ve en büyük değeri bul","body":"MİN ve MAK, sayısal aralıktaki uç değerleri verir. Bunlar sıralamadan en düşük veya en yüksek tutarı bulmak için uygundur. Ancak uç değer, o değere ait ürün adını kendiliğinden döndürmez. İlgili kaydı bulmak için arama veya filtreleme kullanılır.","steps":["B2:B5’e 18, 42, 9 ve 31 gir.","D2’de =MİN(B2:B5), D3’te =MAK(B2:B5) hesapla.","En büyük tutarın hangi ürüne ait olduğunu ayrıca kayıttan kontrol et."],"example":"=MİN(B2:B5) → 9\n=MAK(B2:B5) → 42","pitfall":"En büyük tutarı bilmek, o satırın bütün bilgilerini bilmek değildir. Eşit en büyük değerler de olabilir.","question":"En büyük sayıyı veren işlev hangisidir?","options":["ORTALAMA","MİN","UZUNLUK","MAK"],"answer":3,"explanation":"MAK sayısal aralıktaki en büyük değeri döndürür.","drill":{"prompt":"B2:B5 içindeki en büyük değeri bul.","seed":{"B2":18,"B3":42,"B4":9,"B5":31},"solution":"=MAK(B2:B5)","cases":[{"cells":{"B2":18,"B3":42,"B4":9,"B5":31},"expected":42},{"cells":{"B2":18,"B3":42,"B4":60,"B5":31},"expected":60}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-sum"]},{"id":"m04l04","module":4,"n":4,"title":"Sayıları ve dolu hücreleri say","body":"BAĞ_DEĞ_SAY yalnızca sayısal hücreleri sayar. BAĞ_DEĞ_DOLU_SAY ise metin dahil boş olmayan hücreleri sayar. Bir formülün döndürdüğü boş metin, gerçekten boş hücreyle aynı davranmayabilir. Saymak istediğin şeyin kayıt mı, sayı mı olduğunu önce belirle.","steps":["A2’ye Kalem, A3’e 12, A4’e 0 gir; A5’i boş bırak.","B2’de =BAĞ_DEĞ_SAY(A2:A5) hesapla.","B3’te =BAĞ_DEĞ_DOLU_SAY(A2:A5) hesapla ve farkı açıkla."],"example":"BAĞ_DEĞ_SAY → 2\nBAĞ_DEĞ_DOLU_SAY → 3","pitfall":"0 bir sayıdır ve sayılır. Görünüşte boş olan formül sonuçları ayrıca incelenmelidir.","question":"Kalem, 12, 0 ve boş hücrede kaç sayısal değer vardır?","options":["1","2","3","4"],"answer":1,"explanation":"12 ve 0 sayısaldır; metin ve boş hücre sayısal sayıma girmez.","drill":{"prompt":"A2:A5 içindeki sayısal hücrelerin adedini bul.","seed":{"A2":"Kalem","A3":12,"A4":0,"A5":""},"solution":"=BAĞ_DEĞ_SAY(A2:A5)","cases":[{"cells":{"A2":"Kalem","A3":12,"A4":0,"A5":""},"expected":2},{"cells":{"A2":7,"A3":12,"A4":0,"A5":""},"expected":3}],"target":"B2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-sum"]},{"id":"m04l05","module":4,"n":5,"title":"YUVARLA ve tutarlı hassasiyet","body":"YUVARLA bir sayıyı belirtilen ondalık basamak sayısına yuvarlar. Hangi aşamada yuvarladığın, özellikle çok sayıda satırın toplamında fark yaratabilir. Satır tutarını mı, yalnızca nihai toplamı mı yuvarlayacağın iş kuralına bağlıdır. Kuralı dosyada açıkça yaz.","steps":["A1’e 12,345 gir.","B1’e =YUVARLA(A1;2) yaz.","A1’i 18,126 yap; B1’in 18,13 olduğunu doğrula."],"example":"=YUVARLA(A1;2)","pitfall":"Sayı biçimiyle basamak gizlemek yerine hesaplanan değeri değiştirmek istiyorsan YUVARLA kullan.","question":"YUVARLA(A1;2) ifadesindeki 2 neyi belirtir?","options":["Çarpanı","Hücre sayısını","Ondalık basamak sayısını","Satır numarasını"],"answer":2,"explanation":"İkinci bağımsız değişken yuvarlanacak basamak sayısıdır.","drill":{"prompt":"A1 değerini iki ondalık basamağa yuvarla.","seed":{"A1":12.345},"solution":"=YUVARLA(A1;2)","cases":[{"cells":{"A1":12.345},"expected":12.35},{"cells":{"A1":18.126},"expected":18.13}],"target":"B1"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-sum"]},{"id":"m04l06","module":4,"n":6,"title":"TOPLA.ÇARPIM ile ağırlıklı hesaplama","body":"TOPLA.ÇARPIM, karşılıklı konumdaki değerleri çarpar ve bu çarpımları toplar. Adet ile birim fiyat sütunlarından toplam tutarı tek formülde hesaplayabilirsin. Ağırlıklı ortalamada çarpımlar toplamı, ağırlıkların toplamına bölünür. Dizilerin boyutlarının eşit olması gerekir.","steps":["B2:B4’e 2, 3, 4; C2:C4’e 10, 20, 30 gir.","D2’de =TOPLA.ÇARPIM(B2:B4;C2:C4) hesapla.","Ayrı satır çarpımları oluşturup bunların toplamıyla sonucu karşılaştır."],"example":"=TOPLA.ÇARPIM(B2:B4;C2:C4)\n2×10 + 3×20 + 4×30 = 200","pitfall":"Fiyatların basit ortalaması ile adet ağırlıklı ortalaması farklı sorulara cevap verir.","question":"Ağırlıklı ortalamanın paydası nedir?","options":["En yüksek fiyat","Satırların toplam tutarı","Ağırlıkların toplamı","Her zaman 100"],"answer":2,"explanation":"Ağırlıklı çarpımların toplamı ağırlıkların toplamına bölünür.","drill":{"prompt":"Adet ve fiyat sütunlarının çarpımlar toplamını hesapla.","seed":{"B2":2,"B3":3,"B4":4,"C2":10,"C3":20,"C4":30},"solution":"=TOPLA.ÇARPIM(B2:B4;C2:C4)","cases":[{"cells":{"B2":2,"B3":3,"B4":4,"C2":10,"C3":20,"C4":30},"expected":200},{"cells":{"B2":5,"B3":3,"B4":4,"C2":10,"C3":20,"C4":30},"expected":230}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-sum"]},{"id":"m05l01","module":5,"n":1,"title":"EĞER ile iki sonuç arasında karar ver","body":"EĞER bir koşulu sınar, doğruysa bir sonuç, yanlışsa başka bir sonuç üretir. Bir notu Geçti veya Tekrar olarak etiketlemek basit bir örnektir. Önce sınır değerini belirle: 60 dahil mi? Sonra bu koşulu açık bir karşılaştırmayla yaz. Metin sonuçları çift tırnak içine alınır.","steps":["B2’ye 72 gir.","C2’ye =EĞER(B2\u003e=60;\"Geçti\";\"Tekrar\") yaz.","B2’yi sırayla 59, 60 ve 61 yap; sınır davranışını denetle."],"example":"=EĞER(B2\u003e=60;\"Geçti\";\"Tekrar\")","pitfall":"\u003e60 ile \u003e=60 aynı değildir. Tam sınırdaki değeri mutlaka test et.","question":"60 ve üstü için doğru koşul hangisidir?","options":["B2\u003e60","B2\u003c60","B2\u003e=60","B2=59"],"answer":2,"explanation":"\u003e= operatörü eşitliği de kapsar.","drill":{"prompt":"60 ve üzerini Geçti, diğerlerini Tekrar olarak sınıflandır.","seed":{"B2":72},"solution":"=EĞER(B2\u003e=60;\"Geçti\";\"Tekrar\")","cases":[{"cells":{"B2":72},"expected":"Geçti"},{"cells":{"B2":59},"expected":"Tekrar"}],"target":"C2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-conditional"]},{"id":"m05l02","module":5,"n":2,"title":"VE ve YADA ile koşulları birleştir","body":"VE bütün koşullar doğru olduğunda, YADA en az bir koşul doğru olduğunda DOĞRU döndürür. Örneğin puan ve katılım eşiğinin ikisini birden arıyorsan VE kullanırsın. Alternatif kabul yolları varsa YADA uygundur. Koşulları ayrı ayrı test etmek, birleşik formülü daha kolay anlamanı sağlar.","steps":["B2’ye 75, C2’ye 90% gir.","D2’ye =VE(B2\u003e=60;C2\u003e=80%) yaz.","Önce puanı, sonra katılımı eşik altına indir; sonuçları karşılaştır."],"example":"=EĞER(VE(B2\u003e=60;C2\u003e=80%);\"Uygun\";\"Eksik\")","pitfall":"VE ile YADA’yı karıştırmak, gereğinden fazla veya az kaydı uygun sayabilir.","question":"İki şartın da sağlanmasını hangi işlev ister?","options":["YADA","VE","TOPLA","DEĞİL"],"answer":1,"explanation":"VE ancak bütün koşullar doğruysa DOĞRU üretir.","drill":{"prompt":"Puan en az 60 ve katılım en az %80 ise Uygun, değilse Eksik yazdır.","seed":{"B2":75,"C2":0.9},"solution":"=EĞER(VE(B2\u003e=60;C2\u003e=80%);\"Uygun\";\"Eksik\")","cases":[{"cells":{"B2":75,"C2":0.9},"expected":"Uygun"},{"cells":{"B2":75,"C2":0.7},"expected":"Eksik"}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-conditional"]},{"id":"m05l03","module":5,"n":3,"title":"EĞERSAY ve ÇOKEĞERSAY","body":"EĞERSAY tek ölçüte uyan hücreleri, ÇOKEĞERSAY ise birden fazla ölçütü aynı anda karşılayan kayıtları sayar. Ölçütler metin veya karşılaştırma olabilir. Birden çok ölçüt aralığı aynı satırları temsil etmeli ve eşit boyutta olmalıdır. Sayımın iş anlamını önce bir cümleyle tarif et.","steps":["A2:A5’e Doğu, Batı, Doğu, Batı gir.","B2:B5’e 80, 120, 150 ve 60 gir.","=ÇOKEĞERSAY(A2:A5;\"Doğu\";B2:B5;\"\u003e=100\") ile iki şartı birlikte say."],"example":"=EĞERSAY(A2:A5;\"Doğu\")\n=ÇOKEĞERSAY(A2:A5;\"Doğu\";B2:B5;\"\u003e=100\")","pitfall":"Bir ölçüt aralığını bir satır aşağı kaydırmak, farklı kayıtların şartlarını eşleştirir.","question":"ÇOKEĞERSAY’daki ölçütler nasıl değerlendirilir?","options":["Hepsi aynı kayıtta sağlanmalı","Yalnızca ilki geçerlidir","Sadece sayılar sayılır","Aralıklardan biri rastgele seçilir"],"answer":0,"explanation":"ÇOKEĞERSAY aynı konumdaki kayıtlar için bütün koşulların sağlanmasını ister.","drill":{"prompt":"Doğu bölgesinde tutarı en az 100 olan kayıtları say.","seed":{"A2":"Doğu","A3":"Batı","A4":"Doğu","A5":"Batı","B2":80,"B3":120,"B4":150,"B5":60},"solution":"=ÇOKEĞERSAY(A2:A5;\"Doğu\";B2:B5;\"\u003e=100\")","cases":[{"cells":{"A2":"Doğu","A3":"Batı","A4":"Doğu","A5":"Batı","B2":80,"B3":120,"B4":150,"B5":60},"expected":1},{"cells":{"A2":"Doğu","A3":"Batı","A4":"Doğu","A5":"Batı","B2":110,"B3":120,"B4":150,"B5":60},"expected":2}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-conditional"]},{"id":"m05l04","module":5,"n":4,"title":"ETOPLA ile bir koşula göre toplam","body":"ETOPLA ölçüt aralığına bakar ve eşleşen satırların toplam aralığındaki sayılarını toplar. Örneğin yalnızca Doğu bölgesinin satışlarını hesaplayabilirsin. İlk aralık kontrol edilen etiketleri, son aralık toplanan tutarları içerir. Aralıkların aynı satırlardan başlamasını ve bitmesini denetle.","steps":["A2:A4’e Doğu, Batı ve Doğu yaz.","B2:B4’e 100, 200 ve 150 gir.","D2’ye =ETOPLA(A2:A4;\"Doğu\";B2:B4) yaz ve iki Doğu kaydını elle doğrula."],"example":"=ETOPLA(A2:A4;\"Doğu\";B2:B4)","pitfall":"Ölçüt aralığı ile toplam aralığını ters yazmak yanlış sonuç üretir.","question":"ETOPLA’da isteğe bağlı üçüncü bağımsız değişken nedir?","options":["Sıralama yönü","Aranacak sütun numarası","Toplanacak aralık","Yuvarlama basamağı"],"answer":2,"explanation":"Üçüncü bağımsız değişken eşleşen satırlardaki hangi değerlerin toplanacağını belirtir.","drill":{"prompt":"Yalnızca Doğu bölgesindeki tutarları topla.","seed":{"A2":"Doğu","A3":"Batı","A4":"Doğu","B2":100,"B3":200,"B4":150},"solution":"=ETOPLA(A2:A4;\"Doğu\";B2:B4)","cases":[{"cells":{"A2":"Doğu","A3":"Batı","A4":"Doğu","B2":100,"B3":200,"B4":150},"expected":250},{"cells":{"A2":"Doğu","A3":"Batı","A4":"Doğu","B2":100,"B3":200,"B4":220},"expected":320}],"target":"D2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-conditional"]},{"id":"m05l05","module":5,"n":5,"title":"ÇOKETOPLA ile birden çok koşul","body":"ÇOKETOPLA’nın ilk bağımsız değişkeni toplam aralığıdır. Sonrasında ölçüt aralığı ve ölçüt çiftleri gelir. Bu sıra ETOPLA’dan farklıdır. Bölge ile ürünü birlikte süzerek toplam bulmak, günlük yönetim raporlarında sık kullanılan bir yaklaşımdır.","steps":["A2:C5 alanında Bölge, Urun ve Tutar verilerini hazırla.","Önce toplanacak C2:C5 aralığını, ardından bölge ve ürün şartlarını yaz.","Sonucu ilgili satırları filtreleyip ayrı ayrı toplayarak kontrol et."],"example":"=ÇOKETOPLA(C2:C5;A2:A5;\"Doğu\";B2:B5;\"Kalem\")","pitfall":"ETOPLA’da öğrendiğin bağımsız değişken sırasını ÇOKETOPLA’ya aynen taşıma.","question":"ÇOKETOPLA’nın ilk bağımsız değişkeni hangisidir?","options":["Toplam aralığı","İlk ölçüt","Sayfa adı","Sonuç biçimi"],"answer":0,"explanation":"ÇOKETOPLA toplam aralığıyla başlar, ardından ölçüt çiftleri gelir.","drill":{"prompt":"Doğu bölgesindeki Kalem satış tutarlarını topla.","seed":{"A2":"Doğu","A3":"Batı","A4":"Doğu","A5":"Doğu","B2":"Kalem","B3":"Kalem","B4":"Defter","B5":"Kalem","C2":100,"C3":200,"C4":150,"C5":50},"solution":"=ÇOKETOPLA(C2:C5;A2:A5;\"Doğu\";B2:B5;\"Kalem\")","cases":[{"cells":{"A2":"Doğu","A3":"Batı","A4":"Doğu","A5":"Doğu","B2":"Kalem","B3":"Kalem","B4":"Defter","B5":"Kalem","C2":100,"C3":200,"C4":150,"C5":50},"expected":150},{"cells":{"A2":"Doğu","A3":"Batı","A4":"Doğu","A5":"Doğu","B2":"Kalem","B3":"Kalem","B4":"Defter","B5":"Kalem","C2":100,"C3":200,"C4":150,"C5":80},"expected":180}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-conditional"]},{"id":"m05l06","module":5,"n":6,"title":"EĞERHATA: hatayı gizleme, yönet","body":"EĞERHATA bir ifade hata verdiğinde belirlediğin alternatifi döndürür. Ancak her hatayı sıfıra çevirmek veri sorunlarını saklayabilir. Önce hatanın nedenini bul, sonra kullanıcıya anlamlı bir sonuç sun. Bölmede payda sıfırsa hesaplanamama durumunu açıkça göstermek çoğu zaman daha doğrudur.","steps":["B2’ye 100, C2’ye 0 gir.","D2’de =B2/C2 ile hata durumunu gözle.","=EĞERHATA(B2/C2;\"Kontrol et\") kullan; sonra C2’yi 4 yap ve normal sonucu kontrol et."],"example":"=EĞERHATA(B2/C2;\"Kontrol et\")","pitfall":"Hata = 0 varsayımı toplam ve ortalamaları çarpıtabilir. Hata sayısını ayrıca izle.","question":"EĞERHATA eklemeden önce ne yapılmalıdır?","options":["Hatanın nedeni anlaşılmalı","Tüm satırlar silinmeli","Dosya CSV olmalı","Bütün sayılar metne çevrilmeli"],"answer":0,"explanation":"Hata yönetimi neden araştırmasının yerine geçmez.","drill":{"prompt":"B2/C2 oranını hesapla; hata varsa Kontrol et metnini döndür.","seed":{"B2":100,"C2":0},"solution":"=EĞERHATA(B2/C2;\"Kontrol et\")","cases":[{"cells":{"B2":100,"C2":0},"expected":"Kontrol et"},{"cells":{"B2":100,"C2":4},"expected":25}],"target":"D2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","ms-conditional"]},{"id":"m06l01","module":6,"n":1,"title":"Boşlukları ve görünmez karakterleri temizle","body":"KIRP normal baştaki, sondaki ve yinelenen iç boşlukları düzenler. TEMİZ belirli yazdırılamayan karakterleri kaldırır. Web kaynaklarından gelen bölünemez boşluk gibi karakterler bu işlemlerden sonra kalabilir; gerektiğinde YERİNEKOY ile açıkça değiştirilir. Temizleme öncesi ham sütunu korumak denetim izi sağlar.","steps":["A2’ye başında, sonunda ve arada fazla boşluk bulunan bir ad gir.","B2’ye =KIRP(A2) yaz.","Ham ve temiz değerlerin uzunluğunu karşılaştır; gerekiyorsa görünmez karakter kaynağını araştır."],"example":"=KIRP(A2)\n=TEMİZ(A2)\n=KIRP(YERİNEKOY(A2;DAMGA(160);\" \"))","pitfall":"KIRP her Unicode boşluk karakterini temizlemez. Metin aynı görünse bile farklı karakter içerebilir.","question":"KIRP hangi iş için uygundur?","options":["Fazla normal boşlukları düzenlemek","Tüm harfleri silmek","Tarih oluşturmak","Sütunları taşımak"],"answer":0,"explanation":"KIRP metni gereksiz normal boşluklardan arındırır.","drill":{"prompt":"A2’deki adı gereksiz normal boşluklardan temizle.","seed":{"A2":"  Ada   Kaya  "},"solution":"=KIRP(A2)","cases":[{"cells":{"A2":"  Ada   Kaya  "},"expected":"Ada Kaya"},{"cells":{"A2":"  Ece   Acar "},"expected":"Ece Acar"}],"target":"B2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","video-tr"]},{"id":"m06l02","module":6,"n":2,"title":"SOLDAN ve SAĞDAN ile parça al","body":"SOLDAN metnin başından, SAĞDAN sonundan belirli sayıda karakter alır. Ürün kodunun sabit uzunluklu bölümünü ayırmak için uygundur. Kod uzunlukları değişiyorsa sabit karakter sayısı yanlış sonuç verebilir; ayraç veya metin bölme yaklaşımı düşün.","steps":["A2’ye TR-1042 yaz.","B2’ye =SOLDAN(A2;2), C2’ye =SAĞDAN(A2;4) yaz.","A2’yi DE-2085 yap; iki parçanın da beklediğin gibi değiştiğini denetle."],"example":"=SOLDAN(A2;2) → TR\n=SAĞDAN(A2;4) → 1042","pitfall":"Sayısal görünen bir kod parçası hâlâ metin olabilir. Başta sıfır varsa bunu korumak isteyebilirsin.","question":"TR-1042 metninin ilk iki karakterini hangi formül verir?","options":["=SAĞDAN(A2;2)","=SOLDAN(A2;2)","=UZUNLUK(A2)","=TOPLA(A2)"],"answer":1,"explanation":"SOLDAN ilk belirtilen sayıda karakteri alır.","drill":{"prompt":"A2 kodunun ilk iki karakterini al.","seed":{"A2":"TR-1042"},"solution":"=SOLDAN(A2;2)","cases":[{"cells":{"A2":"TR-1042"},"expected":"TR"},{"cells":{"A2":"DE-2085"},"expected":"DE"}],"target":"B2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","video-tr"]},{"id":"m06l03","module":6,"n":3,"title":"PARÇAAL ve UZUNLUK","body":"PARÇAAL metnin belirli bir konumundan başlayıp belirli sayıda karakter alır. İlk karakterin konumu 1’dir. UZUNLUK boşluklar dahil karakter sayısını verir. Bu işlevleri birlikte kullanarak kayıtların beklenen uzunlukta olup olmadığını denetleyebilirsin.","steps":["A2’ye TR-1042 yaz.","B2’ye =PARÇAAL(A2;4;4) yaz.","C2’de =UZUNLUK(A2) hesapla; başa boşluk ekleyince uzunluğun değiştiğini gözle."],"example":"=PARÇAAL(A2;4;4) → 1042\n=UZUNLUK(A2) → 7","pitfall":"Karakter konumları 0’dan değil 1’den başlar. Ayraçlar ve boşluklar da sayılır.","question":"PARÇAAL(A2;4;4) hangi konumdan başlar?","options":["İlk","Üçüncü","Dördüncü","Sonuncu"],"answer":2,"explanation":"İkinci bağımsız değişken başlangıç konumudur.","drill":{"prompt":"TR-1042 biçimindeki kodun 4. karakterinden başlayarak 4 karakter al.","seed":{"A2":"TR-1042"},"solution":"=PARÇAAL(A2;4;4)","cases":[{"cells":{"A2":"TR-1042"},"expected":"1042"},{"cells":{"A2":"DE-2085"},"expected":"2085"}],"target":"B2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-functions","video-tr"]},{"id":"m06l04","module":6,"n":4,"title":"Metinleri birleştir","body":"\u0026 işareti metinleri yan yana bağlar. Ad ile soyad arasına boşluk eklemek için boşluğu da açıkça belirtmelisin. METİNBİRLEŞTİR, bir ayraç ve boş hücreleri yok sayma seçeneği sunar. Tarih veya sayıları metne eklerken görünümünün değişebileceğini unutma.","steps":["A2’ye Ada, B2’ye Kaya yaz.","C2’ye =A2\u0026\" \"\u0026B2 yaz.","Yeni sürümde METİNBİRLEŞTİR ile boş ara hücreleri atlayan bir deneme yap."],"example":"=A2\u0026\" \"\u0026B2\n=METİNBİRLEŞTİR(\" - \";DOĞRU;A2:C2)","pitfall":"Boşluk veya ayraç kendiliğinden eklenmez. Sonuç hücresini birleştirdiğin aralığa dahil etme.","question":"Metin birleştirme işleci hangisidir?","options":["\u0026","*","^","/"],"answer":0,"explanation":"\u0026 metinleri ardışık olarak birleştirir.","drill":{"prompt":"Ad ve soyadı aralarında tek boşlukla birleştir.","seed":{"A2":"Ada","B2":"Kaya"},"solution":"=A2\u0026\" \"\u0026B2","cases":[{"cells":{"A2":"Ada","B2":"Kaya"},"expected":"Ada Kaya"},{"cells":{"A2":"Ece","B2":"Acar"},"expected":"Ece Acar"}],"target":"D2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"\u0026: tüm sürümler; METİNBİRLEŞTİR: 2019+","refs":["ms-functions","video-tr"]},{"id":"m06l05","module":6,"n":5,"title":"TARİH, YIL, AY ve GÜN","body":"TARİH yıl, ay ve gün sayılarını gerçek tarih değerine dönüştürür. YIL, estion":"İş günü hesabında hangi ek veri gerekebilir?","options":["Yazı tipi","Tatil listesi","Grafik rengi","Dosyanın boyutu"],"answer":1,"explanation":"Resmî veya kurumsal tatillerin ayrıca belirtilmesi gerekir.","drill":null,"minutes":9,"real":"Gerçek Excel’de bir teslim tarihi örneği kur. Hafta sonu ve iki örnek tatili iş günü hesabından çıkar. Kullanacağın tatil listesini kendin doğrula; uygulamadaki tarihler eğitim örneğidir.","version":"Tüm sürümler","refs":["ms-functions","video-tr"]},{"id":"m07l01","module":7,"n":1,"title":"DÜŞEYARA ile tam eşleşme","body":"DÜŞEYARA seçtiğin tablonun ilk sütununda arar ve aynı satırdaki belirttiğin sütundan değer getirir. Sütun numarası sayfadaki harfe göre değil, seçtiğin tabloya göre sayılır. Kod veya kimlik eşleştirmesinde son bağımsız değişkeni YANLIŞ yaparak tam eşleşme iste.","steps":["A2:B4’e ürün kodları ve fiyatları gir; D2’ye aranacak kodu yaz.","E2’ye =DÜŞEYARA(D2;A2:B4;2;YANLIŞ) yaz.","D2’deki kodu değiştir; karşılık gelen fiyatı kaynak tabloyla doğrula."],"example":"=DÜŞEYARA(D2;A2:B4;2;YANLIŞ)","pitfall":"Son bağımsız değişkeni atlamak yaklaşık eşleşmeye yol açabilir. Kod listelerinde bu sessizce yanlış sonuç verebilir.","question":"DÜŞEYARA aramayı seçili tablonun hangi sütununda yapar?","options":["Son sütununda","İlk sütununda","Her sütununda aynı anda","Yalnızca C sütununda"],"answer":1,"explanation":"DÜŞEYARA’nın arama sütunu seçili tablo aralığının ilk sütunudur.","drill":{"prompt":"D2 kodunun fiyatını tam eşleşmeyle getir.","seed":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K02"},"solution":"=DÜŞEYARA(D2;A2:B4;2;YANLIŞ)","cases":[{"cells":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K02"},"expected":40},{"cells":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K03"},"expected":60}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-lookup","ms-functions"]},{"id":"m07l02","module":7,"n":2,"title":"ÇAPRAZARA ile esnek eşleştirme","body":"ÇAPRAZARA arama ve sonuç aralıklarını ayrı ayrı alır. Dönüş sütunu arama sütununun solunda da olabilir. Varsayılan olarak tam eşleşme arar; bulunamayan kayıt için açık bir alternatif tanımlayabilirsin. Excel 2016 ve 2019’da yoktur; bu sürümlerde İNDİS ve KAÇINCI iyi bir alternatiftir.","steps":["A2:B4’e kod ve fiyat listesi hazırla; D2’ye bir kod yaz.","E2’ye =ÇAPRAZARA(D2;A2:A4;B2:B4;\"Bulunamadı\") yaz.","D2’ye listede olmayan bir kod gir; alternatif metni gözle."],"example":"=ÇAPRAZARA(D2;A2:A4;B2:B4;\"Bulunamadı\")","pitfall":"Yeni işlevi kullanmadan önce dosyayı açacak kişilerin sürümünü kontrol et.","question":"ÇAPRAZARA’nın varsayılan eşleştirme türü nedir?","options":["Yaklaşık","Rastgele","Tam eşleşme","Büyükten küçüğe sıralama"],"answer":2,"explanation":"Eşleştirme modu belirtilmezse tam eşleşme kullanılır.","drill":{"prompt":"D2 kodunun fiyatını getir; kod yoksa Bulunamadı yazdır.","seed":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K02"},"solution":"=ÇAPRAZARA(D2;A2:A4;B2:B4;\"Bulunamadı\")","cases":[{"cells":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K02"},"expected":40},{"cells":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K99"},"expected":"Bulunamadı"}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Microsoft 365 / Excel 2021 / 2024","refs":["ms-lookup","ms-functions"]},{"id":"m07l03","module":7,"n":3,"title":"İNDİS ve KAÇINCI birlikte","body":"KAÇINCI, aranan değerin aralıktaki göreli konumunu verir. İNDİS ise belirtilen konumdaki değeri getirir. Birlikte kullanıldıklarında esnek bir arama formülü oluşur. KAÇINCI’nın son bağımsız değişkenindeki 0 tam eşleşmeyi belirtir. Konum ile gerçek satır numarasını karıştırma.","steps":["A2:A4’e kod, B2:B4’e fiyat gir.","Önce =KAÇINCI(D2;A2:A4;0) ile aralıktaki konumu bul.","Bu sonucu =İNDİS(B2:B4;KAÇINCI(D2;A2:A4;0)) içinde kullan."],"example":"=İNDİS(B2:B4;KAÇINCI(D2;A2:A4;0))","pitfall":"A2:A4 aralığının ilk öğesinin konumu 1’dir; sayfa satır numarası 2 olsa da konum değişmez.","question":"KAÇINCI ne döndürür?","options":["Hücrenin rengini","Aralıktaki göreli konumu","Her zaman fiyatı","Sütunun genişliğini"],"answer":1,"explanation":"KAÇINCI sonuç değerini değil, eşleşen öğenin konumunu döndürür.","drill":{"prompt":"D2 kodunun fiyatını İNDİS ve KAÇINCI ile getir.","seed":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K02"},"solution":"=İNDİS(B2:B4;KAÇINCI(D2;A2:A4;0))","cases":[{"cells":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K02"},"expected":40},{"cells":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K01"},"expected":25}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-lookup","ms-functions"]},{"id":"m07l04","module":7,"n":4,"title":"Bulunamayan kayıtları yönet","body":"Bulunamayan kayıt, arama formülünün mutlaka bozuk olduğu anlamına gelmez. Kod gerçekten yok olabilir; metin-sayı farkı veya görünmez boşluk eşleşmeyi engelleyebilir. EĞERYOKSA yalnızca #YOK türündeki hatayı yönetir; EĞERHATA daha geniştir. Beklenmeyen hataları ayrı tutmak veri kalitesini görmeyi sağlar.","steps":["Önce aranan kodun kaynakta gerçekten bulunduğunu denetle.","Kodların veri türünü ve baştaki/sondaki boşluklarını karşılaştır.","Beklenen bulunamama durumu için EĞERYOKSA ile açıklayıcı sonuç üret."],"example":"=EĞERYOKSA(DÜŞEYARA(D2;A2:B4;2;YANLIŞ);\"Kod yok\")","pitfall":"Tüm hataları boş metne çevirmek, raporda kayıp kayıtları görünmez yapar.","question":"Yalnızca #YOK hatasını yönetmek için hangisi daha seçicidir?","options":["EĞERYOKSA","TOPLA","MİN","YUVARLA"],"answer":0,"explanation":"EĞERYOKSA yalnızca bulunamama türündeki #YOK hatasını yakalar.","drill":{"prompt":"D2 kodunu tam eşleşmeyle ara; yalnızca bulunamama durumunda Kod yok yaz.","seed":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K99"},"solution":"=EĞERYOKSA(DÜŞEYARA(D2;A2:B4;2;YANLIŞ);\"Kod yok\")","cases":[{"cells":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K99"},"expected":"Kod yok"},{"cells":{"A2":"K01","A3":"K02","A4":"K03","B2":25,"B3":40,"B4":60,"D2":"K03"},"expected":60}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Excel 2013+","refs":["ms-lookup","ms-functions"]},{"id":"m07l05","module":7,"n":5,"title":"İki yönlü arama","body":"Bir fiyat matrisinde hem ürünün satırını hem dönemin sütununu bulman gerekebilir. İNDİS’e satır ve sütun konumlarını ayrı KAÇINCI işlevleriyle vermek bu sorunu çözer. Veri alanı ile başlık aralıkları doğru hizalanmalıdır. Başlıkları veri aralığına dahil etmek konumları kaydırabilir.","steps":["A2:A4’e ürünler, B1:D1’e aylar, B2:D4’e tutarlar gir.","G2’de ürünü, G3’te ayı seç.","=İNDİS(B2:D4;KAÇINCI(G2;A2:A4;0);KAÇINCI(G3;B1:D1;0)) hesapla."],"example":"=İNDİS(B2:D4;KAÇINCI(G2;A2:A4;0);KAÇINCI(G3;B1:D1;0))","pitfall":"KAÇINCI sonuçları seçtiğin İNDİS veri alanına göre konum olmalıdır.","question":"İki yönlü aramada iki KAÇINCI neyi bulur?","options":["Renk ve biçimi","Toplam ve ortalamayı","Satır ve sütun konumunu","Dosya ve klasörü"],"answer":2,"explanation":"Biri ürünün satırını, diğeri dönemin sütununu bulur.","drill":null,"minutes":9,"real":"Gerçek Excel’de 3 ürün × 3 ay matrisi oluştur. Seçilen ürün ve ayın kesişimini formülle getir; iki farklı çiftle kontrol et.","version":"Tüm sürümler","refs":["ms-lookup","ms-functions"]},{"id":"m07l06","module":7,"n":6,"title":"Benzersiz anahtar ve eşleşme denetimi","body":"Bir kimlik birden çok kez geçiyorsa ilk eşleşmeyi getiren arama formülü eksik bir cevap verebilir. Ürün listesinde kodun benzersiz olması, satış listesinde aynı ürün kodunun tekrar etmesi normaldir. Hangi tablonun hangi ayrıntı düzeyinde olduğunu belirlemek güvenilir eşleştirmenin temelidir.","steps":["Ürün ana tablosunda kodları EĞERSAY ile say.","Sayısı 1’den büyük olan kodları incele; gerçek mükerrer ile farklı kayıt ayrımını yap.","Eşleştirme sonrasında bulunamayan kodları ve beklenmeyen satır artışını raporla."],"example":"=EĞERSAY(A2:A5;A2)","pitfall":"Yinelenen kayıtları otomatik silmeden önce bir satırın neyi temsil ettiğini belirle.","question":"Ürün ana tablosunda benzersiz olması beklenen alan hangisidir?","options":["Fiyat","Ürün kodu","Renk","Satış adedi"],"answer":1,"explanation":"Kimlik görevi gören ürün kodu her ürünü tekil tanımlamalıdır.","drill":{"prompt":"A2 kodunun A2:A5 içinde kaç kez geçtiğini bul.","seed":{"A2":"K01","A3":"K02","A4":"K01","A5":"K03"},"solution":"=EĞERSAY(A2:A5;A2)","cases":[{"cells":{"A2":"K01","A3":"K02","A4":"K01","A5":"K03"},"expected":2},{"cells":{"A2":"K01","A3":"K02","A4":"K04","A5":"K03"},"expected":1}],"target":"E2"},"minutes":12,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-lookup","ms-functions"]},{"id":"m08l01","module":8,"n":1,"title":"Satır bütünlüğünü koruyarak sırala","body":"Sıralama kayıtların yerini değiştirir, ancak bir kayda ait sütunlar birlikte hareket etmelidir. Yalnızca isim sütununu sıralayıp tutarları sabit bırakırsan veri ilişkisini bozarsın. Sıralama öncesi başlık, boş satırlar ve veri türlerini kontrol etmek gerekir.","steps":["Başlıklı ve kesintisiz bir veri listesinin içinde bir hücre seç.","Veri \u003e Sırala yolunda önce Bölge, sonra Tutar alanını belirle.","Sıralama sonrası birkaç ürün-tutar çiftini kaynak kayıtla karşılaştır."],"example":"Birinci anahtar: Bölge, A→Z\nİkinci anahtar: Tutar, büyük→küçük","pitfall":"Tek sütunu bağımsız sıralamak bütün kaydı değil yalnızca o sütunu taşır.","question":"Güvenli sıralamada birlikte hareket etmesi gereken nedir?","options":["Aynı kaydın bütün sütunları","Sadece başlık","Sadece sayılar","Yalnızca seçili harf"],"answer":0,"explanation":"Satırdaki alanlar tek bir kaydı temsil eder ve birlikte sıralanmalıdır.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-sort","ms-validation","ms-format","ms-table"]},{"id":"m08l02","module":8,"n":2,"title":"Filtrele ve görünen veriyi özetle","body":"Filtre koşula uymayan satırları gizler; kaynak veriyi silmez. TOPLA filtreyle gizlenen değerleri de toplar. Görünen satırlar için ALTTOPLAM gibi uygun bir araç kullan. 109 toplama kodu, filtrelenmiş satırlara ek olarak elle gizlenen satırları da dışarıda bırakır.","steps":["Veri tablosunda filtreyi aç; yalnızca bir bölgeyi seç.","Tutar sütununda TOPLA sonucunu gözle.","=ALTTOPLAM(109;C2:C20) ile görünür satırların toplamını karşılaştır."],"example":"=ALTTOPLAM(109;C2:C20)","pitfall":"Filtre görünümünü toplam formülüyle karıştırma. Simülatör TOPLA için gizli satır kavramı uygulamaz; bu görev gerçek Excel’de yapılır.","question":"Filtre koşuluna uymayan satırlara ne olur?","options":["Kalıcı silinirler","Gizlenirler","Sıfıra dönüşürler","Başka kitaba taşınırlar"],"answer":1,"explanation":"Filtre veriyi silmeden görünümü daraltır.","drill":null,"minutes":9,"real":"Excel’de Satışlar veri kümesini filtrele. TOPLA ile ALTTOPLAM sonuçlarını karşılaştır ve neden farklı olabildiklerini not et.","version":"Tüm sürümler","refs":["ms-sort","ms-validation","ms-format","ms-table"]},{"id":"m08l03","module":8,"n":3,"title":"Excel tablosu ve yapılandırılmış başvurular","body":"Bir veri aralığını Excel tablosuna dönüştürmek filtreleri, hesaplanan sütunları ve büyüyen veriyle çalışmayı kolaylaştırır. Yapılandırılmış başvurular, B2:B100 yerine Satislar[Tutar] gibi okunur alan adları kullanır. Tabloya verilen ad ile sayfa adı farklıdır.","steps":["Veri listesinin içinde bir hücre seç; Ekle \u003e Tablo yolunu aç.","Tablom üst bilgi içeriyor seçeneğini denetle ve tabloya Satislar adını ver.","Yeni bir satır ekle; tablo aralığının ve hesaplanan sütunun genişlemesini gözle."],"example":"=TOPLA(Satislar[Tutar])\n=[@Adet]*[@BirimFiyat]","pitfall":"Renkli bir aralık her zaman gerçek Excel tablosu değildir. Tablo tasarımı sekmesini kontrol et.","question":"[@Adet] yapılandırılmış başvurusu neyi anlatır?","options":["Tüm çalışma kitaplarını","Tablonun bütün sütunlarını","Geçerli satırın Adet değerini","Bir makroyu"],"answer":2,"explanation":"@ geçerli tablo satırındaki değeri ifade eder.","drill":null,"minutes":9,"real":"Satışlar listesini Satislar adlı gerçek Excel tablosuna dönüştür. Hesaplanan tutar sütununu yapılandırılmış başvurularla oluştur. Bu sözdizimi mini formül motorunda çalışmaz.","version":"Tüm sürümler","refs":["ms-sort","ms-validation","ms-format","ms-table"]},{"id":"m08l04","module":8,"n":4,"title":"Veri doğrulamayla girişleri yönlendir","body":"Veri doğrulama, girilebilecek değerleri sınırlandırmak veya bir açılır listeden seçim sunmak için kullanılır. Kullanıcıya giriş açıklaması ve anlaşılır hata iletisi göstermek yanlışları azaltır. Doğrulama tek başına tüm hataları önlemez; bazı yapıştırma işlemleri kuralı atlayabilir. Sonradan veri denetimi de gerekir.","steps":["İzin verilen bölgeleri ayrı bir aralıkta yaz.","Giriş hücrelerini seç; Veri \u003e Veri Doğrulama \u003e Liste ile kaynak aralığını bağla.","Geçerli ve geçersiz değer deneyerek uyarı davranışını test et."],"example":"İzin verilen değerler: Doğu, Batı, Kuzey, Güney","pitfall":"Liste kaynağına gereksiz boş hücreleri katma. Yapıştırma sonrası veriyi ayrıca kontrol et.","question":"Açılır seçim listesi oluşturmak için hangi araç uygundur?","options":["Hedef Arama","Veri Doğrulama","Sayfa yönü","Doldurma rengi"],"answer":1,"explanation":"Veri Doğrulama liste, sayı ve tarih gibi giriş kuralları sağlar.","drill":null,"minutes":9,"real":"Stok projesinde Durum sütunu için Normal, Kritik ve Siparişte seçeneklerini içeren açılır liste kur.","version":"Tüm sürümler","refs":["ms-sort","ms-validation","ms-format","ms-table"]},{"id":"m08l05","module":8,"n":5,"title":"Koşullu biçimlendirmeyi kuralla yönet","body":"Koşullu biçimlendirme, verinin değerine veya bir formül sonucuna göre görünümü değiştirir. Aynı anda hem kuralı hem uygulanacak aralığı denetlemelisin. Bir satırın tamamını boyarken kontrol sütununu sabitleyip satırı göreli bırakmak çoğu zaman gerekir. Renk tek başına anlam taşımamalıdır.","steps":["A2:D20 aralığını seç.","Yeni formül kuralına =$D2\u003c10 yaz ve bir uyarı biçimi seç.","D sütunundaki değerleri eşik altı, eşit ve üstü yaparak satır vurgusunu denetle."],"example":"Uygulama aralığı: =$A$2:$D$20\nKural: =$D2\u003c10","pitfall":"=$D$2\u003c10 yazarsan her satır aynı tek hücreye bakar. Satırın gerektiğinde değişmesi gerekir.","question":"Tüm satırı D sütununa göre boyarken hangi başvuru uygundur?","options":["$D2","$D$2","D$2","$A$1"],"answer":0,"explanation":"Sütun D sabit, satır göreli kalmalıdır.","drill":null,"minutes":9,"real":"Stok projesinde stok miktarı eşikten düşükse satırı vurgula. Rengin yanında Kritik metni de göster.","version":"Tüm sürümler","refs":["ms-sort","ms-validation","ms-format","ms-table"]},{"id":"m08l06","module":8,"n":6,"title":"Mükerrerleri güvenle temizle","body":"Yinelenenleri Kaldır işlemi seçilen alanlara göre kayıt siler. Hangi alanların birlikte bir kaydı benzersiz tanımladığını bilmeden uygulamak veri kaybına yol açabilir. Önce ham veriyi koru, sonra mükerrerleri işaretle ve incele. Temizleme sonrası satır sayısı ile toplamların değişimini kaydet.","steps":["Ham veri sayfasının bir kopyasını al.","Benzersiz anahtar olarak kullanılacak alanları belirle; mükerrerleri say veya vurgula.","Doğruladıktan sonra Yinelenenleri Kaldır uygula; önceki ve sonraki kayıt sayısını karşılaştır."],"example":"Sipariş satırı anahtarı: SiparisNo + SatirNo\nYalnız SiparisNo her zaman yeterli değildir.","pitfall":"Aynı müşterinin iki gerçek siparişi mükerrer değildir. Görünüşte benzer olmak aynı kayıt olmak demek değildir.","question":"Mükerrer silmeden önce ilk güvenli adım nedir?","options":["Dosyayı kapatmak","Ham verinin kopyasını korumak","Tüm boşlukları silmek","Raporu yazdırmak"],"answer":1,"explanation":"Geri dönüş ve karşılaştırma için ham veri korunmalıdır.","drill":null,"minutes":9,"real":"Veri Temizleme atölyesinde adımları uygula. Kayıtların kimliğe göre nasıl tekilleştiğini gözle; ham veri kopyasını koru.","version":"Tüm sürümler","refs":["ms-sort","ms-validation","ms-format","ms-table"]},{"id":"m09l01","module":9,"n":1,"title":"FİLTRE ile dinamik sonuç listesi","body":"FİLTRE, koşulu sağlayan kayıtları yeni bir alana döndürür. Sonuç birden çok hücreye taşabilir; bu alan boş olmalıdır. Kaynak veriyi gizleyen normal filtre ile yeni sonuç dizisi üreten FİLTRE işlevi farklıdır. Kaynak ve koşul dizilerinin aynı kayıtları temsil etmesi gerekir.","steps":["A1:C5’e başlıklı bir satış listesi gir; bölgeyi B sütununda tut.","E2’ye =FİLTRE(A2:C5;B2:B5=\"Doğu\";\"Kayıt yok\") yaz.","Bölge değerlerini değiştir; sonuç listesinin boyutunun değiştiğini gözle."],"example":"=FİLTRE(A2:C5;B2:B5=\"Doğu\";\"Kayıt yok\")","pitfall":"Sonuç alanının içinde dolu hücre veya birleştirilmiş hücre varsa taşma engellenebilir.","question":"FİLTRE işlevi ne üretir?","options":["Kaynağı siler","Koşula uyan yeni sonuç dizisini","Yalnızca bir renk","Her zaman tek sayı"],"answer":1,"explanation":"FİLTRE kaynak veriden koşula uyan kayıtların yeni bir dizisini döndürür.","drill":null,"minutes":9,"real":"Gerçek Excel’de Satışlar verisini bölgeye göre FİLTRE ile listele. Eşleşmeyen bölge için anlaşılır boş sonuç metni yaz. 2016/2019 alternatifi: normal filtre veya Power Query.","version":"Microsoft 365 / Excel 2021 / 2024","refs":["ms-array","ms-arraysort","ms-functions","video-mike"]},{"id":"m09l02","module":9,"n":2,"title":"SIRALA ile canlı sıralı liste","body":"SIRALA, bir dizinin sıralanmış kopyasını döndürür; kaynak satırların yerini değiştirmez. Sıralama dizini seçtiğin dizinin içindeki sütun konumudur. Artan için 1, azalan için -1 kullanılır. Sonuç dinamik olarak büyüyebilir veya küçülebilir.","steps":["A2:C5’e ürün, adet ve tutar kayıtları gir.","E2’ye =SIRALA(A2:C5;3;-1) yaz.","Kaynak tutarlardan birini değiştir; sıralı çıktının güncellenmesini denetle."],"example":"=SIRALA(A2:C5;3;-1)","pitfall":"3, C sütununun her durumda numarası değildir; seçilen dizideki üçüncü sütundur.","question":"SIRALA’nın sıralama düzeni -1 ise hangi yön kullanılır?","options":["Artan","Azalan","Rastgele","Değişmez"],"answer":1,"explanation":"-1 azalan, 1 artan sıralamadır.","drill":null,"minutes":9,"real":"Gerçek Excel’de satış tutarlarını büyükten küçüğe sıralayan ayrı bir dinamik rapor alanı oluştur.","version":"Microsoft 365 / Excel 2021 / 2024","refs":["ms-array","ms-arraysort","ms-functions","video-mike"]},{"id":"m09l03","module":9,"n":3,"title":"BENZERSİZ ile tekil liste","body":"BENZERSİZ yinelenen değerlerin tekil listesini döndürür. Varsayılan kullanım, her farklı değeri bir kez gösterir; yalnızca kaynakta tam bir kez geçen değerleri seçmek ayrı bir seçenektir. Bu ayrım tekil müşteri listesi ile yalnızca tek sipariş veren müşteri analizini ayırır.","steps":["A2:A7’ye tekrarlanan bölge adları gir.","C2’ye =BENZERSİZ(A2:A7) yaz.","Yeni bir bölge ekle; doğru kaynak aralığı veya tablo başvurusuyla listenin güncellendiğini kontrol et."],"example":"=BENZERSİZ(A2:A7)","pitfall":"Benzersiz liste üretmek kaynak kayıtları silmez. Gerçek mükerrer kayıt temizliği ayrı iştir.","question":"Varsayılan BENZERSİZ ne yapar?","options":["Her farklı değeri bir kez gösterir","Tüm tekrar eden değerleri tamamen dışlar","Kaynak satırları siler","Yalnızca sayıları seçer"],"answer":0,"explanation":"Varsayılan davranış her farklı değerden tek örnek döndürmektir.","drill":null,"minutes":9,"real":"Gerçek Excel’de bölge listesini BENZERSİZ ile üret; ardından SIRALA ile alfabetik düzenle.","version":"Microsoft 365 / Excel 2021 / 2024","refs":["ms-array","ms-arraysort","ms-functions","video-mike"]},{"id":"m09l04","module":9,"n":4,"title":"SIRALI ve taşma alanları","body":"SIRALI, belirlediğin satır ve sütun sayısında ardışık değerler üretir. Tek formül bütün sonuç alanını yönetir. Taşan hücrelerin tek tek formülünü düzenlemek yerine başlangıç hücresindeki formülü değiştirirsin. #TAŞMA! hatasında önce çıktı alanını kontrol et.","steps":["A1’e =SIRALI(5;1;100;10) yaz.","100’den başlayıp 10 artan beş satırlı sonucu incele.","Formülü boş bir alanda yeniden dene; çıktı yoluna veri koyup taşma engelini gözle."],"example":"=SIRALI(5;1;100;10)\nSonuç: 100, 110, 120, 130, 140","pitfall":"Taşma alanını silmek için önce kaynak formülü düşün. Komşu kullanıcı verilerini düşünmeden temizleme.","question":"SIRALI(3;1;10;5) hangi listeyi üretir?","options":["10, 11, 12","5, 10, 15","10, 15, 20","3, 4, 5"],"answer":2,"explanation":"Üç satır; başlangıç 10; artış 5’tir.","drill":null,"minutes":9,"real":"Gerçek Excel’de 12 aylık numaralı bir plan oluştur. Sonuç aralığının boş olması gerektiğini test et.","version":"Microsoft 365 / Excel 2021 / 2024","refs":["ms-array","ms-arraysort","ms-functions","video-mike"]},{"id":"m09l05","module":9,"n":5,"title":"LET ile okunur formüller","body":"LET, formül içinde ara hesaplamalara ad vermeni sağlar. Aynı hesabı tekrar yazmak yerine bir kez tanımlayıp kullanırsın. Adlar formülün içinde geçerlidir. Bu yaklaşım uzun bir formülü küçük, anlamlı parçalar halinde açıklamayı kolaylaştırır. Önce basit ara hücrelerle mantığı kurmak iyi bir başlangıçtır.","steps":["B2’ye adet, C2’ye birim fiyat, D2’ye indirim oranı gir.","E2’de =LET(tutar;B2*C2;tutar*(1-D2)) hesapla.","Aynı sonucu yardımcı hücrelerle üret; iki yaklaşımı karşılaştır."],"example":"=LET(tutar;B2*C2;tutar*(1-D2))","pitfall":"Ad-değer çiftlerinden sonra son hesaplama gelmelidir. Hücre adresi gibi görünen adlardan kaçın.","question":"LET içindeki tutar adı nerede geçerlidir?","options":["Bütün bilgisayarda","Yalnızca ilgili formül içinde","Her Excel dosyasında","Sadece grafiklerde"],"answer":1,"explanation":"LET yerel adları tanımlandığı formül içinde kullanır.","drill":null,"minutes":9,"real":"Gerçek Excel’de önce üç yardımcı hücreyle hesap kur. Sonra LET ile birleştir; okunurluk kazancını not et.","version":"Microsoft 365 / Excel 2021 / 2024","refs":["ms-array","ms-arraysort","ms-functions","video-mike"]},{"id":"m09l06","module":9,"n":6,"title":"LAMBDA ile yeniden kullanılabilir işlev","body":"LAMBDA bir hesaplamayı parametreleri olan yeniden kullanılabilir bir işleve dönüştürmeyi sağlar. Önce hücre içinde parametrelerle çağırıp test et; sonra Ad Yöneticisi’nde anlamlı bir adla kaydet. Bu yaklaşım makro gerektirmeden ortak hesap kuralları oluşturabilir. Girdi sınırlarını ve hata durumlarını belgele.","steps":["Boş hücrede =LAMBDA(fiyat;oran;fiyat*(1-oran))(200;10%) formülünü test et.","Ad Yöneticisi’nde NetFiyat adıyla =LAMBDA(fiyat;oran;fiyat*(1-oran)) tanımla.","Bir hücrede =NetFiyat(300;20%) kullan; sonucu 240 ile karşılaştır."],"example":"=LAMBDA(fiyat;oran;fiyat*(1-oran))(200;10%)","pitfall":"Parametre tanımını test etmeden adlandırmak hatayı gizler. Bu işlevin desteklenmediği sürümler için alternatif bırak.","question":"LAMBDA’nın temel amacı nedir?","options":["Yazıcıyı yönetmek","Yeniden kullanılabilir özel hesaplama tanımlamak","Bütün makroları açmak","Sayfa rengini değiştirmek"],"answer":1,"explanation":"LAMBDA, parametreli özel hesaplamaları bir işlev olarak yeniden kullanmayı sağlar.","drill":null,"minutes":9,"real":"Gerçek Excel’de NetFiyat adlı LAMBDA oluştur; sıfır indirim, normal indirim ve sınır dışı oran için davranışını yazılı olarak tanımla.","version":"Microsoft 365 / Excel 2024; 2021’de yok","refs":["ms-lambda","ms-array","ms-arraysort","ms-functions","video-mike"]},{"id":"m10l01","module":10,"n":1,"title":"Soruna göre grafik seç","body":"Grafik türü, sorduğun soruya göre seçilir. Kategorileri karşılaştırmak için sütun veya çubuk; zaman içindeki değişim için çizgi; iki sayısal değişken arasındaki ilişki için dağılım grafiği uygundur. Önce tek cümlelik analiz sorusunu yaz; süslü grafik seçimiyle başlama.","steps":["Satış verisinden aylık toplamları ayrı bir özet alanda oluştur.","Soru olarak Aylık satış nasıl değişti? yaz ve çizgi grafiği ekle.","Başlığı ve eksenleri düzenle; grafiğin gerçekten bu soruya yanıt verdiğini kontrol et."],"example":"Karşılaştırma → çubuk/sütun\nZaman → çizgi\nİki sayısal değişken → dağılım","pitfall":"Ham satırların tamamını grafiğe atmak çoğu zaman okunmaz bir sonuç üretir; önce doğru seviyede özetle.","question":"Zaman içindeki aylık değişim için genellikle hangi grafik uygundur?","options":["Çizgi","Halka","Radar","Her durumda pasta"],"answer":0,"explanation":"Çizgi grafiği sıralı zaman noktaları arasındaki değişimi izlemeyi kolaylaştırır.","drill":null,"minutes":9,"real":"Satış projesinde aylık net tutarları özetle ve bu seriden bir çizgi grafiği oluştur.","version":"Tüm sürümler","refs":["ms-start","ms-pivot","xel-library"]},{"id":"m10l02","module":10,"n":2,"title":"Çubuk grafikle kategorileri karşılaştır","body":"Çubuk grafik, özellikle uzun kategori adları olduğunda okunaklıdır. Kategorileri anlamlı biçimde sıralamak karşılaştırmayı hızlandırır. Çubuk uzunluğu büyüklüğü kodladığı için değer eksenini sıfırdan başlatmak yanıltıcı farkları azaltır. Ölçü birimini ve dönemi açık yaz.","steps":["Bölgelere göre toplam tutar tablosu oluştur.","Yatay çubuk grafik ekle; kategorileri tutara göre sırala.","Başlığa dönemi, eksene birimi ekle ve sıfır başlangıcını denetle."],"example":"Başlık: Ocak net satışları, bölge bazında\nBirim: TL (eğitim verisi)","pitfall":"Çubuk grafikte ekseni dar bir aralıktan başlatmak küçük farkları abartabilir.","question":"Çubuk grafiklerde sıfır başlangıcı neden önemlidir?","options":["Renkleri artırır","Uzunluk karşılaştırmasını dürüst tutar","Dosyayı küçültür","Filtreleri kapatır"],"answer":1,"explanation":"Çubuk uzunluğu değeri temsil ettiği için başlangıcın kesilmesi görsel oranları bozabilir.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-pivot","xel-library"]},{"id":"m10l03","module":10,"n":3,"title":"Çizgi grafik ve tarih sırası","body":"Çizgi grafikte zamanın doğru sıralanması esastır. Metin olarak saklanan ay adları alfabetik sıralanabilir ve sahte bir zaman çizgisi oluşturabilir. Eksik dönem ile sıfır satış dönemi aynı değildir; grafikteki boşluk davranışını bilinçli seç.","steps":["Ay başlangıçlarını gerçek tarih olarak oluştur ve artan sırala.","Aylık toplamları çizgi grafiğe bağla.","Eksik bir ayı boş bırakarak ve 0 yazarak iki farklı görünümü incele."],"example":"2026-01-01, 2026-02-01, 2026-03-01\nEkran biçimi: Oca, Şub, Mar","pitfall":"Ay adlarını yalnızca metin olarak kullanmak sıra ve yıl bilgisini kaybettirebilir.","question":"Zaman ekseninde en güvenilir temel hangisidir?","options":["Alfabetik ay adları","Rastgele satır sırası","Gerçek tarih değerleri","Yalnızca renkler"],"answer":2,"explanation":"Gerçek tarihler kronolojik sırayı ve yıllar arasındaki ayrımı korur.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-pivot","xel-library"]},{"id":"m10l04","module":10,"n":4,"title":"Dağılım grafiği ve ilişki","body":"Dağılım grafiği iki sayısal değişkeni nokta konumlarıyla gösterir. Örneğin adet ile satır tutarı arasındaki ilişkiyi inceleyebilirsin. Görsel ilişki nedensellik kanıtı değildir; başka değişkenler, uç değerler veya farklı gruplar etkili olabilir. Noktaların neyi temsil ettiğini açıkla.","steps":["Bir sütuna adet, yanına tutar değerlerini hazırla.","XY dağılım grafiği ekle; yatay eksenin adedi kullandığını doğrula.","Aykırı noktaları kaynak satırlarla eşleştir ve olası açıklamalarını not et."],"example":"X ekseni: Adet\nY ekseni: Net tutar\nHer nokta: bir satış kaydı","pitfall":"İki değişkenin birlikte hareket etmesi, birinin diğerine neden olduğunu tek başına kanıtlamaz.","question":"Dağılım grafiğinde bir nokta genellikle neyi temsil eder?","options":["İki sayısal değeri olan bir gözlemi","Bir sayfa adını","Bir yazıcıyı","Yalnızca toplamı"],"answer":0,"explanation":"Her gözlem, iki sayısal değişkenin oluşturduğu koordinatta yer alır.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-pivot","xel-library"]},{"id":"m10l05","module":10,"n":5,"title":"Birleşik grafik ve ölçek uyarısı","body":"Birleşik grafik farklı serileri bir arada gösterebilir. Adet ile oran gibi farklı birimleri tek eksene koymak anlamsız olabilir; ikincil eksen bazen yardımcıdır. Ancak iki eksen görsel ilişkiyi abartabilir. Birimler ve hangi serinin hangi ekseni kullandığı açık olmalıdır.","steps":["Aylık adet ile hedef gerçekleşme oranını ayrı sütunlarda hazırla.","Birleşik grafikte adedi sütun, oranı çizgi olarak seç.","Gerekli ikincil ekseni ekle; her iki eksenin birimini ve sınırlarını açıkça belirt."],"example":"Adet → sol eksen\nGerçekleşme (%) → sağ eksen","pitfall":"İki eksenin ölçeğini görsel uyum yaratmak için gelişigüzel ayarlama; ayrı grafikler daha açık olabilir.","question":"İkincil eksen kullanıldığında hangi bilgi özellikle açık olmalıdır?","options":["Dosya konumu","Hangi serinin hangi birim ve eksene bağlı olduğu","Hücre rengi","Makro adı"],"answer":1,"explanation":"Farklı ölçekler açıkça etiketlenmezse okur yanlış karşılaştırma yapabilir.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-start","ms-pivot","xel-library"]},{"id":"m10l06","module":10,"n":6,"title":"Sade bir gösterge paneli kur","body":"Gösterge paneli her şeyi aynı anda gösteren bir sayfa değil, belirli kararlar için hazırlanmış özettir. Dönem, filtreler, ölçü tanımları ve yenileme zamanı görünür olmalıdır. Ayrıntıyı ayrı sayfalarda tut; ana sayfada az sayıda anlamlı gösterge kullan. Okur bir sonucun nereden geldiğini izleyebilmelidir.","steps":["Raporun yanıtlayacağı üç soruyu ve hedef kullanıcısını yaz.","Toplam tutar, dönem eğilimi ve bölge karşılaştırmasını ayrı bloklar halinde yerleştir.","Filtre durumunu, birimi, veri kaynağını ve yenileme bilgisini ekleyerek raporu test et."],"example":"Üst: dönem + ana göstergeler\nOrta: eğilim + karşılaştırma\nAlt: tanımlar + kaynak + güncelleme","pitfall":"Filtreli raporu filtresiz gibi sunma. Süsler, temel bilgiyi gölgelememelidir.","question":"İyi bir panelde aşağıdakilerden hangisi görünür olmalıdır?","options":["Yalnızca logo","Filtreler, dönem ve ölçü tanımları","Her hücrenin adresi","Bütün ham satırlar"],"answer":1,"explanation":"Okurun sayının kapsamını anlaması için dönem, filtre ve ölçü tanımı gerekir.","drill":null,"minutes":9,"real":"Satış projesinin rapor sayfasında üç gösterge, iki grafik ve bir filtre alanı kur. Sayfayı başka birinin açıklama almadan okuyabileceği hale getir.","version":"Tüm sürümler","refs":["ms-start","ms-pivot","xel-library"]},{"id":"m11l01","module":11,"n":1,"title":"İlk PivotTable’ını oluştur","body":"PivotTable, ayrıntılı kayıtları satır ve sütun alanlarına göre özetler. Kaynak tabloda her sütunun başlığı olmalı, aynı sütunda tutarlı veri türleri bulunmalıdır. Pivot oluşturmak kaynağı değiştirmez; ondan ayrı bir özet görünümü üretir. Önce cevaplayacağın soruyu belirle.","steps":["Satış listesini başlıklı bir Excel tablosuna dönüştür.","Ekle \u003e PivotTable ile yeni sayfaya rapor ekle.","Bölge alanını Satırlar’a, NetTutar alanını Değerler’e yerleştir."],"example":"Soru: Bölgelere göre net satış toplamı nedir?\nSatırlar: Bölge • Değerler: NetTutar toplamı","pitfall":"Boş başlık veya karışık veri türleri özetlemeyi zorlaştırır. Kaynağı düzeltmek pivotu düzeltmenin ilk adımıdır.","question":"PivotTable’ın temel amacı nedir?","options":["Ham veriyi anlamlı gruplar halinde özetlemek","Dosya şifrelemek","Her satırı silmek","Makro çalıştırmak"],"answer":0,"explanation":"PivotTable ayrıntılı veriden gruplara göre özetler oluşturur.","drill":null,"minutes":9,"real":"Atölye \u003e Pivot simülatöründe Bölge ve NetTutar seç. Aynı raporu indirilen çalışma kitabında gerçek PivotTable ile tekrar oluştur.","version":"Tüm sürümler","refs":["ms-pivot","video-tr"]},{"id":"m11l02","module":11,"n":2,"title":"Satırlar, sütunlar, değerler, filtreler","body":"Pivot alanlarının yerleri raporun sorusunu değiştirir. Satırlar ve sütunlar kategorileri düzenler; Değerler hesaplanacak ölçüyü; Filtreler raporun kapsamını belirler. Aynı veriyle farklı açılardan analiz yapabilirsin. Çok fazla alanı bir arada kullanmak okunurluğu azaltabilir.","steps":["Bölge’yi Satırlar’a, Ay’ı Sütunlar’a yerleştir.","NetTutar’ı Değerler’e, Urun’u Filtreler’e ekle.","Ürün filtresini değiştir; bölge-ay toplamlarının nasıl değiştiğini incele."],"example":"Satırlar: Bölge\nSütunlar: Ay\nDeğerler: NetTutar\nFiltre: Urun","pitfall":"Kapsamı değiştiren filtreyi raporda görünür tut. Aynı sayı farklı filtrelerde farklı anlam taşır.","question":"Toplanacak sayısal alan hangi bölüme yerleştirilir?","options":["Satırlar","Sütunlar","Değerler","Sayfa adı"],"answer":2,"explanation":"Değerler bölümü toplam, sayım veya ortalama gibi hesaplamaları barındırır.","drill":null,"minutes":9,"real":"Örneği gerçek Excel’de boş bir çalışma sayfasında yeniden kur. Bir giriş değerini değiştir; sonucun neden değiştiğini bir cümleyle not et.","version":"Tüm sürümler","refs":["ms-pivot","video-tr"]},{"id":"m11l03","module":11,"n":3,"title":"Toplam mı, sayım mı, ortalama mı?","body":"PivotTable bazen sayısal görünen bir alanı sayım olarak ekler; veri türlerini incelemek gerekir. Toplam, kayıt sayısı ve ortalama farklı sorulara cevap verir. Birim fiyatların basit ortalaması, adet ağırlıklı ortalama fiyat değildir. Doğru özet türünü iş ihtiyacına göre seç.","steps":["NetTutar alanının Değer Alanı Ayarları’nı aç.","Toplam, Say ve Ortalama arasında geçiş yaparak sonuçları karşılaştır.","Kaynakta metin biçimindeki sayılar ve boş değerler bulunup bulunmadığını denetle."],"example":"Toplam: satış büyüklüğü\nSayım: kayıt adedi\nOrtalama: kayıt başına ortalama tutar","pitfall":"Sayımın müşteri adedi olduğunu varsayma; her müşteri birden çok satış kaydına sahip olabilir.","question":"Satış satırlarını saymak her zaman tekil müşteri sayısını verir mi?","options":["Evet","Hayır","Yalnızca renklendirilirse","Yalnızca filtre varsa"],"answer":1,"explanation":"Bir müşterinin birden çok satırı olabilir; tekil müşteri sayımı ayrı tanım gerektirir.","drill":null,"minutes":9,"real":"Pivot simülatöründe aynı alanı Toplam, Kayıt sayısı ve Ortalama ile incele. Üç ölçünün ne anlattığını not et.","version":"Tüm sürümler","refs":["ms-pivot","video-tr"]},{"id":"m11l04","module":11,"n":4,"title":"Gruplama ve toplamın yüzdesi","body":"PivotTable tarihlerden yıl ve ay grupları oluşturabilir; gerçek tarih değerleri gerekir. Değerleri Göster seçenekleri, tutarı toplamın yüzdesi olarak sunabilir. Satır toplamı yüzdesi ile genel toplam yüzdesi farklı paydalar kullanır. Yüzdenin neye göre hesaplandığını başlıkta belirt.","steps":["Gerçek tarih içeren alanı pivot satırlarına ekle.","Tarihleri yıl ve ay olarak gruplandır.","Tutarı ikinci kez Değerler’e ekle; ikinci gösterimi genel toplamın yüzdesi yap."],"example":"Tutar: 250\nGenel toplam: 1000\nGenel toplam payı: %25","pitfall":"Yalnızca ay gruplamak f
